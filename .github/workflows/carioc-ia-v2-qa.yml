name: Carioc-IA V2 QA
on:
  push:
    branches:
      - revision/rendimiento-traducciones-81a904c
    paths:
      - 'assets/js/carioc-ia*.js'
      - 'assets/js/app.js'
      - 'assets/js/site.js'
      - 'scripts/build_carioc_ia_site_index.mjs'
      - 'docs/CARIOC_IA_SITE_INDEX_ROUTES.json'
      - 'scripts/test_carioc_ia.mjs'
      - 'assets/js/carioc-ia-site-index.js'
      - 'scripts/audit_carioc_ia_v2_120.mjs'
      - 'docs/CARIOC_IA_V2_120_QUESTIONS.csv'
      - 'package.json'
      - '.github/workflows/carioc-ia-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/carioc-ia-engine.js
          node --check assets/js/carioc-ia-site-index.js
          node --check assets/js/carioc-ia.js
          node --check assets/js/carioc-ia-bootstrap.js
          node --check assets/js/app.js
          node --check assets/js/site.js
          node --check scripts/build_carioc_ia_site_index.mjs
          node scripts/build_carioc_ia_site_index.mjs
          node --check assets/js/carioc-ia-knowledge.js
          node --check assets/js/carioc-ia-library.js
          node --check scripts/test_carioc_ia.mjs
          node --check scripts/audit_carioc_ia_v2_120.mjs
      - name: Existing Carioc-IA tests
        run: npm run test:cariocia
      - name: V2 scenario diagnostics (non-blocking editorial coverage)
        run: npm run audit:cariocia:v2:strict
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carioc-ia-v2-diagnostics
          path: CARIOC_IA_V2_DIAGNOSTIC.json
          if-no-files-found: ignore
