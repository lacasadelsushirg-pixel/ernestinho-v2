name: Sitemap release safety guard — protect public 2481 URLs
on:
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'scripts/generate_sitemap.mjs'
      - '.github/workflows/sitemap-prepublication-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  block-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect unintentional loss of public sitemap URLs
        run: node scripts/sitemap_prepublication_guard.mjs sitemap.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemap-production-preservation-audit
          path: sitemap-safety-preflight.json
          retention-days: 10
          if-no-files-found: warn
