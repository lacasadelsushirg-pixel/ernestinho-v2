name: Verify published transfer pricing ES PT EN in Chromium
on:
  pull_request:
    paths:
      - 'scripts/qa_public_transfer_rates_20261102.mjs'
      - '.github/workflows/verify-public-transfer-rates-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check real public transfer page, ES PT EN, cutoff date and booking price
        run: node scripts/qa_public_transfer_rates_20261102.mjs
