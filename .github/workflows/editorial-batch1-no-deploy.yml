name: Editorial batch 1 — 9 routes, ES PT EN (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'hospedaje/index.html'
      - 'assets/css/hospedaje.css'
      - 'assets/js/hospedaje.js'
      - 'assets/js/site.js'
      - 'assets/css/editorial-lote1.css'
      - 'assets/js/translations/editorial-lote1.js'
      - 'compras/feira-saens-pena/index.html'
      - 'compras/mercados-populares/index.html'
      - 'consejos/atardeceres-inolvidables/index.html'
      - 'experiencias/bioparque/index.html'
      - 'experiencias/vidigal/index.html'
      - 'destinos/buzios/index.html'
      - 'destinos/buzios/playas/index.html'
      - 'cultura/nossa-senhora-paz/index.html'
      - '.github/workflows/editorial-batch1-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VERCEL: '1'
      EC_BUILD_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Verify translation module syntax
        run: node --check assets/js/translations/editorial-lote1.js
      - name: Render exactly 9 editorial routes in three locales, never full rebuild
        run: node scripts/build_multilingual.mjs --routes=/hospedaje/,/compras/feira-saens-pena/,/compras/mercados-populares/,/consejos/atardeceres-inolvidables/,/experiencias/bioparque/,/experiencias/vidigal/,/destinos/buzios/,/destinos/buzios/playas/,/cultura/nossa-senhora-paz/
      - name: Verify 27 published-format pages in three languages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from html import unescape
          import re
          routes=['hospedaje','compras/feira-saens-pena','compras/mercados-populares','consejos/atardeceres-inolvidables','experiencias/bioparque','experiencias/vidigal','destinos/buzios','destinos/buzios/playas','cultura/nossa-senhora-paz']
          root=Path('dist')
          keys={'compras/feira-saens-pena':('La feria que muestra el lado cotidiano','A feira que revela o cotidiano','An artisan market at the heart'),
                'experiencias/bioparque':('BioParque do Rio: naturaleza','BioParque do Rio: natureza','BioParque do Rio: wildlife'),
                'experiencias/vidigal':('Vidigal: una comunidad','Vidigal: uma comunidade','Vidigal: a community'),
                'destinos/buzios/playas':('No todas las playas','Nem todas as praias','Not all Búzios beaches'),
                'cultura/nossa-senhora-paz':('Una iglesia que cuenta la historia','Uma igreja que conta a história','A church that tells the story')}
          for route in routes:
           for n,(lang,prefix) in enumerate([('es',''),('pt','pt/'),('en','en/')]):
            p=root/prefix/route/'index.html'
            assert p.is_file(),p
            html=unescape(p.read_text())
            assert 'rel="canonical"' in html,(p,'canonical')
            if route in keys:
             assert keys[route][n] in html,(str(p),keys[route][n])
             if lang!='es': assert keys[route][0] not in html,(str(p),'ES found')
            if route=='experiencias/bioparque':
             assert ('Reino dos Axolotes' in html or 'Kingdom of Axolotls' in html),p
            if route=='experiencias/vidigal' and lang!='es':
             assert 'Estamos preparando algo espectacular para ti' not in html,p
             assert '¡En breve tendremos una experiencia espectacular para ti!' not in html,p
            if route=='compras/feira-saens-pena' and lang=='en':
             assert 'Saens Peña craft fair in Tijuca' in html,p
            if route=='cultura/nossa-senhora-paz' and lang=='en':
             assert 'Our Lady of Peace Church' in html,p
             assert len(re.sub(r'<[^>]+>',' ',html))>3000,p
            if route=='hospedaje':
             assert html.count('class="feature stay-feature"')==12,(str(p),'cards')
             assert html.count('class="stay-feature-photo"')==12,(str(p),'photos')
             assert 'index.editorial2' in html or 'Where you stay should be part of the holiday' in html
             if lang=='en':
              assert 'Where you stay should be part of the holiday' in html
              assert 'Rio Guide' in html and 'Tours & Experiences' in html and 'Stays' in html,p
             if lang=='pt':
              assert 'Guia do Rio' in html and 'Passeios e Experiências' in html,p
          print('PASS 27 locale HTML; 12 full-image lodging cards; scoped content and translations.')
          PY
      - name: Preserve all existing assets; do not deploy or publish a pilot sitemap
        run: |
          echo 'READ-ONLY BUILD: 9 routes × 3 languages. No Hostinger deploy.'
          echo 'No sitemap.xml, locale-manifest.json or shared production JS publication.'
      - name: Prepare scoped release package only (NO HOSTINGER DEPLOY)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import zipfile,json
          routes=['hospedaje','compras/feira-saens-pena','compras/mercados-populares','consejos/atardeceres-inolvidables','experiencias/bioparque','experiencias/vidigal','destinos/buzios','destinos/buzios/playas','cultura/nossa-senhora-paz']
          html=[(Path('dist')/prefix/route/'index.html',prefix+route+'/index.html') for prefix in ('','pt/','en/') for route in routes]
          assert len(html)==27 and all(p.is_file() for p,_ in html)
          runtime=['assets/css/hospedaje.css','assets/css/editorial-lote1.css','assets/js/hospedaje.js','assets/js/site.js','assets/js/translations/editorial-lote1.js']
          assert all(Path(p).is_file() for p in runtime)
          archive=Path('editorial-lote1-review-before-upload.zip')
          instructions=('LOTE 1 — PRUEBAS COMPLETADAS, NO PUBLICADO AUTOMÁTICAMENTE.\n'
            '27 HTML ES/PT/EN + 5 archivos compartidos de estilos y scripts.\n'
            'Respaldar cada archivo público ANTES de modificarlo.\n'
            'IMPORTANTÍSIMO: no sobrescribir assets/js/site.js sin comparar con la versión vigente en Hostinger: puede contener otros avances de Carioc-IA u otros módulos.\n'
            'Conciliar igualmente los demás archivos compartidos.\n'
            'Publicar ÚNICAMENTE las rutas revisadas mediante copia incremental.\n'
            'NO contiene ni debe sobreescribir sitemap.xml, robots.txt, locale-manifest.json ni la portada general index.html.\n'
            'Verificar tres idiomas, fotografías enteras, menú global y rastreo después de publicar.\n'
            'El paquete no debe ejecutarse como despliegue completo.\n')
          entries=[(p,d,'html') for p,d in html]+[(Path(p),p,'runtime-review') for p in runtime]
          manifest={'html_count':len(html),'runtime_count':len(runtime),'manual_review_required':True,'no_full_deploy':True,
            'files':[{'path':dst,'kind':kind,'sha256':sha256(p.read_bytes()).hexdigest()} for p,dst,kind in entries]}
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=7) as z:
           for p,dst,_ in entries:z.write(p,dst)
           z.writestr('INSTRUCCIONES_PUBLICACION_SELECTIVA.txt',instructions)
           z.writestr('MANIFEST_SHA256.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('Release staged:',archive,'files',len(entries),'bytes',archive.stat().st_size)
          PY
      - name: Archive approved selective release for manual reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: editorial-lote1-publicacion-selectiva-revisada
          path: editorial-lote1-review-before-upload.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save 27 reviewed HTML as downloadable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-lote1-27-pages-no-deploy
          path: |
            dist/hospedaje/index.html
            dist/pt/hospedaje/index.html
            dist/en/hospedaje/index.html
            dist/compras/feira-saens-pena/index.html
            dist/pt/compras/feira-saens-pena/index.html
            dist/en/compras/feira-saens-pena/index.html
            dist/compras/mercados-populares/index.html
            dist/pt/compras/mercados-populares/index.html
            dist/en/compras/mercados-populares/index.html
            dist/consejos/atardeceres-inolvidables/index.html
            dist/pt/consejos/atardeceres-inolvidables/index.html
            dist/en/consejos/atardeceres-inolvidables/index.html
            dist/experiencias/bioparque/index.html
            dist/pt/experiencias/bioparque/index.html
            dist/en/experiencias/bioparque/index.html
            dist/experiencias/vidigal/index.html
            dist/pt/experiencias/vidigal/index.html
            dist/en/experiencias/vidigal/index.html
            dist/destinos/buzios/index.html
            dist/pt/destinos/buzios/index.html
            dist/en/destinos/buzios/index.html
            dist/destinos/buzios/playas/index.html
            dist/pt/destinos/buzios/playas/index.html
            dist/en/destinos/buzios/playas/index.html
            dist/cultura/nossa-senhora-paz/index.html
            dist/pt/cultura/nossa-senhora-paz/index.html
            dist/en/cultura/nossa-senhora-paz/index.html
          retention-days: 15
          if-no-files-found: warn
