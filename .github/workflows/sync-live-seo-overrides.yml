name: Sync verified live SEO override into PR source only (no deploy)
on:
  pull_request:
    paths:
      - '.github/workflows/sync-live-seo-overrides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Insert only verified editorial SEO override from current public module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,re
          url='https://www.ernestinhocarioca.com.br/assets/js/seo-metadata.js?ec_sync_source=20261102'
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=35) as response:
           assert response.status==200
           public=response.read().decode('utf-8')
          start='// BEGIN_EDITORIAL_RELEASE_META_20261102'
          end='// END_EDITORIAL_RELEASE_META_20261102'
          pattern=re.escape(start)+r'[\s\S]*?'+re.escape(end)
          blocks=re.findall(pattern,public)
          assert len(blocks)==1,'Expected one reviewed live metadata patch block'
          block=blocks[0]
          assert block.count('gastronomia/merci')>=1,'Published release metadata missing'
          target=Path('assets/js/seo-metadata.js')
          original=target.read_text()
          assert 'export const SEO_METADATA = {' in original
          assert 'export function applySeoMetadata' in original
          if start in original:original=re.sub(pattern,'',original)
          fixed=original.replace('export function applySeoMetadata',block+'\nexport function applySeoMetadata',1)
          target.write_text(fixed)
          print('Source synchronised: only 20261102 published SEO override block; other code untouched.')
          PY
          node --check assets/js/seo-metadata.js
      - name: Commit only when the source actually changed
        run: |
          git diff --check
          git config user.name "Ernestinho Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/js/seo-metadata.js; then
            echo "Already synchronised; no commit."
          else
            git add assets/js/seo-metadata.js
            git commit -m "seo: preserve 111 production titles/descriptions in source"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
