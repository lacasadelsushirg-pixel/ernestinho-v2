name: Diagnose incremental Hostinger publication (read-only)
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-hostinger-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find workflow files and configured credential names (never values)
        env:
          C0: ${{ secrets.HOSTINGER_FTP_HOST }}
          C1: ${{ secrets.HOSTINGER_FTP_USER }}
          C2: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          C3: ${{ secrets.FTP_SERVER }}
          C4: ${{ secrets.FTP_USERNAME }}
          C5: ${{ secrets.FTP_PASSWORD }}
          C6: ${{ secrets.FTP_HOST }}
          C7: ${{ secrets.FTP_USER }}
          C8: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          C9: ${{ secrets.SFTP_HOST }}
          C10: ${{ secrets.SFTP_USER }}
          C11: ${{ secrets.SFTP_PASSWORD }}
        run: |
          echo 'Repository workflow filenames:'
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
          echo 'Which workflows mention deployment? (filenames only)'
          grep -liE 'hostinger|ftp|sftp|ssh|deploy' .github/workflows/* | sed 's|.*/||' | sort -u || true
          echo 'Configured credentials (presence only):'
          if [ -n "$C0" ]; then echo "HOSTINGER_FTP_HOST=CONFIGURED"; else echo "HOSTINGER_FTP_HOST=NOT_CONFIGURED"; fi
          if [ -n "$C1" ]; then echo "HOSTINGER_FTP_USER=CONFIGURED"; else echo "HOSTINGER_FTP_USER=NOT_CONFIGURED"; fi
          if [ -n "$C2" ]; then echo "HOSTINGER_FTP_PASSWORD=CONFIGURED"; else echo "HOSTINGER_FTP_PASSWORD=NOT_CONFIGURED"; fi
          if [ -n "$C3" ]; then echo "FTP_SERVER=CONFIGURED"; else echo "FTP_SERVER=NOT_CONFIGURED"; fi
          if [ -n "$C4" ]; then echo "FTP_USERNAME=CONFIGURED"; else echo "FTP_USERNAME=NOT_CONFIGURED"; fi
          if [ -n "$C5" ]; then echo "FTP_PASSWORD=CONFIGURED"; else echo "FTP_PASSWORD=NOT_CONFIGURED"; fi
          if [ -n "$C6" ]; then echo "FTP_HOST=CONFIGURED"; else echo "FTP_HOST=NOT_CONFIGURED"; fi
          if [ -n "$C7" ]; then echo "FTP_USER=CONFIGURED"; else echo "FTP_USER=NOT_CONFIGURED"; fi
          if [ -n "$C8" ]; then echo "HOSTINGER_SSH_PRIVATE_KEY=CONFIGURED"; else echo "HOSTINGER_SSH_PRIVATE_KEY=NOT_CONFIGURED"; fi
          if [ -n "$C9" ]; then echo "SFTP_HOST=CONFIGURED"; else echo "SFTP_HOST=NOT_CONFIGURED"; fi
          if [ -n "$C10" ]; then echo "SFTP_USER=CONFIGURED"; else echo "SFTP_USER=NOT_CONFIGURED"; fi
          if [ -n "$C11" ]; then echo "SFTP_PASSWORD=CONFIGURED"; else echo "SFTP_PASSWORD=NOT_CONFIGURED"; fi
