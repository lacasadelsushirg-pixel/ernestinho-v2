name: Final audit — all 118 published PT EN in Chromium
on:
  pull_request:
    paths:
      - 'scripts/audit_live_118_browser.mjs'
      - '.github/workflows/audit-live-118-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit 118 live ES-independent Portuguese and English pages in Chromium
        run: node scripts/audit_live_118_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-translation-browser-audit-118
          path: qa-live-118-translations.json
          retention-days: 10
          if-no-files-found: warn
