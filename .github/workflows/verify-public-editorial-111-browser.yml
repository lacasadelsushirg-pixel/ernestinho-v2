name: Public UI browser check — 111 published ES PT EN pages
on:
  pull_request:
    paths:
      - 'scripts/verify_public_editorial_111_browser.mjs'
      - '.github/workflows/verify-public-editorial-111-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit 111 real public HTML pages in headless Chromium, including CSS and page language
        run: node scripts/verify_public_editorial_111_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-qa-111-20261102
          path: qa-public-editorial-111-browser.json
          retention-days: 10
          if-no-files-found: warn
