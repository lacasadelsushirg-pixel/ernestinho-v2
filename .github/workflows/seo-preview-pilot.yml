name: SEO selected-locale preview (NO DEPLOY)
on:
  push:
    branches:
      - seo/traducciones-continuacion-lote2-20261102
    paths:
      - '.github/workflows/seo-preview-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL: '1'
      EC_BUILD_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install existing build dependencies
        run: npm ci --no-audit --no-fund
      - name: Render ONLY 2 diagnostic routes in ES/PT/EN (isolated runner)
        run: node scripts/build_multilingual.mjs --routes=/compras/mercadao-madureira/,/gastronomia/adega-perola/
      - name: Verify 4 translated pages using source dictionaries and generated HTML
        run: node scripts/verify_rendered_editorial.mjs --routes=/compras/mercadao-madureira/,/gastronomia/adega-perola/
      - name: Confirm non-public isolated preview
        run: echo 'Only GitHub runner dist/ was generated. No Hostinger deploy or production sitemap modification.'
