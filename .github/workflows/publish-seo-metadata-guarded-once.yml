name: Publish reconciled 37-route SEO metadata to Hostinger (guarded, one time)
on:
  pull_request:
    paths:
      - '.github/workflows/publish-seo-metadata-guarded-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python cryptography and HTTP deps
        run: python3 -m pip install --quiet --break-system-packages cryptography requests
      - name: Generate ephemeral RSA key for this run
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ec-hostinger-seo-private.pem 2>/dev/null
          openssl pkey -in /tmp/ec-hostinger-seo-private.pem -pubout -out ec-hostinger-seo-public.pem 2>/dev/null
          cp ec-hostinger-seo-public.pem /tmp/ec-hostinger-seo-public.pem
      - name: Export harmless public key mid-run for sealed credential handoff
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-public-key-only-seo-patch
          path: ec-hostinger-seo-public.pem
          retention-days: 1
      - name: Patch exactly one existing SEO JS file after backup and 111 title checks
        run: python3 -u scripts/patch_public_seo_metadata_guarded.py
      - name: Save original server bytes and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarded-seo-metadata-original-backup-and-proof
          path: release-evidence-seo/
          retention-days: 10
          if-no-files-found: warn
