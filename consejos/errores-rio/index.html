function load(){DATA={"CONSEJOS_NUEVOS":[{"id":"seguro-viaje","icon":"🛡️","titulo":"Por qué viajar con seguro","intro":"Una urgencia, una cancelación o una maleta perdida pueden cambiar el viaje. El seguro no evita el problema, pero puede darte asistencia y proteger tu presupuesto.","tips":["Contrata antes de viajar y guarda la póliza, el número de asistencia y el comprobante de compra sin conexión.","No elijas solamente por precio: compara gastos médicos, medicamentos, hospitalización, repatriación, equipaje, demoras y cancelaciones.","Declara y revisa enfermedades preexistentes, embarazo, edad, deportes y actividades de aventura; pueden tener límites o exclusiones especiales.","Ante una urgencia grave, protege primero a la persona y llama al 192. Cuando sea posible, contacta después a la central del seguro y sigue el procedimiento indicado.","Conserva recetas, diagnósticos, informes, facturas y comprobantes. Son importantes para solicitar reembolsos.","Lee la póliza completa antes de pagar. La cobertura, las exclusiones y la forma de atención dependen del plan contratado."]},{"id":"recorridos-cuenta","icon":"🗺️","titulo":"Recorridos para hacer por tu cuenta","intro":"Rutas preparadas por Ernestinho para caminar Río a tu ritmo, con paradas, consejos y mapa interactivo.","tips":[]},{"id":"semana","icon":"📆","titulo":"Qué hacer cada día de la semana","intro":"Siete planes de mañana, tarde y noche para que no llegues a Río preguntándote qué estará abierto.","tips":["LUNES · Comienza con Cristo o Pan de Azúcar por la mañana. Almuerza en Copacabana, recorre Forte de Copacabana y Arpoador por la tarde y confirma una roda de samba en Pedra do Sal para la noche. Muchos museos cierran: revisa antes.","MARTES · Dedica la mañana al Centro histórico: Real Gabinete, Colombo, CCBB y Praça XV. Sube a Santa Teresa por la tarde y termina entre Selarón y Lapa, siempre comprobando la programación nocturna.","MIÉRCOLES · Día de Zona Sur: Jardim Botânico y Parque Lage temprano, almuerzo en Botafogo y playa en Ipanema. Termina con el atardecer de Arpoador y una cena o bar en Ipanema.","JUEVES · Explora Urca: Praia Vermelha, Pista Cláudio Coutinho y almuerzo en el barrio. Sube al Pan de Azúcar para la hora dorada y luego disfruta la Mureta da Urca.","VIERNES · Reserva una excursión a Petrópolis, Niterói o una experiencia de aventura. Al regresar, elige samba, pagode, bares de Botafogo o vida nocturna de Lapa según la agenda.","SÁBADO · Ideal para Búzios, Arraial, Angra, Ilha Grande o un Full Day Río. Si te quedas en la ciudad, combina Feira de São Cristóvão, Maracaná y una noche con música.","DOMINGO · Camina o pedalea por las orlas con carriles recreativos, visita Feira da Glória por la mañana, almuerza cerca de la playa y termina en Ipanema, Urca o Parque da Cidade. Confirma horarios dominicales."]},{"id":"lluvia","icon":"🌧️","titulo":"Un día completo en Río cuando llueve","intro":"Un plan atractivo y cubierto para transformar la lluvia en una jornada cultural, gastronómica y divertida.","tips":["09:00 · Comienza en AquaRio: es una actividad cubierta, familiar y fácil de combinar con la Zona Portuaria. Compra entrada anticipada cuando exista alta demanda.","11:30 · Continúa hacia Museu do Amanhã o MAR. Ambos permiten pasar varias horas aprendiendo sin depender de la playa; revisa cuál está abierto ese día.","13:30 · Almuerza en el Centro: prueba un buffet por kilo, un prato feito o entra a Confeitaria Colombo para vivir una experiencia histórica.","15:00 · Visita Real Gabinete, CCBB o Centro Cultural Banco do Brasil. Agrupa lugares cercanos para evitar trayectos largos bajo la lluvia.","17:30 · Si la lluvia continúa, elige un shopping, cine, teatro, boliche, experiencia gastronómica o una cafetería de Copacabana, Botafogo o Barra.","Con niños · AquaRio, museos interactivos, centros comerciales y espacios culturales son mejores que trasladarse continuamente entre barrios.","Alerta importante · Con tormenta eléctrica evita playas, miradores, senderos, árboles, cascadas y áreas inundadas. No cruces agua acumulada aunque otros vehículos lo hagan.","Consejo de Ernestinho · Mira Alerta Rio antes de salir y reorganiza por zona. En Río, perder dos horas cruzando la ciudad bajo lluvia puede arruinar más el día que cambiar completamente el itinerario."]},{"id":"dias-rio","icon":"🗓️","titulo":"Río en 1, 2, 3, 4, 5, 6 o 7 días","intro":"Itinerarios por zonas para aprovechar el tiempo sin pasar el viaje dentro del tránsito.","tips":["1 día: Full Day Río o selección de Cristo, Pan de Azúcar, Selarón y Centro.","2 días: añade playas, Arpoador y una noche de samba.","3 días: incorpora Centro histórico y región portuaria.","4–5 días: reserva una jornada para naturaleza, Niterói o Petrópolis.","6–7 días: combina Río con Búzios, Arraial, Angra o Ilha Grande."]},{"id":"caminando","icon":"🚶","titulo":"Ruta Zona Portuaria y Centro de Río","intro":"Un recorrido autoguiado que conecta siete lugares inolvidables. Puedes hacerlo completo o dividirlo en dos jornadas para entrar con calma a cada atracción.","tips":["0 · Carnaval Experience — Punto 0 opcional en la Cidade do Samba. Si quieres entender el Carnaval antes de caminar la Zona Portuaria, comienza aquí y luego sigue hacia AquaRio/Boulevard. Ernestinho es socio oficial y la tarjeta de Experiencias tiene el enlace con beneficio.","1 · AquaRio — Comienza con el acuario más grande de Sudamérica y sus túneles marinos. Reserva entre 2 y 3 horas. Mapa: https://www.google.com/maps/place/AquaRio,+Rio+de+Janeiro","2 · Boulevard Olímpico — Camina por la Orla Conde entre almacenes recuperados, murales, plazas y vistas del puerto. Es el enlace natural entre AquaRio y Praça Mauá.","3 · Museu do Amanhã — Su arquitectura parece flotar sobre la bahía. Entra si tienes tiempo o disfruta la plaza y el espejo de agua. Mapa: https://www.google.com/maps/place/Museu+do+Amanhã,+Rio+de+Janeiro","4 · Mosteiro de São Bento — Interior barroco cubierto de detalles dorados. Comprueba el horario religioso y recuerda que existe una subida desde la zona portuaria. Mapa: https://www.google.com/maps/place/Mosteiro+de+São+Bento,+Rio+de+Janeiro","5 · Confeitaria Colombo — Haz una pausa entre espejos, vitrales y sabores brasileños. En horarios de almuerzo puede existir espera. Mapa: https://www.google.com/maps/place/Confeitaria+Colombo,+Rio+de+Janeiro","6 · Real Gabinete Português — Una de las bibliotecas más bellas del mundo. La visita suele ser breve, gratuita y perfecta para fotografías respetuosas. Mapa: https://www.google.com/maps/place/Real+Gabinete+Português+de+Leitura,+Rio+de+Janeiro","7 · Theatro Municipal — Termina en Cinelândia frente a su fachada monumental. Comprueba si hay visita guiada o espectáculo. Mapa: https://www.google.com/maps/place/Theatro+Municipal+do+Rio+de+Janeiro","Consejo de Ernestinho · Usa calzado cómodo, comienza temprano y revisa qué lugares cierran el día elegido. El recorrido completo es largo si entras a todos; dividirlo permite disfrutarlo sin correr."]},{"id":"sol","icon":"🌅","titulo":"Amaneceres y atardeceres inolvidables","intro":"Una selección para elegir la vista según la hora, el barrio y el esfuerzo que quieres realizar. Llega antes: el mejor momento muchas veces dura pocos minutos.","tips":["🌅 Praia Vermelha · Amanecer — Mar tranquilo, montañas y Pan de Azúcar muy cerca. Ideal para comenzar temprano y continuar por la Pista Cláudio Coutinho.","🌅 Enseada de Botafogo · Amanecer — Barcos en primer plano y el Pan de Azúcar recibiendo la primera luz. Funciona muy bien desde la orla.","🌅 Aterro do Flamengo · Amanecer — Palmeras, ciclovía, bahía y corredores crean una escena muy carioca. Los domingos existe más movimiento recreativo.","🌅 Copacabana · Amanecer — El calçadão todavía tranquilo, pescadores, deportistas y luz reflejada en los edificios. Lleva solamente lo necesario.","🌇 Pedra do Arpoador · Atardecer — El clásico más famoso. Llega al menos 45 minutos antes y permanece hasta que aparezcan las luces de Ipanema.","🌇 Mureta da Urca · Atardecer — Compra algo para beber, siéntate frente a la bahía y observa cómo cambia el cielo detrás del Cristo y Botafogo.","🌇 Mirante do Leblon · Atardecer — Vista extensa de Leblon, Ipanema y Arpoador sin necesidad de sendero. Combínalo con la playa.","🌇 Pan de Azúcar · Atardecer — Una experiencia panorámica completa, pero requiere entrada y planificación. Sube con anticipación para ver hora dorada, puesta de sol y ciudad iluminada.","🌇 Vista Chinesa · Final de la tarde — Lagoa, Cristo, playas y montañas desde la Floresta da Tijuca. Organiza el transporte de ida y regreso; no dependas de conseguir señal al final.","🌇 Parque da Cidade de Niterói · Atardecer — Una de las panorámicas más amplias de Río, con bahía, Pan de Azúcar y Cristo. Regresa antes de que el acceso quede vacío.","Consejo de Ernestinho · Consulta la hora exacta del sol, nubosidad y lluvia. En miradores aislados organiza el regreso antes de oscurecer y evita exhibir equipos fotográficos durante el traslado."]},{"id":"nadie-explica","icon":"🤫","titulo":"Cosas que nadie te explica antes de venir","intro":"Códigos pequeños que cambian muchísimo la experiencia cuando los entiendes desde el primer día.","tips":["Posto no es solamente un puesto de salvavidas: en Copacabana e Ipanema funciona como referencia para encontrarse, elegir ambiente y explicar dónde estás.","PF o prato feito es uno de los almuerzos más útiles para ahorrar: normalmente combina arroz, feijão, proteína, ensalada o guarnición en un solo plato.","Por quilo significa que pesas el plato; buffet livre o self-service livre tiene precio fijo. En ambos casos mira primero cómo se cobra antes de servirte.","En la playa pregunta precio ANTES de sentarte o consumir: silla, sombrilla, agua, caipirinha, pescado y cualquier “combo”. Repite el precio si hace falta y mira el valor en la máquina.","El 10% de servicio suele venir sugerido en restaurantes. Comprueba la cuenta antes de pagar y pregunta si algo no coincide con lo pedido.","Muchos restaurantes tienen cocina que cierra antes que el salón. “Abierto hasta las 23” no siempre significa que puedas pedir cena a las 22:55.","La distancia en kilómetros engaña: túneles, montañas, tráfico, eventos y lluvia pueden convertir un trayecto corto en una parte importante del día.","No todos los lunes son buenos para museos y no todos los domingos son malos: cada espacio tiene su propio día de cierre. Mira la ficha del lugar, no una regla general.","Cuando llueve de verdad, Cristo y miradores pueden convertirse en una entrada cara para mirar nubes. Guarda las atracciones panorámicas para una ventana de visibilidad.","Uber puede mostrar un punto de recogida diferente de donde estás parado, especialmente en aeropuertos, shoppings, eventos y calles cerradas. Mira el punto antes de pedir.","En portugués “cartão” puede ser crédito o débito; “aproximação” es contactless. Mira SIEMPRE el monto en pantalla antes de acercar la tarjeta.","Río vive temprano en la playa y tarde en la noche: si quieres fotos, caminatas o calor manejable, la mañana suele rendir muchísimo más que empezar el día al mediodía.","Una padaria puede resolver desayuno, café, almuerzo rápido, agua y pequeños productos sin necesidad de buscar un restaurante “turístico”.","No programes Zona Oeste, Centro y Zona Sur como si fueran el mismo barrio. Agrupar por zonas suele mejorar el viaje más que agregar una atracción extra.","Guarda entradas, dirección del alojamiento y documentos importantes sin conexión. Cuando más los necesitas es justamente cuando el teléfono puede quedarse sin señal o batería."]},{"id":"trampas","icon":"⚠️","titulo":"Trampas y cobros que debes reconocer","intro":"Información para viajar atento sin transformar la experiencia en miedo.","tips":["Confirma precios antes de consumir o aceptar un servicio.","No permitas que desconocidos manipulen tu teléfono o tarjeta.","Comprueba nombre y valor antes de confirmar Pix.","Compra entradas y excursiones por canales identificables.","En Uber verifica matrícula, modelo y conductor antes de subir."]},{"id":"hotel","icon":"🚪","titulo":"Qué revisar antes de salir del alojamiento","intro":"Una comprobación de dos minutos puede evitar perder tiempo durante el día.","tips":["Documento necesario, tarjeta, poco efectivo y celular cargado.","Protector solar, agua, medicamento y una capa ligera para lluvia o aire acondicionado.","Entradas descargadas y dirección guardada sin conexión.","Clima, alertas, horario real y última admisión del lugar.","Llaves, ventanas, aire acondicionado y objetos de valor protegidos."]},{"id":"souvenirs","icon":"🎁","titulo":"Souvenirs y regalos para llevar","intro":"Recuerdos con identidad brasileña, útiles y fáciles de transportar.","tips":["Café brasileño y Café Ernestinho como recuerdo especial de Río.","Artesanía de ferias, diseños cariocas, camisetas y productos de samba o fútbol.","Havaianas, dulces, chocolates y pequeñas botellas respetando reglas del equipaje.","Comprueba límites aduaneros y líquidos antes de comprar.","Prefiere productos con procedencia, empaque cerrado y comprobante."]},{"id":"supermercado","icon":"🛒","titulo":"Qué descubrir en un supermercado brasileño","intro":"Una visita sencilla también puede convertirse en experiencia cultural.","tips":["Pão de queijo, tapioca, farofa, paçoca, goiabada y brigadeiro.","Guaraná, mate, jugos, cervezas y cachaças.","Frutas, pulpas congeladas y variedades de café.","Productos de playa, repelentes y protectores pueden costar menos fuera de la orla.","Revisa restricciones antes de llevar alimentos a otro país."]},{"id":"rodizio","icon":"🥩","titulo":"Cómo funciona un rodizio brasileño","intro":"Pagas un precio fijo por una secuencia de productos; bebidas y postres suelen cobrarse aparte.","tips":["En churrascaría, usa la señal de la mesa para recibir o pausar carnes.","No llenes el plato con buffet antes de conocer todos los cortes.","Pregunta precio, servicio, bebidas y promociones antes de comenzar.","Rodizio también puede ser de pizza, sushi o petiscos.","Puedes pedir punto de cocción y rechazar cualquier corte sin problema."]},{"id":"maps","icon":"🗺️","titulo":"Errores de Google Maps que pueden hacerte perder tiempo","intro":"El camino más corto no siempre es el más práctico o apropiado para un visitante.","tips":["No sigas atajos por escaleras, senderos o comunidades desconocidas.","Comprueba si el destino tiene varias entradas o unidades.","En Cristo y Pan de Azúcar busca el acceso oficial, no solamente el punto geográfico.","Verifica horarios y cierres en el canal oficial.","Compara transporte público con aplicación según hora, lluvia y equipaje."]},{"id":"portugues","icon":"🇧🇷","titulo":"Portugués para sobrevivir en Río","intro":"40 frases esenciales con traducción para saludar, moverse, comer, comprar, alojarse y pedir ayuda.","tips":["Bom dia / Boa tarde / Boa noite — Buenos días / Buenas tardes / Buenas noches.","Oi, tudo bem? — Hola, ¿todo bien?","Por favor / Obrigado(a) / De nada — Por favor / Gracias / De nada.","Desculpe, não falo português — Disculpe, no hablo portugués.","Pode falar mais devagar? — ¿Puede hablar más despacio?","Pode repetir, por favor? — ¿Puede repetir, por favor?","Você fala espanhol? — ¿Habla español?","Não entendi — No entendí.","Onde fica…? — ¿Dónde queda…?","É longe daqui? — ¿Está lejos de aquí?","Como chego ao metrô? — ¿Cómo llego al metro?","Este ônibus vai para…? — ¿Este autobús va hacia…?","Qual é a próxima estação? — ¿Cuál es la próxima estación?","Pode me avisar quando chegar? — ¿Puede avisarme cuando lleguemos?","Quero ir para este endereço — Quiero ir a esta dirección.","Quanto custa a corrida? — ¿Cuánto cuesta el viaje?","Aceita cartão? — ¿Acepta tarjeta?","Aceita dinheiro? — ¿Acepta efectivo?","Posso pagar com Pix? — ¿Puedo pagar con Pix?","Quanto custa? — ¿Cuánto cuesta?","Tem troco? — ¿Tiene cambio?","A conta, por favor — La cuenta, por favor.","O serviço está incluído? — ¿El servicio está incluido?","Quero isto, por favor — Quiero esto, por favor.","Sem gelo / Sem açúcar — Sin hielo / Sin azúcar.","Uma água sem gás / com gás — Un agua sin gas / con gas.","Sou alérgico(a) a… — Soy alérgico(a) a…","Não como carne — No como carne.","Tem opção vegetariana? — ¿Tiene opción vegetariana?","Onde fica o banheiro? — ¿Dónde está el baño?","Tenho uma reserva — Tengo una reserva.","Posso deixar as malas? — ¿Puedo dejar las maletas?","Qual é a senha do Wi-Fi? — ¿Cuál es la contraseña del Wi-Fi?","O ar-condicionado não funciona — El aire acondicionado no funciona.","Preciso de ajuda — Necesito ayuda.","Chame a polícia — Llame a la policía.","Chame uma ambulância — Llame una ambulancia.","Perdi meu documento / celular — Perdí mi documento / celular.","Não me sinto bem — No me siento bien.","Onde há uma farmácia ou UPA? — ¿Dónde hay una farmacia o UPA?"]},{"id":"perguntas-50","icon":"❓","titulo":"50 preguntas antes de viajar a Río","intro":"Respuestas rápidas a las dudas que más se repiten antes y durante un viaje.","tips":["1. ¿Pasaporte o cédula? Depende de tu nacionalidad y del acuerdo vigente; el documento debe estar vigente y en buen estado.","2. ¿Necesito visa? Depende de la nacionalidad. Compruébalo siempre en el portal consular oficial.","3. ¿Cuántos días puedo permanecer? Lo determina el régimen migratorio aplicado a tu nacionalidad.","4. ¿Puedo extender mi estadía? En algunos casos sí, solicitándolo a la Policía Federal antes del vencimiento.","5. ¿Los menores necesitan autorización? Puede ser necesaria si no viajan con ambos responsables; revisa también las reglas del país de salida.","6. ¿Conviene contratar seguro? Sí: incluye urgencias, hospitalización, accidentes y repatriación.","7. ¿Exigen vacunas? Revisa las recomendaciones sanitarias actualizadas antes del viaje.","8. ¿Cuál es la mejor época? Depende de si buscas playa, Carnaval, menos lluvia, eventos o precios más bajos.","9. ¿Cuántos días conviene quedarse? Cinco a siete días permiten combinar clásicos, playas, Centro y una excursión.","10. ¿Dónde conviene alojarse por primera vez? Copacabana suele ser práctica por transporte, comercio, playa y variedad.","11. ¿GIG y SDU son el mismo aeropuerto? No. Galeão es internacional y Santos Dumont está junto al Centro.","12. ¿Cómo llego desde el aeropuerto? Traslado reservado, taxi oficial, aplicación o transporte público según horario y equipaje.","13. ¿Puedo reservar traslado con Ernestinho? Sí, por WhatsApp indicando vuelo, pasajeros, equipaje y destino.","14. ¿Uber funciona en Río? Sí; verifica conductor, modelo y matrícula antes de subir.","15. ¿El metro llega a todos los puntos turísticos? No, pero cubre gran parte de Centro, Zona Sur, Tijuca y conexión con Barra.","16. ¿Cómo se paga el transporte? Depende del sistema; revisa tarjetas y medios aceptados antes de abordar.","17. ¿Es necesario alquilar automóvil? Para la mayoría de visitantes no; estacionamiento y tránsito pueden complicar el viaje.","18. ¿Puedo usar mi tarjeta extranjera? Generalmente sí, si está habilitada para compras internacionales.","19. ¿Necesito efectivo? Conviene llevar una cantidad pequeña como respaldo.","20. ¿Un turista puede tener Pix? No automáticamente; depende de CPF, cuenta o aplicación habilitada.","21. ¿Dónde cambio dinero? En establecimientos autorizados; compara cotización y comisiones.","22. ¿Cuánto dinero necesito por día? Depende del estilo; separa hospedaje y entradas del presupuesto diario.","23. ¿El 10% es obligatorio? El servicio suele ser sugerido y debe aparecer claramente informado.","24. ¿Hay que dejar propina adicional? No es imprescindible si ya pagaste el servicio, salvo que quieras reconocer una atención especial.","25. ¿El agua del grifo es recomendable? Para beber, muchos visitantes prefieren agua filtrada o mineral.","26. ¿Qué enchufe usa Brasil? Predomina el tipo N; el voltaje puede cambiar según lugar y establecimiento.","27. ¿Necesito chip o eSIM? Es muy útil para mapas, transporte, reservas y emergencias.","28. ¿Qué aplicaciones conviene instalar? WhatsApp, mapas, transporte, clima y las apps bancarias protegidas.","29. ¿Río es peligroso? Requiere atención urbana normal reforzada: planifica rutas y evita exhibir objetos de valor.","30. ¿Puedo usar el celular en la calle? Sí, pero hazlo con discreción y entra a un local si necesitas detenerte.","31. ¿Qué hago si pierdo el celular? Bloquea línea, bancos, correo y sesiones; registra denuncia y no intentes recuperarlo solo.","32. ¿Qué hago si pierdo documentos? Registra la pérdida y contacta al consulado correspondiente.","33. ¿Qué números de emergencia debo guardar? 190 Policía, 192 SAMU, 193 Bomberos y 199 Defensa Civil.","34. ¿Un extranjero puede usar el SUS? Puede buscar la red pública de urgencias; un seguro amplía opciones y coberturas.","35. ¿Qué diferencia hay entre UPA y hospital? La UPA atiende urgencias intermedias y estabiliza o deriva cuando corresponde.","36. ¿Las farmacias venden cualquier medicamento? No; algunos requieren receta retenida o receta médica válida.","37. ¿Qué hago cuando llueve fuerte? Evita calles inundadas, laderas y desplazamientos largos; consulta alertas oficiales.","38. ¿Las playas son aptas para niños? Algunas tienen días más tranquilos, pero el estado del mar cambia diariamente.","39. ¿Qué significa Posto? Es una referencia numerada de sectores y puestos de salvamento en la orla.","40. ¿Se alquilan sillas y sombrillas? Sí; pregunta y acuerda el precio antes de usarlas.","41. ¿Puedo dejar mis cosas solas en la arena? No es recomendable; lleva lo mínimo y organiza turnos.","42. ¿Se puede volar un dron? Solo respetando registro, espacio aéreo, restricciones locales y privacidad.","43. ¿Hay actividades gratuitas? Sí: playas, parques, miradores, ferias y varios centros culturales.","44. ¿Qué entradas debo comprar antes? Cristo, Pan de Azúcar, partidos, grandes eventos y excursiones en fechas de alta demanda.","45. ¿Los museos abren los lunes? Muchos cierran, pero no todos; verifica cada ficha y el canal oficial.","46. ¿Qué es un rodizio? Un servicio de precio fijo con una secuencia de carnes, pizzas, sushi u otros productos.","47. ¿Qué es comida por kilo? Sirves el plato y pagas según su peso.","48. ¿Puedo visitar una comunidad? Sí, de forma responsable, preferentemente acompañado y respetando residentes y fotografías.","49. ¿Cómo voy a Búzios, Arraial, Angra o Ilha Grande? En excursión, traslado o combinación de carretera y barco según destino.","50. ¿Cómo contacto a Ernestinho? Por WhatsApp al +55 21 96994-6938 para orientación, traslados, hospedaje y actividades."]},{"id":"perfiles","icon":"🧭","titulo":"Río según tu forma de viajar","intro":"Consejos específicos para diez perfiles de viajeros, con prioridades diferentes.","tips":["Con bebés: reduce cambios de transporte, confirma cuna y ascensor, ubica cambiadores y evita el sol del mediodía.","Con niños: alterna una atracción con playa tranquila, parque o actividad interactiva; lleva agua, snack e identificación.","Con adolescentes: combina experiencias visuales, fútbol, playas, aventura, compras y tiempo libre acordado.","Adultos mayores: prioriza ascensores, baños, sombra, asientos, horarios frescos y pocos desplazamientos diarios.","Personas con discapacidad: confirma accesibilidad real de entrada, baño, transporte y acompañante antes de reservar.","Mujeres que viajan solas: comparte recorridos, evita esperas aisladas de noche y comprueba vehículo y conductor.","Viajeros solos: elige hospedaje conectado, actividades grupales identificables y encuentros en lugares públicos.","Viajeros LGBTQIA+: Zona Sur y áreas turísticas suelen ofrecer más opciones; mantén las precauciones urbanas habituales.","Mochileros y viaje económico: agrupa zonas, usa transporte público, aprovecha actividades gratis y comida por kilo.","Parejas y luna de miel: reserva un atardecer especial, una cena, una experiencia privada y tiempo sin itinerario rígido."]}]};EXTRA={"LISTA_20_CONSEJOS":[{"num":"1","titulo":"Caminar con el celular en la mano por cualquier lugar","texto":"Cuando estés sacando fotos, mirando el mapa o buscando una dirección, intenta estar siempre atento a tu teléfono. No necesitas dejar de usarlo: simplemente evita caminar completamente distraído mientras lo llevas en la mano."},{"num":"2","titulo":"Dejar el celular, cartera o mochila sin vigilancia en la playa","texto":"Si vas con familia o amigos, pueden turnarse para que alguien vigile las cosas mientras los demás se bañan. Y si estás en nuestro puesto Barraca Rio 122, puedes consultar con nuestro personal para que te orienten sobre dónde dejar tus pertenencias mientras disfrutas del mar."},{"num":"3","titulo":"Llevar joyas caras o relojes llamativos","texto":"No es recomendable andar por la Cidade Maravihlosa con artículos de oro, collares llamativos o relojes costosos. Lo mejor es dejarlos en casa o guardados en tu alojamiento y salir ligero para disfrutar Río sin preocuparte por objetos innecesarios."},{"num":"4","titulo":"Caminar solo por calles aisladas o poco iluminadas de noche","texto":"Cuando cae la noche, lo más práctico es elegir calles con movimiento y lugares conocidos. Si no conoces la zona, pregunta antes de salir o utiliza una aplicación para planificar tu recorrido."},{"num":"5","titulo":"Ir a la playa de noche pensando que funciona igual que durante el día","texto":"La playa es uno de los grandes encantos de Río, pero el ambiente cambia bastante después de que cae el sol. Para disfrutar de la noche, prefiere lugares con movimiento y sigue las recomendaciones de quienes conocen la zona."},{"num":"6","titulo":"Llevar todos tus documentos y dinero encima","texto":"No necesitas salir con todo lo que tienes en el alojamiento. Lleva solamente lo necesario para tu paseo y guarda el resto en un lugar seguro. Menos cosas encima significa también más comodidad para disfrutar el día."},{"num":"7","titulo":"Entrar a un Uber sin comprobar la matrícula y el conductor","texto":"Antes de subir, revisa que la matrícula, el modelo del vehículo y la información del conductor coincidan con lo que aparece en la aplicación. Son apenas unos segundos y forman parte de viajar tranquilo."},{"num":"8","titulo":"Mostrar públicamente cuánto dinero llevas","texto":"En Río, como en cualquier destino turístico, es mejor evitar mostrar grandes cantidades de dinero en público. Lleva solamente lo que necesitas y guarda tus tarjetas y efectivo de forma discreta."},{"num":"9","titulo":"Aceptar ayuda de desconocidos cuando estás realizando una operación con dinero o tarjeta","texto":"Si necesitas sacar dinero, pagar o resolver algo con tu tarjeta, utiliza siempre los canales oficiales del banco o del establecimiento. Si tienes alguna duda, es mejor preguntar directamente al personal del lugar."},{"num":"10","titulo":"Dejar una bebida abandonada en un bar","texto":"Si estás disfrutando de una noche carioca y dejas tu bebida sin vigilancia durante un rato, lo más práctico es pedir otra cuando regreses. Así puedes seguir disfrutando de la noche con tranquilidad."},{"num":"11","titulo":"Aceptar cualquier precio de un vendedor sin preguntar antes","texto":"Antes de comprar, simplemente pregunta cuánto cuesta. Es una costumbre sencilla que evita sorpresas y te permite comparar tranquilamente antes de decidir."},{"num":"12","titulo":"No preguntar el precio antes de consumir en la playa","texto":"Antes de pedir una bebida, comida o alquilar algún servicio en la playa, pregunta el precio. No tiene nada de malo hacerlo y te permite disfrutar sin sorpresas en la cuenta."},{"num":"13","titulo":"Pensar que todas las playas de Río son iguales","texto":"Copacabana, Ipanema, Leblon, São Conrado, Prainha y las demás playas tienen ambientes completamente diferentes. Parte de la magia de Río está justamente en descubrir cuál combina más con tu estilo de viaje."},{"num":"14","titulo":"Salir sin protector solar","texto":"En Río puedes estar disfrutando de una playa, caminando por la ciudad o haciendo una trilha y darte cuenta demasiado tarde de cuánto sol recibiste. Llevar protector solar en la mochila es uno de esos pequeños hábitos que hacen una gran diferencia."},{"num":"15","titulo":"Subestimar las distancias de Río","texto":"Río parece fácil de recorrer cuando miras el mapa, pero las montañas, el tráfico y la distribución de los barrios pueden hacer que un trayecto tome más tiempo de lo esperado. Organiza tus recorridos por zonas y aprovecharás mucho mejor el día."},{"num":"16","titulo":"Intentar conocer toda la ciudad en un solo día","texto":"Río no se conoce corriendo. Es mejor disfrutar dos o tres lugares con calma que intentar marcar diez puntos en un solo día. Deja espacio para sentarte frente al mar, tomar un café o simplemente disfrutar del momento."},{"num":"17","titulo":"Entrar en una comunidad o favela desconocida por cuenta propia","texto":"Las comunidades forman parte de la historia y de la vida de Río, pero no todas funcionan de la misma manera ni todas están preparadas para recibir visitantes. Si quieres conocer una, hazlo con alguien que conozca bien el lugar y pueda orientarte."},{"num":"18","titulo":"Hacer senderismo por lugares aislados sin conocer la ruta","texto":"Río tiene trilhas increíbles, pero antes de comenzar una caminata conviene conocer la ruta, el nivel de dificultad y las condiciones del lugar. Si no conoces el camino, considera hacerlo con un guía o alguien que tenga experiencia en esa trilha."},{"num":"19","titulo":"Creer todo lo que aparece en internet sobre Río sin verificarlo","texto":"En internet encontrarás consejos excelentes y también información antigua o exagerada. Antes de tomar una decisión, compara fuentes y, cuando sea posible, pregunta a alguien que viva realmente en Río."},{"num":"20","titulo":"Venir con miedo y olvidarte de disfrutar Río","texto":"Este es quizás el consejo más importante. Infórmate, utiliza el sentido común, presta atención a tus cosas y después disfruta. Río tiene playas, música, gastronomía, naturaleza, cultura y una energía que difícilmente se explica hasta que la vives."}],"TRAMPAS_TURISTA":[{"icon":"💳","titulo":"La pantalla de la tarjeta","caso":"Te cobran R$200,00 cuando la compra era R$20,00 o esconden la pantalla diciendo que no se ve por el sol.","accion":"Mira el valor antes de aproximar, insertar o escribir la clave. En Brasil la coma separa los centavos: R$20,00 son veinte reales.","ernestinho":"Si no puedes ver la pantalla, no pagues. Pide otra máquina o utiliza otro comercio."},{"icon":"📱","titulo":"Pix al destinatario equivocado","caso":"Un QR alterado o una clave escrita incorrectamente envía el dinero a otra persona.","accion":"Antes de confirmar, compara nombre del receptor, institución y monto. Nunca entregues el teléfono desbloqueado para que alguien haga el proceso.","ernestinho":"La prisa es amiga del error. Lee la pantalla final completa, incluso cuando haya gente esperando."},{"icon":"🏖️","titulo":"Precio sorpresa en la playa","caso":"Te sientas, consumes y después aparecen valores que nunca fueron informados para silla, sombrilla, pescado o bebidas.","accion":"Pregunta y repite el precio total antes de aceptar. Si es posible, fotografía el menú o cartel y conserva el comprobante.","ernestinho":"Pregunta “¿cuánto cuesta todo?” y no solamente el producto principal."},{"icon":"🚕","titulo":"Traslado sin precio claro","caso":"Una persona se presenta como transporte oficial y ofrece ayuda con las maletas sin explicar tarifa, peajes o equipaje.","accion":"Usa mostradores identificados, taxi autorizado, aplicación verificada o traslado reservado. Confirma destino y valor antes de salir.","ernestinho":"Nuestro equipo puede esperarte, llevarte al vehículo y cobrar solamente al llegar al destino."},{"icon":"🎟️","titulo":"Entrada o excursión inexistente","caso":"Perfiles recientes ofrecen un precio imposible, cobran por adelantado y desaparecen o entregan un voucher que no corresponde.","accion":"Comprueba nombre, reputación, condiciones, fecha, incluidos y canal oficial. Desconfía de presión para pagar “ahora”.","ernestinho":"Una oferta seria puede explicar por escrito qué incluye, quién opera y cómo funciona la cancelación."},{"icon":"🚗","titulo":"Vehículo diferente en la aplicación","caso":"Alguien dice ser tu conductor, pero la matrícula, modelo o fotografía no coinciden.","accion":"No subas. Verifica los tres datos dentro de la aplicación y confirma tu nombre sin decirlo primero.","ernestinho":"Pregunta “¿para quién vino?”; el conductor debe conocer el nombre mostrado en la reserva."},{"icon":"🏧","titulo":"Ayuda innecesaria en el cajero","caso":"Un desconocido se acerca demasiado, observa tu clave o afirma que la tarjeta quedó bloqueada.","accion":"Cancela, guarda la tarjeta y usa otro cajero dentro de banco o shopping. Nunca aceptes ayuda de extraños.","ernestinho":"Retira durante el día y lleva solamente el efectivo que realmente usarás."},{"icon":"🍽️","titulo":"Cuenta con extras","caso":"Aparecen couvert artístico, productos repetidos, otra cantidad de personas o bebidas no consumidas.","accion":"Revisa cada línea antes de pagar. Pregunta previamente si existe música con cobro y si el 10% ya está incluido.","ernestinho":"Pedir una cuenta corregida no es ser problemático: es verificar una compra como en cualquier país."},{"icon":"📶","titulo":"Wi‑Fi y enlaces falsos","caso":"Una red parecida a la del hotel o un mensaje de reserva intenta obtener contraseñas y datos bancarios.","accion":"Confirma el nombre exacto de la red, evita operaciones bancarias en Wi‑Fi abierto y no abras enlaces de remitentes desconocidos.","ernestinho":"Activa verificación en dos pasos en WhatsApp y conserva códigos de recuperación fuera del teléfono."},{"icon":"💱","titulo":"Cambio de dinero sin referencia clara","caso":"Te ofrecen una cotización muy atractiva en la calle o un lugar no identificado y no queda claro cuánto recibirás finalmente.","accion":"Usa casas de cambio identificadas, compara el valor final y cuenta el dinero antes de salir. Evita cambiar grandes cantidades de una vez.","ernestinho":"No compares solamente la tasa anunciada; pregunta cuánto recibes exactamente por el monto que vas a cambiar."},{"icon":"🍹","titulo":"Promoción que cambia en la cuenta","caso":"Un cartel muestra 2x1, happy hour o combo, pero la condición tenía horario, producto o forma de pago específica.","accion":"Antes de pedir, confirma verbalmente qué producto entra, hasta qué hora y cuál será el precio final.","ernestinho":"Una foto rápida del cartel puede evitar discusiones después."},{"icon":"🏨","titulo":"Mensaje falso sobre tu reserva","caso":"Recibes WhatsApp o correo pidiendo pagar nuevamente para no perder hotel, apartamento o entrada.","accion":"No uses el enlace recibido. Entra a la plataforma o contacto original por tu cuenta y verifica allí la reserva.","ernestinho":"Si cambia la cuenta bancaria, Pix o canal de pago a última hora, confirma por una segunda vía antes de transferir."},{"icon":"📸","titulo":"Servicio o foto sin precio acordado","caso":"Alguien te ofrece fotografiar, limpiar algo, colocar una pulsera o prestar un servicio y después exige un pago inesperado.","accion":"Si no lo quieres, di no antes de aceptar. Si sí lo quieres, acuerda el valor total antes de comenzar.","ernestinho":"En zonas turísticas, “es un regalo” y “después vemos” no son una cotización."},{"icon":"🆘","titulo":"Si algo ya ocurrió","caso":"Fuiste cobrado incorrectamente, perdiste documentos o sufriste un delito.","accion":"Guarda capturas, recibos, matrícula, hora y dirección; bloquea tarjetas y registra la denuncia. Emergencia: 190. DEAT y BPTur ofrecen apoyo turístico.","ernestinho":"No intentes perseguir ni enfrentar a nadie. Primero aléjate, protege tus cuentas y busca ayuda identificada."}],"PERFILES_RIO":[{"icon":"👶","titulo":"Con bebés","foto":"https://images.unsplash.com/photo-1544126592-807ade215a0b?auto=format&fit=crop&w=1000&q=80","plan":"Mañanas cortas en Copacabana o Urca, una atracción principal como AquaRio y regreso al alojamiento antes de que el calor/cansancio domine. Mantén un plan B cubierto para lluvia.","claves":"Cuna confirmada, ascensor desde la calle, cambiador, cochecito, sombra, agua, farmacia cercana y trayectos con pocas conexiones. Revisa también si Uber/taxi acepta el volumen del cochecito.","tip":"No programes tres barrios en un día: el descanso también es parte del itinerario."},{"icon":"👨‍👩‍👧","titulo":"Con niños","foto":"https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1000&q=80","plan":"Alterna actividad de movimiento y actividad cultural: AquaRio o BioParque, playa sólo con mar compatible, Planetário, Maracanã Tour, Jardim Botânico o una experiencia corta.","claves":"Identificación, protector, snack, baño cercano y actividad alternativa por lluvia.","tip":"Alterna una visita cultural con algo donde puedan moverse y jugar."},{"icon":"🎧","titulo":"Con adolescentes","foto":"https://images.unsplash.com/photo-1539635278303-d4002c07eae3?auto=format&fit=crop&w=1000&q=80","plan":"Deja que elijan al menos una actividad: Maracanã, parapente/aventura si corresponde, Arpoador, compras, fotografía, playa, kart o experiencia interactiva. Mezcla autonomía con horarios y puntos de encuentro claros.","claves":"Acuerdos claros, batería, internet y punto de encuentro.","tip":"Déjalos elegir una actividad completa; aumenta muchísimo el entusiasmo."},{"icon":"👵","titulo":"Adultos mayores","foto":"https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1000&q=80","plan":"Construye el día alrededor de una o dos atracciones con ascensor/baños/asientos: AquaRio, Museu do Amanhã, CCBB, Pan de Azúcar según movilidad, orlas y Centro en tramos cortos con transporte entre puntos.","claves":"Sombra, baños, asientos, poca espera de pie, horarios frescos, medicamentos, hidratación, documento para beneficios y punto claro de descenso del vehículo.","tip":"Dos atracciones bien disfrutadas valen más que cinco recorridas con cansancio."},{"icon":"♿","titulo":"Movilidad reducida","foto":"https://images.unsplash.com/photo-1570793005299-c091be8a9a0f?auto=format&fit=crop&w=1000&q=80","plan":"Museu do Amanhã, AquaRio, Pan de Azúcar, orlas y espacios con acceso confirmado.","claves":"Entrada, baño, ascensor, transporte y acompañante deben confirmarse por separado.","tip":"“Accesible” no siempre significa accesibilidad completa; llama antes de reservar."},{"icon":"👩","titulo":"Mujeres que viajan solas","foto":"https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80","plan":"Actividades grupales identificadas, barrios conectados y regreso nocturno organizado.","claves":"Compartir trayecto, verificar vehículo y evitar esperas aisladas.","tip":"Si algo no te transmite confianza, cambia el plan sin sentir que debes justificarte."},{"icon":"🎒","titulo":"Viajeros solos","foto":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80","plan":"Walking tours, samba, senderos con grupo y mesas o barras informales.","claves":"Hospedaje conectado, encuentros públicos y contacto de emergencia.","tip":"Las actividades compartidas ayudan a conocer gente sin depender de desconocidos."},{"icon":"🏳️‍🌈","titulo":"Viajeros LGBTQIA+","foto":"https://images.unsplash.com/photo-1562887284-8ba6b7c90fd8?auto=format&fit=crop&w=1000&q=80","plan":"Ipanema, Copacabana, Botafogo y eventos con público y organización identificables.","claves":"Revisar ambiente, transporte nocturno y precauciones urbanas habituales.","tip":"Busca programación actual: una fiesta conocida puede cambiar de dirección o fecha."},{"icon":"💸","titulo":"Mochileros","foto":"https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1000&q=80","plan":"Combina playa y espacios gratuitos con una atracción pagada cada cierto tiempo. Centro cultural, miradores gratuitos, walking por zonas, comida por quilo y transporte público permiten viajar barato sin convertir todos los días en sacrificio.","claves":"Metro, comida por kilo, botella de agua y presupuesto de emergencia.","tip":"Ahorrar cruzando la ciudad puede costarte horas; agrupa el día por barrios."},{"icon":"💛","titulo":"Parejas","foto":"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1000&q=80","plan":"Elige un gran momento diario en vez de diez paradas: amanecer o atardecer, Urca, Arpoador, cena especial, samba, paseo privado, lancha o helicóptero según presupuesto y estilo.","claves":"Una reserva especial y suficiente tiempo libre sin itinerario rígido.","tip":"Elige un momento inolvidable por día; no llenes cada minuto."}]};LAZY={"LLUVIA_RIO":[{"hora":"09:00","nombre":"AquaRio + Boulevard bajo lluvia moderada","foto":"https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80","tipo":"Familias · cubierto","descripcion":"AquaRio es una de las alternativas más fáciles cuando el tiempo está feo. Si la lluvia baja, el Boulevard Olímpico permite moverte entre atracciones cercanas sin cruzar la ciudad.","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro"},{"hora":"10:00","nombre":"Museu do Amanhã + MAR","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","tipo":"Ciencia + arte · misma zona","descripcion":"Dos grandes opciones en Praça Mauá. Son especialmente útiles porque puedes construir medio día cultural con traslados cortos. Comprueba qué museo cierra ese día antes de salir.","mapa":"https://www.google.com/maps/search/?api=1&query=Praca+Maua+Rio+de+Janeiro"},{"hora":"10:30","nombre":"CCBB + Paço Imperial + Casa FCasa França-Brasil","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","tipo":"Centro cultural · económico","descripcion":"El Centro concentra espacios culturales cubiertos muy cerca entre sí. CCBB suele ser uno de los mejores refugios culturales; combina según exposiciones, horarios y la intensidad real de la lluvia.","mapa":"https://www.google.com/maps/search/?api=1&query=CCBB+Rio+de+Janeiro"},{"hora":"12:30","nombre":"Almuerzo con historia","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389093/colombo_as.jpg","tipo":"Gastronomía · Centro","descripcion":"Usa la lluvia para sentarte sin culpa: Colombo, restaurantes tradicionales del Centro, buffet por kilo o un boteco clásico pueden formar parte del recorrido en vez de ser solamente una pausa.","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Centro+Rio"},{"hora":"14:00","nombre":"Real Gabinete + Biblioteca Nacional","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","tipo":"Literatura + arquitectura","descripcion":"El Real Gabinete es breve pero impresionante. Si las visitas y horarios coinciden, combínalo con Biblioteca Nacional, Cinelândia y otros interiores del Centro.","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura"},{"hora":"15:30","nombre":"Theatro Municipal o visita cultural en Cinelândia","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/teatro_municipal.jpg","tipo":"Arquitectura + espectáculo","descripcion":"Si existe visita guiada o función compatible, el Theatro Municipal transforma una tarde gris en uno de los planes más memorables del Centro. Consulta programación antes de desplazarte.","mapa":"https://www.google.com/maps/search/?api=1&query=Theatro+Municipal+Rio+de+Janeiro"},{"hora":"16:00","nombre":"Planetário da Gávea","foto":"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80","tipo":"Ciencia · familias y adultos","descripcion":"Una alternativa que muchos turistas olvidan: exposiciones de astronomía y sesiones de cúpula según programación. Funciona especialmente bien con niños, adolescentes o si ya hiciste los museos del Centro.","mapa":"https://www.google.com/maps/search/?api=1&query=Planetario+da+Gavea+Rio"},{"hora":"16:30","nombre":"Maracanã Tour","foto":"https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=1200&q=80","tipo":"Fútbol · mayormente cubierto","descripcion":"Para amantes del fútbol es una buena salida cuando no quieres pasar el día mirando cuadros. Confirma operación del tour y considera que los accesos exteriores siguen dependiendo de la lluvia.","mapa":"https://www.google.com/maps/search/?api=1&query=Maracana+Tour+Rio"},{"hora":"17:00","nombre":"Museu da República, MAM, Casa Museu Eva Klabin u otros museos","foto":"https://images.unsplash.com/photo-1564399579883-451a5d44ec08?auto=format&fit=crop&w=1200&q=80","tipo":"Plan alternativo por barrio","descripcion":"No existe una única ruta de lluvia. Elige un museo cercano a tu alojamiento o al siguiente plan para no gastar el día dentro de Uber. La guía reúne decenas de museos y centros culturales.","mapa":"https://www.google.com/maps/search/?api=1&query=museus+Rio+de+Janeiro"},{"hora":"18:00","nombre":"Feira de São Cristóvão, shopping, cine o boliche","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788393690/feira-de-sao-cristovao.jpg","tipo":"No todo tiene que ser museo","descripcion":"Si quieres algo más relajado, revisa Feira de São Cristóvão cuando esté operando, shoppings, cine, boliche, escape room, kart indoor o Hotzone. Son buenas salidas para familias y grupos.","mapa":"https://www.google.com/maps/search/?api=1&query=Feira+de+Sao+Cristovao+Rio"},{"hora":"20:00","nombre":"Samba, gastronomía o espectáculo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788393697/rio_scenarium.jpg","tipo":"Noche · confirmar agenda","descripcion":"Una noche de lluvia no tiene por qué terminar en el hotel. Revisa samba en espacios cubiertos, restaurantes con música, Rio Scenarium u otra programación identificada y organiza el regreso.","mapa":"https://www.google.com/maps/search/?api=1&query=Rio+Scenarium+Rio"}],"SEMANA_RIO":[{"dia":"Lunes","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788199943/IMG_3083.jpg","tema":"Clásicos que no dependen de los museos","manana":"08:00 · Cristo Redentor temprano para evitar calor y mayor concentración de visitantes.","tarde":"13:00 · Almuerzo en Copacabana, Forte de Copacabana y caminata hacia Arpoador.","noche":"19:00 · Cena en Ipanema o roda de samba en Pedra do Sal únicamente si existe programación confirmada.","alternativa":"Pan de Azúcar, AquaRio o playa si algún punto está cerrado.","mapa":"https://www.google.com/maps/dir/Cristo+Redentor/Forte+de+Copacabana/Pedra+do+Arpoador/"},{"dia":"Martes","foto":"https://cdn-imgix.headout.com/media/images/ba22a9ac753ea26a49588514785a6f1a-Santa%20Teresa%20Art%20Street%20of%20Rio%2C%20Brazil.jpg?auto=compress%2Cformat&fit=crop&q=85","tema":"Centro histórico, cultura y samba","manana":"09:00 · Real Gabinete, Confeitaria Colombo, CCBB y Praça XV, revisando los horarios de cada espacio.","tarde":"14:30 · Bonde y paseo por Santa Teresa, Parque das Ruínas y Escadaria Selarón.","noche":"19:30 · Lapa, samba o espectáculo cultural en un lugar identificado y con regreso organizado.","alternativa":"Museu do Amanhã y MAR si prefieres permanecer en la Zona Portuaria.","mapa":"https://www.google.com/maps/dir/Real+Gabinete+Português/Confeitaria+Colombo/CCBB+Rio/Parque+das+Ruínas/Escadaria+Selarón/"},{"dia":"Miércoles","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385260/arpoador_fotos.jpg","tema":"Jardines, playa y atardecer","manana":"08:30 · Jardim Botânico y Parque Lage antes del calor más fuerte.","tarde":"14:00 · Almuerzo y playa en Ipanema; camina por Posto 9 con tiempo.","noche":"17:00 · Atardecer en Arpoador y después cena o bar en Ipanema.","alternativa":"Museos o cafeterías de Botafogo si llueve.","mapa":"https://www.google.com/maps/dir/Jardim+Botânico+do+Rio+de+Janeiro/Parque+Lage/Posto+9+Ipanema/Pedra+do+Arpoador/"},{"dia":"Jueves","foto":"https://cariocando.com.br/assets/images/beaches/praia-vermelha.png","tema":"Urca desde la mañana hasta la hora dorada","manana":"09:00 · Praia Vermelha y Pista Cláudio Coutinho.","tarde":"13:00 · Almuerzo en Urca y subida al Pan de Azúcar con anticipación.","noche":"18:00 · Mureta da Urca para observar la bahía; cena en el barrio o regreso a Botafogo.","alternativa":"Casa da Ciência y espacios culturales cercanos si el clima cambia.","mapa":"https://www.google.com/maps/dir/Praia+Vermelha/Pista+Cláudio+Coutinho/Pão+de+Açúcar/Mureta+da+Urca/"},{"dia":"Viernes","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389094/botagofoxx.jpg","tema":"Excursión y comienzo del fin de semana","manana":"07:00 · Salida a Petrópolis, Niterói o una experiencia de naturaleza y aventura.","tarde":"Continúa la excursión sin llenar el regreso con otra atracción distante.","noche":"20:00 · Botafogo, Lapa o samba según la agenda del día.","alternativa":"Full Day Río para quien todavía no conoce los clásicos.","mapa":"https://www.google.com/maps/search/?api=1&query=Botafogo+Rio+de+Janeiro"},{"dia":"Sábado","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/etnias_1.jpg","tema":"Excursiones, ferias y una noche especial","manana":"06:30 · Búzios, Arraial, Angra o Ilha Grande; reserva con anticipación.","tarde":"Si permaneces en Río: Maracaná, Feira de São Cristóvão o Zona Portuaria.","noche":"Samba, pagode, espectáculo o fiesta con transporte de regreso organizado.","alternativa":"Ruta AquaRio–Museu do Amanhã para familias.","mapa":"https://www.google.com/maps/search/?api=1&query=Feira+de+São+Cristóvão+Rio"},{"dia":"Domingo","foto":"https://odia.ig.com.br/_midias/jpg/2023/07/23/whatsapp_image_2023_07_23_at_14_40_13__1_-29900693.jpeg","tema":"Orla, Feira da Glória y familia","manana":"09:00 · Feira da Glória para desayunar, descubrir productos y sentir un domingo carioca.","tarde":"12:30 · Almuerzo y paseo por Aterro do Flamengo; continúa hacia Copacabana o Ipanema.","noche":"17:00 · Atardecer en Arpoador, Urca o Parque da Cidade de Niterói.","alternativa":"AquaRio, parques y actividades familiares según clima.","mapa":"https://www.google.com/maps/dir/Feira+da+Glória/Aterro+do+Flamengo/Pedra+do+Arpoador/"}]};VIS=({"CONSEJOS_VISUALES":{"semana":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Río de Janeiro para organizar actividades durante la semana","links":[["Ver atracciones","que_hacer"],["Explorar gastronomía","gastronomia"],["Ver vida nocturna","vida_nocturna"]]},"lluvia":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Museu do Amanhã como alternativa para un día de lluvia","links":[["Ver museos","museos"],["Conocer AquaRio","familia"],["Explorar centros culturales","centros_culturales"]]},"presupuestos":{"hero":"https://files.sunoresearch.com.br/n/uploads/2024/02/dinheiro-real-brasil.jpg","alt":"Reales brasileños para organizar el presupuesto diario","links":[["Dónde comer","gastronomia"],["Actividades y experiencias","experiencias"],["Guía de transportes","transporte_publico"]]},"caminando":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Praça Mauá y Museu do Amanhã en la ruta Zona Portuaria y Centro","links":[["Abrir ruta completa en Google Maps","https://www.google.com/maps/@-22.8991976,-43.1964099,15z/data=!4m2!11m1!2s3dsbSBRj80f-bKZnY6WLKQ?entry=ttu"],["Ver museos","museos"],["Ver gastronomía","gastronomia"]]},"sol":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386498/hora_dorada_urca.jpg","alt":"Hora dorada y atardecer desde la Mureta da Urca","links":[["Ver guía para fotografiar Río","fotografia"],["Abrir mapas","fotografia"]]},"supermercado":{"hero":"https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1600&q=80","alt":"Pasillos de un supermercado para descubrir productos brasileños","links":[["Conocer Café Ernestinho","cafe"],["Ver gastronomía","gastronomia"]]},"rodizio":{"hero":"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80","alt":"Carnes servidas en una churrascaría brasileña","links":[["Ver rodizios recomendados","gastronomia"],["Explorar gastronomía","gastronomia"]]}}}).CONSEJOS_VISUALES||{};PORT={"RUTA_PORTUARIA":[{"n":0,"nombre":"Carnaval Experience — punto 0 opcional","foto":"https://res.cloudinary.com/qa301cbc/image/upload/f_auto,q_auto/IMG_3088","historia":"Antes de comenzar la caminata por la Zona Portuaria puedes entrar a la Cidade do Samba y entender cómo se crean fantasías, carros y la estructura del Carnaval. Ernestinho es socio oficial de Carnaval Experience y tenemos enlace con beneficio para nuestros visitantes.","tiempo":"1½–2 h · con entrada","mapa":"https://www.google.com/maps/search/?api=1&query=Cidade+do+Samba+Rio+de+Janeiro"},{"n":1,"nombre":"AquaRio","foto":"https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80","historia":"El mayor acuario marino de Sudamérica abre la jornada entre especies brasileñas y un gran túnel oceánico.","tiempo":"2–3 h","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro"},{"n":2,"nombre":"Boulevard Olímpico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/etnias_1.jpg","historia":"La antigua zona portuaria renació como paseo de murales, plazas, almacenes recuperados y vistas de la bahía.","tiempo":"30–45 min","mapa":"https://www.google.com/maps/search/?api=1&query=Boulevard+Olimpico+Rio"},{"n":3,"nombre":"Museu do Amanhã","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","historia":"La arquitectura de Santiago Calatrava parece flotar sobre la bahía y prepara al visitante para pensar futuros posibles.","tiempo":"1½–2 h","mapa":"https://www.google.com/maps/search/?api=1&query=Museu+do+Amanha+Rio"},{"n":4,"nombre":"Mosteiro de São Bento","foto":"https://images.unsplash.com/photo-1596395819057-e37f55a8516b?auto=format&fit=crop&w=1200&q=80","historia":"Tras una subida aparece uno de los interiores barrocos más impresionantes de Río, cubierto de talla dorada.","tiempo":"30–45 min","mapa":"https://www.google.com/maps/search/?api=1&query=Mosteiro+de+Sao+Bento+Rio"},{"n":5,"nombre":"Confeitaria Colombo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389093/colombo_as.jpg","historia":"Espejos belgas, vitrales y dulces convierten la pausa en un viaje al Río de comienzos del siglo XX.","tiempo":"45–60 min","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Centro+Rio"},{"n":6,"nombre":"Real Gabinete Português","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","historia":"Una biblioteca monumental de 1887 cuya sala principal guarda miles de obras bajo una claraboya de colores.","tiempo":"20–30 min","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura"},{"n":7,"nombre":"Theatro Municipal","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/teatro_municipal.jpg","historia":"El gran teatro de Cinelândia cierra el recorrido con una fachada inspirada en la Ópera de París.","tiempo":"30 min o visita","mapa":"https://www.google.com/maps/search/?api=1&query=Theatro+Municipal+Rio"}],"SOUVENIRS_RIO":[{"icon":"☕","titulo":"Café brasileño","texto":"Un regalo aromático, fácil de transportar y profundamente brasileño. Revisa si viene molido o en grano y conserva el empaque cerrado.","donde":"Café Ernestinho, cafeterías y supermercados."},{"icon":"🩴","titulo":"Havaianas y moda de playa","texto":"Sandalias, pareos, bikinis y accesorios ocupan poco espacio. Compara talla brasileña y talla de tu país antes de comprar.","donde":"Tiendas oficiales, comercios de barrio y shoppings."},{"icon":"⚽","titulo":"Fútbol y samba","texto":"Camisetas, banderas, instrumentos pequeños y artículos de escuelas de samba llevan una parte de la cultura carioca.","donde":"Tiendas oficiales, Maracaná, Cidade do Samba y ferias."},{"icon":"🍬","titulo":"Dulces brasileños","texto":"Paçoca, goiabada, bananinha, brigadeiro y chocolates funcionan bien como regalos económicos para compartir.","donde":"Supermercados y tiendas de productos brasileños."},{"icon":"🥃","titulo":"Cachaça y bebidas","texto":"Busca procedencia, sello y botella cerrada. Verifica límites de alcohol y líquidos del equipaje antes de decidir.","donde":"Casas especializadas y supermercados reconocidos."},{"icon":"🎨","titulo":"Artesanía carioca","texto":"Ilustraciones, cerámica, joyería, bolsos y piezas hechas a mano son recuerdos más personales que un imán genérico.","donde":"Feirartes, Ipanema, Copacabana, Glória y centros culturales."},{"icon":"🌙","titulo":"Feria nocturna de Copacabana","texto":"Una caminata frente al mar entre puestos de artesanía, camisetas, decoración y pequeños recuerdos. Horarios y montaje pueden variar.","donde":"Avenida Atlântica, Copacabana. Confirma el tramo activo el mismo día."},{"icon":"🧳","titulo":"Antes de cerrar la maleta","texto":"Guarda comprobantes, protege piezas frágiles y comprueba restricciones de alimentos, semillas, madera, alcohol y líquidos de tu destino.","donde":"Consulta aduana y aerolínea antes del vuelo."}],"FAQ_DESTACADAS":[{"q":"¿Qué documento debo llevar?","a":"Depende de tu nacionalidad y del acuerdo vigente. Comprueba que el documento aceptado esté en buen estado y tenga vigencia suficiente; lleva copia digital separada y no dependas de una fotografía como documento de viaje."},{"q":"¿Qué pasa si un menor viaja con solo uno de sus padres?","a":"Puede necesitar autorización del responsable ausente, normalmente formalizada según las reglas del país de salida, además de documentos del menor y acompañante. Verifica aerolínea, migración y autoridad consular con anticipación."},{"q":"¿Cuánto tiempo puedo permanecer?","a":"La admisión habitual puede ser de hasta 90 días según la nacionalidad y decisión migratoria. Algunas personas pueden solicitar prórroga hasta el límite aplicable antes del vencimiento, acreditando requisitos ante la Policía Federal."},{"q":"¿Qué hago si necesito atención médica?","a":"Con seguro, contacta primero la central indicada en la póliza cuando sea posible. En una urgencia también puedes buscar la red pública SUS llevando tu documento; para emergencias médicas llama al 192."},{"q":"¿Cuánto dinero necesito?","a":"Separa alojamiento y entradas anticipadas. Para el gasto diario considera transporte, comidas, playa, bebidas y una reserva. La guía incluye ejemplos de R$100, R$200 y R$500 sin hospedaje."},{"q":"¿Puedo utilizar tarjetas extranjeras?","a":"Generalmente sí cuando están habilitadas para uso internacional. Avisa al banco, conserva una alternativa y mira el monto en la máquina antes de aproximar o ingresar la clave."},{"q":"¿Necesito efectivo si existe Pix?","a":"Conviene llevar una cantidad pequeña. Un turista no obtiene Pix automáticamente: depende de CPF, cuenta o aplicación habilitada. Nunca dependas de un solo medio de pago."},{"q":"¿Cuál aeropuerto debo seleccionar?","a":"Río tiene Galeão (GIG) y Santos Dumont (SDU). Comprueba el código en cada tramo, especialmente si haces conexión, porque están en zonas diferentes."},{"q":"¿Es seguro usar el teléfono en la calle?","a":"Úsalo con discreción, lejos del borde de la calle y de puertas de vehículos. Para estudiar una ruta larga, entra a un comercio o utiliza mapas descargados."},{"q":"¿Qué hago si pierdo el celular?","a":"Bloquea línea, bancos, correo y sesiones desde otro dispositivo; cambia contraseñas prioritarias, registra la denuncia y no intentes recuperarlo siguiendo una ubicación por tu cuenta."},{"q":"¿Qué conviene reservar antes?","a":"Cristo, Pan de Azúcar, Maracaná, grandes eventos, excursiones y restaurantes especiales pueden agotarse. Reserva solamente cuando fecha, incluidos y política estén claros."},{"q":"¿Cómo contacto a Ernestinho?","a":"Escribe al WhatsApp +55 21 96994‑6938 indicando fecha, cantidad de personas y qué necesitas: traslado, hospedaje, actividad u orientación."}],"RIO_HOJE_FALLBACK_REC icationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":90},{"eventId":"feirarte-atlantica","title":"Feirarte VI — Calçadão de Copacabana","weekdays":[6,0],"startTime":"16:00","endTime":"24:00","venueName":"Calçadão da Avenida Atlântica","neighborhood":"Copacabana","zone":"Zona Sul","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTE","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":88}]};SPECIAL={"SUPERMERCADO_BRASIL":[{"grupo":"Frutas que invitan a probar","icon":"🥭","foto":"/assets/embedded-images/embedded-01-64b430214df2.jpg","productos":"Goiaba, jabuticaba, maracujá, acerola, carambola, manga y diferentes tipos de banana.","historia":"No mires solamente: pregunta qué está maduro y compra una porción pequeña. Algunas frutas cambian muchísimo cuando se prueban frescas.","tip":"Las pulpas congeladas son una forma práctica de probar sabores como cupuaçu, graviola y cajá si tienes cocina."},{"grupo":"Bebidas muy brasileñas","icon":"🥤","foto":"/assets/embedded-images/embedded-02-edb8f9facd8b.jpg","productos":"Guaraná, Fanta Uva, mate, agua de coco, jugos de caja, cervezas y cachaças.","historia":"El pasillo de bebidas parece familiar hasta que aparecen sabores que casi no existen fuera de Brasil.","tip":"Prueba una unidad antes de comprar varias. Para bebidas alcohólicas y líquidos, revisa las reglas del equipaje."},{"grupo":"Dulces para regalar","icon":"🍬","foto":"/assets/embedded-images/embedded-03-1f3a05ee1dd5.jpg","productos":"Paçoca, pé de moleque, brigadeiro, goiabada, bananinha, Bis y bombones brasileños.","historia":"Son regalos económicos, livianos y fáciles de compartir. La paçoca es de maní y se desarma con facilidad: ábrela con cuidado.","tip":"Busca paquetes cerrados con fecha y etiqueta. El calor carioca puede derretir chocolates durante el paseo."},{"grupo":"La despensa carioca","icon":"🫘","foto":"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80","productos":"Farofa, tapioca, feijão, arroz, polvilho, pão de queijo congelado y condimentos.","historia":"Aquí entiendes cómo se construye una mesa brasileña. La farofa acompaña carnes y feijoada; la goma de tapioca se prepara en sartén.","tip":"Si el alojamiento tiene cocina, arma un desayuno brasileño con tapioca, queso, fruta y café."},{"grupo":"Quesos y refrigerados","icon":"🧀","foto":"https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?auto=format&fit=crop&w=1200&q=80","productos":"Queijo minas, requeijão, catupiry, queijo coalho y gorgonzola brasileño.","historia":"El queijo minas puede ser fresco, estándar o curado. El requeijão cremoso aparece en desayunos, pizzas y recetas caseras.","tip":"No confundas gorgonzola con roquefort: tienen perfiles diferentes. Los refrigerados no son buena compra para viajes largos."},{"grupo":"Café y desayuno","icon":"☕","foto":"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80","productos":"Cafés de distintas regiones, filtros de tela o papel, pão de queijo, biscoito de polvilho y dulces.","historia":"Lee si el café es tradicional, superior, gourmet o especial y si viene en grano o molido. No todos buscan el mismo sabor.","tip":"Para un regalo con identidad de la guía, conoce también el Café Ernestinho y sus variedades."},{"grupo":"Sol, playa y emergencia","icon":"🏖️","foto":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80","productos":"Protector solar, repelente, agua, snacks, hielo, curitas y artículos de higiene.","historia":"Comprar lejos de la primera línea de playa puede resultar más conveniente y permite revisar tamaños y marcas con calma.","tip":"Lleva una bolsa reutilizable: algunos comercios cobran o limitan las bolsas, y te servirá durante todo el viaje."}],"SUPERMERCADOS_COPACABANA":[["Mundial","Rua Siqueira Campos, 71","Buena referencia para compra grande y precios; suele tener mucho movimiento."],["Zona Sul — Bolívar","Av. Nossa Senhora de Copacabana, 936","Unidad grande en la región de Posto 5; útil para productos preparados y compra completa."],["Zona Sul — Siqueira Campos","Av. Nossa Senhora de Copacabana, 595","Bien ubicado para Postos 3–4 y parte central del barrio."],["Zona Sul — Joaquim Nabuco","Av. Nossa Senhora de Copacabana, 1369","Práctico para Posto 6 y límite con Ipanema."],["Zona Sul — Sá Ferreira","Av. Nossa Senhora de Copacabana, 1200","Otra alternativa útil en la zona de Posto 5/6."],["Zona Sul — Francisco Sá","Rua Francisco Sá, 35","Muy útil para quienes están cerca de Arpoador y Posto 6."],["Zona Sul — Dias da Rocha","Rua Dias da Rocha, 29","Supermercado de barrio bien conectado con la zona central de Copacabana."],["Pão de Açúcar","Av. Nossa Senhora de Copacabana, 493","Unidad central y de fácil acceso para compras rápidas o completas."],["Pão de Açúcar","Av. Nossa Senhora de Copacabana, 1162","Alternativa para Posto 5/6."],["Pão de Açúcar","Rua Siqueira Campos, 97","Muy cerca del eje Siqueira Campos."],["Pão de Açúcar","Rua Ministro Viveiros de Castro, 38","Opción para el lado de Leme/Posto 2."],["Extra Mercado","Rua Siqueira Campos, 143","Supermercado tradicional del eje Siqueira Campos."],["Hortifruti","Rua Siqueira Campos, 74 / otras unidades del barrio","Especialmente útil para frutas, verduras, productos frescos y compra ligera."]],"TIPOS_RODIZIO":[{"nombre":"Churrascaría","icon":"🥩","texto":"Cortes servidos en espadas, buffet y acompañamientos. Ideal para probar carnes brasileñas."},{"nombre":"Pizza","icon":"🍕","texto":"Porciones pequeñas saladas y dulces pasan por la mesa. Pregunta si puedes pedir un sabor."},{"nombre":"Sushi","icon":"🍣","texto":"Secuencia de piezas, temakis y platos calientes; revisa qué productos premium quedan fuera."},{"nombre":"Petiscos o fondue","icon":"🫕","texto":"Formatos variables para compartir. Confirma duración, reposiciones y bebidas incluidas."}],"RODIZIO_PASOS":[{"paso":"1","titulo":"Antes de sentarte","icon":"💳","texto":"Pregunta el precio por persona, si existe promoción por horario y qué está incluido. Bebidas, postres, café y el 10% de servicio normalmente van aparte."},{"paso":"2","titulo":"Conoce la señal","icon":"🟢","texto":"En muchas churrascarías una ficha verde indica “pueden seguir sirviendo” y la roja “quiero una pausa”. Puedes cambiarla cuantas veces necesites."},{"paso":"3","titulo":"No ataques el buffet","icon":"🥗","texto":"Prueba ensaladas y acompañamientos, pero deja espacio. Pan, papas, sushi y masas llenan rápido antes de que lleguen los cortes especiales."},{"paso":"4","titulo":"Elige y pregunta","icon":"🥩","texto":"No debes aceptar todo. Pregunta el nombre del corte, pide el punto de cocción que prefieres y solicita otra porción de lo que realmente te gustó."},{"paso":"5","titulo":"Prueba con estrategia","icon":"🍖","texto":"Comienza con porciones pequeñas. Picanha, fraldinha, maminha, costela y cupim tienen texturas distintas; guarda apetito para comparar."},{"paso":"6","titulo":"Haz una pausa","icon":"🔴","texto":"Gira la ficha a rojo, conversa y decide si quieres repetir. Rodizio no es una competencia y puedes terminar cuando estés satisfecho."},{"paso":"7","titulo":"Revisa la cuenta","icon":"🧾","texto":"Comprueba cantidad de personas, bebidas, postres, couvert y servicio antes de pagar. La propina sugerida debe aparecer claramente."}],"SOL_RIO":[{"nombre":"Pedra do Arpoador","momento":"Atardecer clásico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385260/arpoador_fotos.jpg","detalle":"El sol cae detrás de Dois Irmãos y enciende Ipanema. Llega 45 minutos antes.","mapa":"https://www.google.com/maps/search/?api=1&query=Pedra+do+Arpoador"},{"nombre":"Vista Chinesa","momento":"Final de la tarde","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389092/chinesa.jpg","detalle":"Lagoa, Cristo, playas y montañas desde la Floresta da Tijuca. Organiza el regreso.","mapa":"https://www.google.com/maps/search/?api=1&query=Vista+Chinesa+Rio"},{"nombre":"Parque da Cidade","momento":"Atardecer panorámico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788349705/MAC1.jpg","detalle":"Desde Niterói se alinean la bahía, el Pan de Azúcar y el Cristo. Regresa antes de quedar aislado.","mapa":"https://www.google.com/maps/search/?api=1&query=Parque+da+Cidade+Niteroi"},{"nombre":"Mureta da Urca","momento":"Hora dorada","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386498/hora_dorada_urca.jpg","detalle":"Una puesta de sol relajada frente a la bahía, perfecta con bebida y petisco.","mapa":"https://www.google.com/maps/search/?api=1&query=Mureta+da+Urca"},{"nombre":"Mirante do Leblon","momento":"Atardecer sin sendero","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386722/mirante_leblon.jpg","detalle":"Una vista fácil de Leblon, Ipanema y Arpoador para combinar con una tarde de playa.","mapa":"https://www.google.com/maps/search/?api=1&query=Mirante+do+Leblon"},{"nombre":"Praia Vermelha","momento":"Amanecer","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386638/praia_vermelha.jpg","detalle":"Mar, arena y Pan de Azúcar con luz suave. Continúa luego por la Pista Cláudio Coutinho.","mapa":"https://www.google.com/maps/search/?api=1&query=Praia+Vermelha+Rio"},{"nombre":"Enseada de Botafogo","momento":"Amanecer urbano","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389094/botagofoxx.jpg","detalle":"Barcos en primer plano y el Pan de Azúcar recibiendo las primeras luces.","mapa":"https://www.google.com/maps/search/?api=1&query=Enseada+de+Botafogo"},{"nombre":"Aterro do Flamengo","momento":"Amanecer activo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389092/aterro_flamengo.jpg","detalle":"Palmeras, ciclovía y bahía forman una escena carioca mientras la ciudad despierta.","mapa":"https://www.google.com/maps/search/?api=1&query=Aterro+do+Flamengo"},{"nombre":"Mirante Dona Marta","momento":"Primeras luces","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385469/dona_martas.jpg","detalle":"Una vista elevada del Cristo, Pan de Azúcar y bahía. Ve con transporte y horario organizados.","mapa":"https://www.google.com/maps/search/?api=1&query=Mirante+Dona+Marta"},{"nombre":"Pan de Azúcar","momento":"Atardecer completo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385605/pan.jpg","detalle":"Sube temprano para ver hora dorada, puesta de sol y las luces de la ciudad.","mapa":"https://www.google.com/maps/search/?api=1&query=Pao+de+Acucar+Rio"}],"ERRORES_MAPS":[{"icon":"🚶","error":"Aceptar el camino más corto","solucion":"Puede incluir escaleras, accesos cerrados, senderos o zonas que no conoces. Compara la ruta con calles principales y transporte."},{"icon":"📍","error":"Marcar el monumento y no la entrada","solucion":"Cristo, Pan de Azúcar, parques, estadios y playas extensas tienen accesos específicos. Busca “entrada”, “bilheteria” o estación correspondiente."},{"icon":"🏪","error":"Elegir la unidad equivocada","solucion":"Restaurantes, hospitales y tiendas pueden tener varias sucursales. Revisa barrio, calle y número antes de pedir el vehículo."},{"icon":"🕐","error":"Creer ciegamente en los horarios","solucion":"Feriados, eventos, mantenimiento y última admisión cambian la operación. Confirma siempre en el canal oficial."},{"icon":"🚌","error":"No mirar el sentido del transporte","solucion":"La estación correcta puede tener accesos en lados opuestos. Comprueba destino final, plataforma y sentido antes de embarcar."},{"icon":"🌧️","error":"Ignorar lluvia, calor y equipaje","solucion":"Una caminata corta puede ser mala decisión con tormenta, sol intenso, niños o maletas. Recalcula según las condiciones reales."},{"icon":"📶","error":"Depender totalmente de la señal","solucion":"Descarga el mapa, guarda la dirección escrita y toma captura del acceso. En senderos y miradores puede fallar internet."},{"icon":"🚘","error":"Pedir el vehículo en cualquier punto","solucion":"Aeropuertos, estadios y eventos usan zonas específicas de embarque. Caminar hasta otro punto puede cancelar o encarecer el viaje."}],"RUTA_PORTUARIA_COMPONENT":[{"n":1,"nombre":"AquaRio","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695730/ernestimho_aquario.png","texto":"Comienza junto al mar en uno de los grandes atractivos familiares de la Zona Portuaria. Sus enormes tanques, túneles y vida marina permiten empezar el día sin prisa antes de continuar caminando por el Boulevard Olímpico.","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro","sec":"familia","id":"aquario"},{"n":2,"nombre":"Yup Star Rio","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695734/ernestinho_roda_gigante.png","texto":"La rueda gigante se convirtió en una de las imágenes más reconocibles del Porto Maravilha. Si decides subir, tendrás una perspectiva diferente de la zona portuaria y de la Bahía de Guanabara; si no, vale igualmente la parada para verla y fotografiarla.","mapa":"https://www.google.com/maps/search/?api=1&query=Yup+Star+Rio","sec":"familia","id":"yup-star"},{"n":3,"nombre":"Mural Etnias","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695735/ernestinho_mural_etnias.png","texto":"Continúa por el Boulevard Olímpico hasta la monumental obra de Eduardo Kobra. Sus enormes retratos y colores cuentan una historia de diversidad cultural y transformaron este tramo del antiguo puerto en una galería a cielo abierto.","mapa":"https://www.google.com/maps/search/?api=1&query=Mural+Etnias+Eduardo+Kobra+Rio+de+Janeiro","sec":"que_hacer"},{"n":4,"nombre":"Museu do Amanhã","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695731/ernestinho_Museu_do_Amanh%C3%A3_%C3%A0_Beira-Mar.png","texto":"Llegar a Praça Mauá y encontrarse con el Museu do Amanhã es uno de los momentos más bonitos de la ruta. Puedes admirar su arquitectura desde fuera o reservar tiempo para entrar a sus exposiciones sobre ciencia, sociedad, sostenibilidad y futuros posibles.","mapa":"https://www.google.com/maps/search/?api=1&query=Museu+do+Amanha+Rio+de+Janeiro","sec":"museos","id":"amanha"},{"n":5,"nombre":"Mosteiro de São Bento","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695736/ernestinho_sao_bento.png","texto":"Desde la zona portuaria damos el salto hacia la historia colonial. Por fuera es sobrio; por dentro sorprende con uno de los conjuntos barrocos dorados más impresionantes de Río. Entra con calma y recuerda que sigue siendo un espacio religioso.","mapa":"https://www.google.com/maps/search/?api=1&query=Mosteiro+de+Sao+Bento+Rio+de+Janeiro","sec":"iglesias","id":"mosteiro-sao-bento"},{"n":6,"nombre":"Confeitaria Colombo","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695732/ernestinho_cafe_colombo.png","texto":"Ya en pleno Centro, haz una pausa en esta institución carioca fundada en 1894. Sus espejos, vitrales, madera y salón histórico son parte de la experiencia. Puedes entrar para conocerla, tomar un café o darte un gusto antes de la última parada.","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Rua+Goncalves+Dias+Rio+de+Janeiro","sec":"gastronomia","id":"colombo-centro"},{"n":7,"nombre":"Real Gabinete Português de Leitura","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695737/ernestinho_real_gabinte.png","texto":"Termina en una de las joyas arquitectónicas del Centro. Sus estanterías ascienden varios pisos y envuelven la sala de lectura en un ambiente único. Cuando entres, no mires solamente los libros: levanta la vista y observa todos los detalles.","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura+Rio+de+Janeiro","sec":"espacios_literarios","id":"real-gabinete"}]};openHash()}
