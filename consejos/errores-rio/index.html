  ". Muchos cargadores de celulares, notebooks, cámaras y tablets indican algo parecido a “100–240 V, 50/60 Hz”. Eso significa que aceptan un rango amplio de voltaje; aun así, puede que necesites adaptar la forma del enchufe.": {
    "PT": ". Muitos carregadores de celulares, notebooks, câmeras e tablets indicam algo como “100–240 V, 50/60 Hz”. Isso significa que aceitam uma ampla faixa de tensão; mesmo assim, pode ser necessário adaptar o formato do plugue.",
    "EN": ". Many phone, laptop, camera and tablet chargers show something like “100–240 V, 50/60 Hz”. This means they accept a wide voltage range; you may still need an adapter for the plug shape."

  "Brasil utiliza oficialmente el estándar tipo N, con tres pines redondos. También puedes encontrar tomas donde encajan algunos enchufes europeos de dos pines redondos, pero no conviene asumir compatibilidad: mira tu cargador antes de conectarlo.": {
    "PT": "O Brasil utiliza oficialmente o padrão tipo N, com três pinos redondos. Você também pode encontrar tomadas que aceitam alguns plugues europeus de dois pinos redondos, mas não presuma compatibilidade: confira seu carregador antes de ligá-lo.",
    "EN": "Brazil officially uses the type N standard, with three round pins. You may also find sockets that accept some European plugs with two round pins, but do not assume compatibility: check your charger before plugging it in."
  },

    "EN": "The plug you will find in Brazil"
  },
  "En Brasil el voltaje varía según la ciudad e incluso la instalación. En Río de Janeiro es común encontrar 127 V, pero alojamientos y circuitos específicos pueden ofrecer 220 V. Mira la indicación de la toma o pregunta en el alojamiento antes de conectar un aparato sensible.": {
    "PT": "No Brasil, a tensão varia conforme a cidade e até a instalação. No Rio de Janeiro, é comum encontrar 127 V, mas hospedagens e circuitos específicos podem oferecer 220 V. Confira a indicação da tomada ou pergunte na hospedagem antes de ligar um aparelho sensível.",
    "EN": "In Brazil, voltage varies by city and even by installation. In Rio de Janeiro, 127 V is common, but accommodation and specific circuits may supply 220 V. Check the socket label or ask at your accommodation before connecting a sensitive device."
  },
  "En el alojamiento": {
    "PT": "Na hospedagem",
    "EN": "At your accommodation"
  },
  "Enchufes y voltaje en Brasil": {
    "PT": "Plugues e tensão no Brasil",
    "EN": "Plugs and voltage in Brazil"
  },
  "Qué llevaría yo": {
    "PT": "O que eu levaria",
    "EN": "What I would bring"
  },
  "Revisa enchufe, rango de voltaje y potencia de cada aparato importante. Si algo no está claro, consulta el manual del fabricante. Con celulares y notebooks modernos el problema suele ser la forma de la clavija; con aparatos de calor, el voltaje merece mucha más atención.": {
    "PT": "Confira o plugue, a faixa de tensão e a potência de cada aparelho importante. Se algo não estiver claro, consulte o manual do fabricante. Com celulares e notebooks modernos, o problema costuma ser o formato do plugue; com aparelhos que aquecem, a tensão merece muito mais atenção.",
    "EN": "Check the plug, voltage range and power rating of every important device. If anything is unclear, consult the manufacturer’s manual. With modern phones and laptops, the issue is usually the plug shape; with heat-producing appliances, voltage needs much closer attention."
  },
  "Secadores, planchas de pelo, afeitadoras, cafeteras y aparatos que producen calor pueden no ser bivolt. Si la etiqueta muestra un único voltaje, no lo conectes a una tensión diferente sin el equipo adecuado.": {
    "PT": "Secadores, chapinhas, barbeadores, cafeteiras e aparelhos que produzem calor podem não ser bivolt. Se a etiqueta mostrar uma única tensão, não os ligue a uma tensão diferente sem o equipamento adequado.",
    "EN": "Hairdryers, hair straighteners, shavers, coffee makers and heat-producing appliances may not support both voltages. If the label shows a single voltage, do not connect the device to a different voltage without suitable equipment."
  },
  "Si una toma está marcada 220 V, respeta la indicación. Si no está identificada y tienes dudas, pregunta al anfitrión, recepción o propietario. No pruebes un aparato caro para “ver si funciona”.": {
    "PT": "Se uma tomada estiver marcada como 220 V, respeite a indicação. Se não estiver identificada e você tiver dúvidas, pergunte ao anfitrião, à recepção ou ao proprietário. Não teste um aparelho caro para “ver se funciona”.",
    "EN": "If a socket is marked 220 V, follow that indication. If it is unlabelled and you are unsure, ask the host, reception or owner. Do not test an expensive device just to “see whether it works”."

  "Yo armaría la maleta pensando en una ciudad donde puedes pasar de la playa al Metro, entrar a un museo con aire acondicionado, caminar bastante y terminar el día viendo el atardecer. Por eso prefiero prendas ligeras que puedas combinar y repetir antes que llenar la maleta “por si acaso”.": {
    "PT": "Eu faria a mala pensando em uma cidade onde você pode sair da praia para o metrô, entrar em um museu com ar-condicionado, caminhar bastante e terminar o dia vendo o pôr do sol. Por isso, prefiro peças leves que você possa combinar e repetir a encher a mala “por via das dúvidas”.",
    "EN": "I would pack for a city where you can go from the beach to the metro, enter an air-conditioned museum, walk a lot and end the day watching the sunset. That is why I prefer lightweight clothes you can mix and wear again rather than filling a suitcase “just in case”."
  },
  "Yo viajaría con al menos dos medios de pago y los mantendría separados. Lleva solo el efectivo que piensas usar durante el día y revisa siempre el valor en la pantalla antes de acercar o insertar la tarjeta.": {
    "PT": "Eu viajaria com pelo menos dois meios de pagamento e os manteria separados. Leve apenas o dinheiro que pretende usar no dia e confira sempre o valor na tela antes de aproximar ou inserir o cartão.",
    "EN": "I would travel with at least two payment methods and keep them separate. Carry only the cash you expect to use that day and always check the amount on the screen before tapping or inserting your card."
  },
  "en Copacabana suelo recomendar la Barraca Rio 122, en Posto 4, como punto conocido para mis clientes. Eso ayuda a orientarte, pero tus pertenencias siguen siendo tu responsabilidad.": {
    "PT": "em Copacabana, costumo recomendar a Barraca Rio 122, no Posto 4, como ponto conhecido para meus clientes. Isso ajuda na orientação, mas seus pertences continuam sendo sua responsabilidade.",
    "EN": "in Copacabana, I usually recommend Barraca Rio 122 at Posto 4 as a familiar meeting point for my clients. This helps you find your bearings, but your belongings remain your responsibility."
  },
  "si una prenda no combina con varias cosas o no resuelve una actividad concreta, probablemente no necesita viajar contigo. Río se disfruta mucho más moviéndote ligero.": {
    "PT": "se uma peça não combina com várias outras ou não atende a uma atividade específica, provavelmente não precisa viajar com você. O Rio fica muito mais gostoso quando você se movimenta com pouca bagagem.",
    "EN": "if an item of clothing does not go with several others or serve a specific activity, it probably does not need to travel with you. Rio is much more enjoyable when you travel light."

  "Antes de comprar, simplemente pregunta cuánto cuesta. Es una costumbre sencilla que evita sorpresas y te permite comparar tranquilamente antes de decidir.": {
    "PT": "Antes de comprar, simplesmente pergunte quanto custa. É um hábito simples que evita surpresas e permite comparar com calma antes de decidir.",
    "EN": "Before buying, simply ask how much it costs. It is an easy habit that avoids surprises and lets you compare calmly before deciding."
  },
  "Antes de pedir una bebida, comida o alquilar algún servicio en la playa, pregunta el precio. No tiene nada de malo hacerlo y te permite disfrutar sin sorpresas en la cuenta.": {
    "PT": "Antes de pedir bebida, comida ou alugar algum serviço na praia, pergunte o preço. Não há nada de errado nisso e você poderá aproveitar sem surpresas na conta.",
    "EN": "Before ordering a drink or food or renting a service at the beach, ask the price. There is nothing wrong with doing so, and it lets you enjoy yourself without surprises on the bill."
  },
  "Antes de subir, revisa que la matrícula, el modelo del vehículo y la información del conductor coincidan con lo que aparece en la aplicación. Son apenas unos segundos y forman parte de viajar tranquilo.": {
    "PT": "Antes de entrar, confira se a placa, o modelo do veículo e as informações do motorista correspondem ao aplicativo. São apenas alguns segundos e fazem parte de viajar com tranquilidade.",
    "EN": "Before getting in, check that the plate, vehicle model and driver information match the app. It takes only a few seconds and is part of travelling with peace of mind."
  },
  "Copacabana, Ipanema, Leblon, São Conrado, Prainha y las demás playas tienen ambientes completamente diferentes. Parte de la magia de Río está justamente en descubrir cuál combina más con tu estilo de viaje.": {
    "PT": "Copacabana, Ipanema, Leblon, São Conrado, Prainha e as outras praias têm ambientes completamente diferentes. Parte da magia do Rio está justamente em descobrir qual combina mais com seu jeito de viajar.",
    "EN": "Copacabana, Ipanema, Leblon, São Conrado, Prainha and the other beaches have completely different atmospheres. Part of Rio’s magic is discovering which suits your travel style best."
  },
  "Cuando cae la noche, lo más práctico es elegir calles con movimiento y lugares conocidos. Si no conoces la zona, pregunta antes de salir o utiliza una aplicación para planificar tu recorrido.": {
    "PT": "Quando anoitece, o mais prático é escolher ruas movimentadas e lugares conhecidos. Se não conhece a região, pergunte antes de sair ou use um aplicativo para planejar seu percurso.",
    "EN": "After dark, the most practical choice is busy streets and familiar places. If you do not know the area, ask before going out or use an app to plan your journey."
  },
  "Cuando estés sacando fotos, mirando el mapa o buscando una dirección, intenta estar siempre atento a tu teléfono. No necesitas dejar de usarlo: simplemente evita caminar completamente distraído mientras lo llevas en la mano.": {
    "PT": "Ao tirar fotos, olhar o mapa ou buscar um endereço, procure estar sempre atento ao celular. Não precisa deixar de usá-lo: apenas evite caminhar completamente distraído com ele na mão.",
    "EN": "When taking photos, checking a map or finding an address, stay aware of your phone. You do not need to stop using it: just avoid walking completely distracted with it in your hand."
  },
  "En Río puedes estar disfrutando de una playa, caminando por la ciudad o haciendo una trilha y darte cuenta demasiado tarde de cuánto sol recibiste. Llevar protector solar en la mochila es uno de esos pequeños hábitos que hacen una gran diferencia.": {
    "PT": "No Rio, você pode estar curtindo a praia, caminhando pela cidade ou fazendo uma trilha e perceber tarde demais quanto sol recebeu. Levar protetor solar na mochila é um desses pequenos hábitos que fazem uma grande diferença.",
    "EN": "In Rio, you can be enjoying the beach, walking through the city or hiking and realise too late how much sun you have had. Keeping sunscreen in your backpack is one of those small habits that makes a big difference."
  },
  "En Río, como en cualquier destino turístico, es mejor evitar mostrar grandes cantidades de dinero en público. Lleva solamente lo que necesitas y guarda tus tarjetas y efectivo de forma discreta.": {
    "PT": "No Rio, como em qualquer destino turístico, é melhor evitar mostrar grandes quantias de dinheiro em público. Leve apenas o necessário e guarde cartões e dinheiro discretamente.",
    "EN": "In Rio, as in any tourist destination, avoid displaying large amounts of cash in public. Carry only what you need and keep your cards and cash discreetly stored."
  },
  "En internet encontrarás consejos excelentes y también información antigua o exagerada. Antes de tomar una decisión, compara fuentes y, cuando sea posible, pregunta a alguien que viva realmente en Río.": {
    "PT": "Na internet, você encontrará ótimos conselhos e também informações antigas ou exageradas. Antes de decidir, compare fontes e, quando possível, pergunte a alguém que realmente mora no Rio.",
    "EN": "Online you will find excellent advice as well as outdated or exaggerated information. Before deciding, compare sources and, where possible, ask someone who actually lives in Rio."
  },
  "Este es quizás el consejo más importante. Infórmate, utiliza el sentido común, presta atención a tus cosas y después disfruta. Río tiene playas, música, gastronomía, naturaleza, cultura y una energía que difícilmente se explica hasta que la vives.": {
    "PT": "Este talvez seja o conselho mais importante. Informe-se, use o bom senso, cuide das suas coisas e depois aproveite. O Rio tem praias, música, gastronomia, natureza, cultura e uma energia difícil de explicar até você vivê-la.",
    "EN": "This may be the most important tip. Get informed, use common sense, look after your belongings and then enjoy yourself. Rio has beaches, music, food, nature, culture and an energy that is hard to explain until you experience it."
  },
  "La playa es uno de los grandes encantos de Río, pero el ambiente cambia bastante después de que cae el sol. Para disfrutar de la noche, prefiere lugares con movimiento y sigue las recomendaciones de quienes conocen la zona.": {
    "PT": "A praia é um dos grandes encantos do Rio, mas o ambiente muda bastante depois do pôr do sol. Para aproveitar a noite, prefira lugares movimentados e siga as recomendações de quem conhece a região.",
    "EN": "The beach is one of Rio’s great attractions, but the atmosphere changes considerably after sunset. To enjoy the evening, choose busy places and follow advice from people who know the area."
  },
  "Las comunidades forman parte de la historia y de la vida de Río, pero no todas funcionan de la misma manera ni todas están preparadas para recibir visitantes. Si quieres conocer una, hazlo con alguien que conozca bien el lugar y pueda orientarte.": {
    "PT": "As comunidades fazem parte da história e da vida do Rio, mas nem todas funcionam da mesma maneira ou estão preparadas para receber visitantes. Se quer conhecer uma, vá com alguém que conheça bem o lugar e possa orientar você.",
    "EN": "Communities are part of Rio’s history and life, but they do not all operate in the same way or have the same readiness to receive visitors. If you want to visit one, go with someone who knows the place well and can guide you."
  },
  "No es recomendable andar por la Cidade Maravihlosa con artículos de oro, collares llamativos o relojes costosos. Lo mejor es dejarlos en casa o guardados en tu alojamiento y salir ligero para disfrutar Río sin preocuparte por objetos innecesarios.": {
    "PT": "Não recomendo andar pela Cidade Maravilhosa com peças de ouro, colares chamativos ou relógios caros. Melhor deixá-los em casa ou guardados na hospedagem e sair leve para aproveitar o Rio sem preocupação com objetos desnecessários.",
    "EN": "I do not recommend walking around the Cidade Maravilhosa with gold items, conspicuous necklaces or expensive watches. Leave them at home or safely stored at your accommodation and go out light to enjoy Rio without worrying about unnecessary valuables."
  },
  "No necesitas salir con todo lo que tienes en el alojamiento. Lleva solamente lo necesario para tu paseo y guarda el resto en un lugar seguro. Menos cosas encima significa también más comodidad para disfrutar el día.": {
    "PT": "Você não precisa sair com tudo o que tem na hospedagem. Leve apenas o necessário para o passeio e guarde o restante em um lugar seguro. Menos coisas com você também significa mais conforto para aproveitar o dia.",
    "EN": "You do not need to go out with everything you have at your accommodation. Take only what you need for your outing and keep the rest somewhere safe. Carrying fewer things also means greater comfort throughout the day."
  },
  "Río no se conoce corriendo. Es mejor disfrutar dos o tres lugares con calma que intentar marcar diez puntos en un solo día. Deja espacio para sentarte frente al mar, tomar un café o simplemente disfrutar del momento.": {
    "PT": "O Rio não se conhece correndo. É melhor aproveitar dois ou três lugares com calma do que tentar marcar dez pontos em um dia. Deixe tempo para sentar de frente para o mar, tomar um café ou simplesmente curtir o momento.",
    "EN": "You cannot get to know Rio by rushing. It is better to enjoy two or three places calmly than try to tick off ten in one day. Leave time to sit facing the sea, have a coffee or simply enjoy the moment."
  },
  "Río parece fácil de recorrer cuando miras el mapa, pero las montañas, el tráfico y la distribución de los barrios pueden hacer que un trayecto tome más tiempo de lo esperado. Organiza tus recorridos por zonas y aprovecharás mucho mejor el día.": {
    "PT": "O Rio parece fácil de percorrer no mapa, mas as montanhas, o trânsito e a distribuição dos bairros podem tornar um trajeto mais demorado do que o esperado. Organize os passeios por regiões e aproveitará muito melhor o dia.",
    "EN": "Rio looks easy to explore on a map, but mountains, traffic and the layout of neighbourhoods can make journeys longer than expected. Organise your outings by area to make much better use of the day."
  },
  "Río tiene trilhas increíbles, pero antes de comenzar una caminata conviene conocer la ruta, el nivel de dificultad y las condiciones del lugar. Si no conoces el camino, considera hacerlo con un guía o alguien que tenga experiencia en esa trilha.": {
    "PT": "O Rio tem trilhas incríveis, mas antes de caminhar vale conhecer o trajeto, a dificuldade e as condições do lugar. Se não conhece o caminho, considere ir com um guia ou alguém experiente naquela trilha.",
    "EN": "Rio has incredible trails, but before setting out, learn about the route, difficulty and local conditions. If you do not know the way, consider going with a guide or someone experienced on that trail."
  },
  "Si estás disfrutando de una noche carioca y dejas tu bebida sin vigilancia durante un rato, lo más práctico es pedir otra cuando regreses. Así puedes seguir disfrutando de la noche con tranquilidad.": {
    "PT": "Se estiver curtindo uma noite carioca e deixar a bebida sem vigilância por um tempo, o mais prático é pedir outra ao voltar. Assim, você continua aproveitando a noite com tranquilidade.",
    "EN": "If you are enjoying a night out in Rio and leave your drink unattended for a while, the most practical choice is to order another when you return. Then you can keep enjoying the evening with peace of mind."
  },
  "Si necesitas sacar dinero, pagar o resolver algo con tu tarjeta, utiliza siempre los canales oficiales del banco o del establecimiento. Si tienes alguna duda, es mejor preguntar directamente al personal del lugar.": {
    "PT": "Se precisar sacar dinheiro, pagar ou resolver algo com seu cartão, use sempre os canais oficiais do banco ou estabelecimento. Se tiver dúvidas, pergunte diretamente aos funcionários do local.",
    "EN": "If you need to withdraw cash, pay or resolve a card issue, always use the bank’s or venue’s official channels. If you have questions, ask staff directly."
  },
  "Si vas con familia o amigos, pueden turnarse para que alguien vigile las cosas mientras los demás se bañan. Y si estás en nuestro puesto Barraca Rio 122, puedes consultar con nuestro personal para que te orienten sobre dónde dejar tus pertenencias mientras disfrutas del mar.": {
    "PT": "Se estiver com família ou amigos, vocês podem se revezar para alguém cuidar das coisas enquanto os outros entram no mar. E, se estiver em nossa Barraca Rio 122, consulte a equipe para orientação sobre onde deixar seus pertences enquanto aproveita o mar.",
    "EN": "If you are with family or friends, take turns watching your belongings while the others swim. At our Barraca Rio 122, you can ask our staff for advice on where to leave your belongings while enjoying the sea."
  },
  "Activa verificación en dos pasos en WhatsApp y conserva códigos de recuperación fuera del teléfono.": {
    "PT": "Ative a verificação em duas etapas no WhatsApp e guarde os códigos de recuperação fora do celular.",
    "EN": "Enable two-step verification on WhatsApp and keep recovery codes outside your phone."
  },
  "Alguien dice ser tu conductor, pero la matrícula, modelo o fotografía no coinciden. No subas. Verifica los tres datos dentro de la aplicación y confirma tu nombre sin decirlo primero.": {
    "PT": "Alguém diz ser seu motorista, mas a placa, o modelo ou a foto não correspondem. Não entre. Confira os três dados no aplicativo e confirme seu nome sem dizê-lo primeiro.",
    "EN": "Someone claims to be your driver, but the plate, model or photo does not match. Do not get in. Check all three details in the app and confirm your name without saying it first."
  },
  "Alguien te ofrece fotografiar, limpiar algo, colocar una pulsera o prestar un servicio y después exige un pago inesperado. Si no lo quieres, di no antes de aceptar. Si sí lo quieres, acuerda el valor total antes de comenzar.": {
    "PT": "Alguém oferece tirar uma foto, limpar algo, colocar uma pulseira ou prestar um serviço e depois exige um pagamento inesperado. Se não quiser, diga não antes de aceitar. Se quiser, combine o valor total antes de começar.",
    "EN": "Someone offers to take a photo, clean something, put on a bracelet or provide a service and then demands an unexpected payment. If you do not want it, say no before accepting. If you do, agree the total price before starting."
  },
  "Aparecen couvert artístico, productos repetidos, otra cantidad de personas o bebidas no consumidas. Revisa cada línea antes de pagar. Pregunta previamente si existe música con cobro y si el 10% ya está incluido.": {
    "PT": "Aparecem couvert artístico, produtos repetidos, outro número de pessoas ou bebidas não consumidas. Confira cada item antes de pagar. Pergunte antes se há cobrança pela música e se os 10% já estão incluídos.",
    "EN": "A live-music charge, duplicate items, a different number of people or drinks you did not consume appear on the bill. Check each line before paying. Ask beforehand whether music carries a charge and whether the 10% service charge is already included."
  },
  "En zonas turísticas, “es un regalo” y “después vemos” no son una cotización.": {
    "PT": "Em áreas turísticas, “é um presente” e “depois a gente vê” não são um orçamento.",
    "EN": "In tourist areas, “it is a gift” and “we will work it out later” are not price quotes."
  },
  "Fuiste cobrado incorrectamente, perdiste documentos o sufriste un delito. Guarda capturas, recibos, matrícula, hora y dirección; bloquea tarjetas y registra la denuncia. Emergencia: 190. DEAT y BPTur ofrecen apoyo turístico.": {
    "PT": "Você foi cobrado incorretamente, perdeu documentos ou sofreu um crime. Guarde capturas de tela, recibos, placa, horário e endereço; bloqueie cartões e registre a ocorrência. Emergência: 190. DEAT e BPTur oferecem apoio turístico.",
    "EN": "You were charged incorrectly, lost documents or experienced a crime. Keep screenshots, receipts, the vehicle plate, time and address; block your cards and file a report. Emergency: 190. DEAT and BPTur provide tourist support."
  },
  "La prisa es amiga del error. Lee la pantalla final completa, incluso cuando haya gente esperando.": {
    "PT": "A pressa favorece o erro. Leia toda a tela final, mesmo com pessoas esperando.",
    "EN": "Rushing makes mistakes more likely. Read the entire final screen, even if people are waiting."
  },
  "No compares solamente la tasa anunciada; pregunta cuánto recibes exactamente por el monto que vas a cambiar.": {
    "PT": "Não compare apenas a taxa anunciada; pergunte quanto receberá exatamente pelo valor que vai trocar.",
    "EN": "Do not compare only the advertised rate; ask exactly how much you will receive for the amount you exchange."
  },
  "No intentes perseguir ni enfrentar a nadie. Primero aléjate, protege tus cuentas y busca ayuda identificada.": {
    "PT": "Não tente perseguir nem enfrentar ninguém. Primeiro se afaste, proteja suas contas e procure ajuda identificada.",
    "EN": "Do not try to chase or confront anyone. First move away, secure your accounts and seek clearly identifiable help."
  },
  "Nuestro equipo puede esperarte, llevarte al vehículo y cobrar solamente al llegar al destino.": {
    "PT": "Nossa equipe pode esperar por você, levar você ao veículo e cobrar apenas ao chegar ao destino.",
    "EN": "Our team can wait for you, take you to the vehicle and collect payment only when you reach your destination."
  },
  "Pedir una cuenta corregida no es ser problemático: es verificar una compra como en cualquier país.": {
    "PT": "Pedir uma conta corrigida não é criar problema: é conferir uma compra, como em qualquer país.",
    "EN": "Asking for a corrected bill is not being difficult: it is checking a purchase, as you would in any country."
  },
  "Perfiles recientes ofrecen un precio imposible, cobran por adelantado y desaparecen o entregan un voucher que no corresponde. Comprueba nombre, reputación, condiciones, fecha, incluidos y canal oficial. Desconfía de presión para pagar “ahora”.": {
    "PT": "Perfis recentes oferecem um preço impossível, cobram antecipadamente e desaparecem ou entregam um voucher que não corresponde. Confira nome, reputação, condições, data, itens incluídos e canal oficial. Desconfie de pressão para pagar “agora”.",
    "EN": "New profiles offer an implausible price, collect advance payment and disappear or deliver an incorrect voucher. Check the name, reputation, terms, date, inclusions and official channel. Be wary of pressure to pay “now”."
  },
  "Pregunta “¿cuánto cuesta todo?” y no solamente el producto principal.": {
    "PT": "Pergunte “quanto custa tudo?” e não apenas o produto principal.",
    "EN": "Ask “how much is everything?” rather than just the main item."
  },
  "Pregunta “¿para quién vino?”; el conductor debe conocer el nombre mostrado en la reserva.": {
    "PT": "Pergunte “veio buscar quem?”; o motorista deve saber o nome da reserva.",
    "EN": "Ask “who are you here to pick up?”; the driver should know the name on the booking."
  },
  "Recibes WhatsApp o correo pidiendo pagar nuevamente para no perder hotel, apartamento o entrada. No uses el enlace recibido. Entra a la plataforma o contacto original por tu cuenta y verifica allí la reserva.": {
    "PT": "Você recebe WhatsApp ou e-mail pedindo novo pagamento para não perder hotel, apartamento ou ingresso. Não use o link recebido. Acesse por conta própria a plataforma ou o contato original e confira a reserva por lá.",
    "EN": "You receive a WhatsApp message or email asking you to pay again to avoid losing your hotel, apartment or ticket. Do not use the supplied link. Access the platform or original contact independently and verify the booking there."
  },
  "Retira durante el día y lleva solamente el efectivo que realmente usarás.": {
    "PT": "Saque durante o dia e leve apenas o dinheiro que realmente usará.",
    "EN": "Withdraw during the day and carry only the cash you will actually use."
  },
  "Si cambia la cuenta bancaria, Pix o canal de pago a última hora, confirma por una segunda vía antes de transferir.": {
    "PT": "Se a conta bancária, o Pix ou o canal de pagamento mudar na última hora, confirme por uma segunda via antes de transferir.",
    "EN": "If the bank account, Pix details or payment channel changes at the last minute, confirm through a second channel before transferring."
  },
  "Si no puedes ver la pantalla, no pagues. Pide otra máquina o utiliza otro comercio.": {
    "PT": "Se não consegue ver a tela, não pague. Peça outra máquina ou procure outro comércio.",
    "EN": "If you cannot see the screen, do not pay. Ask for another terminal or use another business."
  },
  "Te cobran R$200,00 cuando la compra era R$20,00 o esconden la pantalla diciendo que no se ve por el sol. Mira el valor antes de aproximar, insertar o escribir la clave. En Brasil la coma separa los centavos: R$20,00 son veinte reales.": {
    "PT": "Cobram R$200,00 quando a compra era R$20,00 ou escondem a tela dizendo que não dá para ver por causa do sol. Confira o valor antes de aproximar, inserir ou digitar a senha. No Brasil, a vírgula separa os centavos: R$20,00 são vinte reais.",
    "EN": "You are charged R$200,00 when the purchase was R$20,00, or the screen is hidden with the excuse that sunlight makes it unreadable. Check the amount before tapping, inserting your card or entering your PIN. In Brazil, a comma separates cents: R$20,00 means twenty reais."
  },
  "Te ofrecen una cotización muy atractiva en la calle o un lugar no identificado y no queda claro cuánto recibirás finalmente. Usa casas de cambio identificadas, compara el valor final y cuenta el dinero antes de salir. Evita cambiar grandes cantidades de una vez.": {
    "PT": "Oferecem uma cotação muito atraente na rua ou em um local não identificado, sem deixar claro quanto você receberá. Use casas de câmbio identificadas, compare o valor final e conte o dinheiro antes de sair. Evite trocar grandes quantias de uma vez.",
    "EN": "You are offered an attractive exchange rate on the street or at an unidentified place, without a clear final amount. Use identifiable exchange offices, compare the final amount and count the money before leaving. Avoid exchanging large amounts at once."
  },
  "Te sientas, consumes y después aparecen valores que nunca fueron informados para silla, sombrilla, pescado o bebidas. Pregunta y repite el precio total antes de aceptar. Si es posible, fotografía el menú o cartel y conserva el comprobante.": {
    "PT": "Você se senta, consome e depois aparecem valores nunca informados para cadeira, guarda-sol, peixe ou bebidas. Pergunte e repita o preço total antes de aceitar. Se possível, fotografe o cardápio ou a placa e guarde o comprovante.",
    "EN": "You sit down and order, then previously undisclosed charges appear for a chair, umbrella, fish or drinks. Ask for and repeat the total price before accepting. If possible, photograph the menu or sign and keep the receipt."
  },
  "Trampas para turistas: cómo evitarlas": {

  "Trampas para turistas: cómo evitarlas. Consejos prácticos para vivir Río con más información y menos improvisación.": {

  "Un QR alterado o una clave escrita incorrectamente envía el dinero a otra persona. Antes de confirmar, compara nombre del receptor, institución y monto. Nunca entregues el teléfono desbloqueado para que alguien haga el proceso.": {
    "PT": "Um QR Code alterado ou uma chave digitada incorretamente envia o dinheiro a outra pessoa. Antes de confirmar, compare o nome do destinatário, a instituição e o valor. Nunca entregue o celular desbloqueado para alguém fazer o processo.",
    "EN": "An altered QR code or incorrectly entered key sends money to someone else. Before confirming, check the recipient’s name, institution and amount. Never hand over your unlocked phone for someone else to complete the process."
  },
  "Un cartel muestra 2x1, happy hour o combo, pero la condición tenía horario, producto o forma de pago específica. Antes de pedir, confirma verbalmente qué producto entra, hasta qué hora y cuál será el precio final.": {
    "PT": "Uma placa mostra 2 por 1, happy hour ou combo, mas a condição exigia horário, produto ou forma de pagamento específicos. Antes de pedir, confirme verbalmente qual produto está incluído, até que horas e qual será o preço final.",
    "EN": "A sign advertises two-for-one, happy hour or a combo, but the offer requires a specific time, product or payment method. Before ordering, verbally confirm which product qualifies, until what time and the final price."
  },
  "Un desconocido se acerca demasiado, observa tu clave o afirma que la tarjeta quedó bloqueada. Cancela, guarda la tarjeta y usa otro cajero dentro de banco o shopping. Nunca aceptes ayuda de extraños.": {
    "PT": "Um desconhecido chega perto demais, observa sua senha ou diz que o cartão foi bloqueado. Cancele, guarde o cartão e use outro caixa eletrônico dentro de um banco ou shopping. Nunca aceite ajuda de estranhos.",
    "EN": "A stranger gets too close, watches your PIN or claims your card is blocked. Cancel, put away your card and use another ATM inside a bank or shopping centre. Never accept help from strangers."
  },
  "Una foto rápida del cartel puede evitar discusiones después.": {
    "PT": "Uma foto rápida da placa pode evitar discussões depois.",
    "EN": "A quick photo of the sign can prevent arguments later."

  "Una oferta seria puede explicar por escrito qué incluye, quién opera y cómo funciona la cancelación.": {
    "PT": "Uma oferta séria consegue explicar por escrito o que inclui, quem opera e como funciona o cancelamento.",
    "EN": "A legitimate offer can explain in writing what is included, who operates it and how cancellation works."

  "Una persona se presenta como transporte oficial y ofrece ayuda con las maletas sin explicar tarifa, peajes o equipaje. Usa mostradores identificados, taxi autorizado, aplicación verificada o traslado reservado. Confirma destino y valor antes de salir.": {
    "PT": "Uma pessoa se apresenta como transporte oficial e oferece ajuda com as malas sem explicar tarifa, pedágios ou bagagem. Use balcões identificados, táxi autorizado, aplicativo verificado ou traslado reservado. Confirme o destino e o valor antes de sair.",
    "EN": "Someone presents themselves as official transport and offers help with luggage without explaining fares, tolls or baggage charges. Use identifiable counters, authorised taxis, a verified app or a pre-booked transfer. Confirm the destination and price before leaving."

  "Una red parecida a la del hotel o un mensaje de reserva intenta obtener contraseñas y datos bancarios. Confirma el nombre exacto de la red, evita operaciones bancarias en Wi‑Fi abierto y no abras enlaces de remitentes desconocidos.": {
