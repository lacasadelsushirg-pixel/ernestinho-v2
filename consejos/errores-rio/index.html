function load(){DATA={"CONSEJOS_NUEVOS":[{"id":"maps","icon":"🗺️","titulo":"Errores de Google Maps que pueden hacerte perder tiempo","intro":"El camino más corto no siempre es el más práctico o apropiado para un visitante.","tips":["No sigas atajos por escaleras, senderos o comunidades desconocidas.","Comprueba si el destino tiene varias entradas o unidades.","En Cristo y Pan de Azúcar busca el acceso oficial, no solamente el punto geográfico.","Verifica horarios y cierres en el canal oficial.","Compara transporte público con aplicación según hora, lluvia y equipaje."]}]};EXTRA={"LISTA_20_CONSEJOS":[{"num":"1","titulo":"Caminar con el celular en la mano por cualquier lugar","texto":"Cuando estés sacando fotos, mirando el mapa o buscando una dirección, intenta estar siempre atento a tu teléfono. No necesitas dejar de usarlo: simplemente evita caminar completamente distraído mientras lo llevas en la mano."},{"num":"2","titulo":"Dejar el celular, cartera o mochila sin vigilancia en la playa","texto":"Si vas con familia o amigos, pueden turnarse para que alguien vigile las cosas mientras los demás se bañan. Y si estás en nuestro puesto Barraca Rio 122, puedes consultar con nuestro personal para que te orienten sobre dónde dejar tus pertenencias mientras disfrutas del mar."},{"num":"3","titulo":"Llevar joyas caras o relojes llamativos","texto":"No es recomendable andar por la Cidade Maravihlosa con artículos de oro, collares llamativos o relojes costosos. Lo mejor es dejarlos en casa o guardados en tu alojamiento y salir ligero para disfrutar Río sin preocuparte por objetos innecesarios."},{"num":"4","titulo":"Caminar solo por calles aisladas o poco iluminadas de noche","texto":"Cuando cae la noche, lo más práctico es elegir calles con movimiento y lugares conocidos. Si no conoces la zona, pregunta antes de salir o utiliza una aplicación para planificar tu recorrido."},{"num":"5","titulo":"Ir a la playa de noche pensando que funciona igual que durante el día","texto":"La playa es uno de los grandes encantos de Río, pero el ambiente cambia bastante después de que cae el sol. Para disfrutar de la noche, prefiere lugares con movimiento y sigue las recomendaciones de quienes conocen la zona."},{"num":"6","titulo":"Llevar todos tus documentos y dinero encima","texto":"No necesitas salir con todo lo que tienes en el alojamiento. Lleva solamente lo necesario para tu paseo y guarda el resto en un lugar seguro. Menos cosas encima significa también más comodidad para disfrutar el día."},{"num":"7","titulo":"Entrar a un Uber sin comprobar la matrícula y el conductor","texto":"Antes de subir, revisa que la matrícula, el modelo del vehículo y la información del conductor coincidan con lo que aparece en la aplicación. Son apenas unos segundos y forman parte de viajar tranquilo."},{"num":"8","titulo":"Mostrar públicamente cuánto dinero llevas","texto":"En Río, como en cualquier destino turístico, es mejor evitar mostrar grandes cantidades de dinero en público. Lleva solamente lo que necesitas y guarda tus tarjetas y efectivo de forma discreta."},{"num":"9","titulo":"Aceptar ayuda de desconocidos cuando estás realizando una operación con dinero o tarjeta","texto":"Si necesitas sacar dinero, pagar o resolver algo con tu tarjeta, utiliza siempre los canales oficiales del banco o del establecimiento. Si tienes alguna duda, es mejor preguntar directamente al personal del lugar."},{"num":"10","titulo":"Dejar una bebida abandonada en un bar","texto":"Si estás disfrutando de una noche carioca y dejas tu bebida sin vigilancia durante un rato, lo más práctico es pedir otra cuando regreses. Así puedes seguir disfrutando de la noche con tranquilidad."},{"num":"11","titulo":"Aceptar cualquier precio de un vendedor sin preguntar antes","texto":"Antes de comprar, simplemente pregunta cuánto cuesta. Es una costumbre sencilla que evita sorpresas y te permite comparar tranquilamente antes de decidir."},{"num":"12","titulo":"No preguntar el precio antes de consumir en la playa","texto":"Antes de pedir una bebida, comida o alquilar algún servicio en la playa, pregunta el precio. No tiene nada de malo hacerlo y te permite disfrutar sin sorpresas en la cuenta."},{"num":"13","titulo":"Pensar que todas las playas de Río son iguales","texto":"Copacabana, Ipanema, Leblon, São Conrado, Prainha y las demás playas tienen ambientes completamente diferentes. Parte de la magia de Río está justamente en descubrir cuál combina más con tu estilo de viaje."},{"num":"14","titulo":"Salir sin protector solar","texto":"En Río puedes estar disfrutando de una playa, caminando por la ciudad o haciendo una trilha y darte cuenta demasiado tarde de cuánto sol recibiste. Llevar protector solar en la mochila es uno de esos pequeños hábitos que hacen una gran diferencia."},{"num":"15","titulo":"Subestimar las distancias de Río","texto":"Río parece fácil de recorrer cuando miras el mapa, pero las montañas, el tráfico y la distribución de los barrios pueden hacer que un trayecto tome más tiempo de lo esperado. Organiza tus recorridos por zonas y aprovecharás mucho mejor el día."},{"num":"16","titulo":"Intentar conocer toda la ciudad en un solo día","texto":"Río no se conoce corriendo. Es mejor disfrutar dos o tres lugares con calma que intentar marcar diez puntos en un solo día. Deja espacio para sentarte frente al mar, tomar un café o simplemente disfrutar del momento."},{"num":"17","titulo":"Entrar en una comunidad o favela desconocida por cuenta propia","texto":"Las comunidades forman parte de la historia y de la vida de Río, pero no todas funcionan de la misma manera ni todas están preparadas para recibir visitantes. Si quieres conocer una, hazlo con alguien que conozca bien el lugar y pueda orientarte."},{"num":"18","titulo":"Hacer senderismo por lugares aislados sin conocer la ruta","texto":"Río tiene trilhas increíbles, pero antes de comenzar una caminata conviene conocer la ruta, el nivel de dificultad y las condiciones del lugar. Si no conoces el camino, considera hacerlo con un guía o alguien que tenga experiencia en esa trilha."},{"num":"19","titulo":"Creer todo lo que aparece en internet sobre Río sin verificarlo","texto":"En internet encontrarás consejos excelentes y también información antigua o exagerada. Antes de tomar una decisión, compara fuentes y, cuando sea posible, pregunta a alguien que viva realmente en Río."},{"num":"20","titulo":"Venir con miedo y olvidarte de disfrutar Río","texto":"Este es quizás el consejo más importante. Infórmate, utiliza el sentido común, presta atención a tus cosas y después disfruta. Río tiene playas, música, gastronomía, naturaleza, cultura y una energía que difícilmente se explica hasta que la vives."}],"TRAMPAS_TURISTA":[{"icon":"💳","titulo":"La pantalla de la tarjeta","caso":"Te cobran R$200,00 cuando la compra era R$20,00 o esconden la pantalla diciendo que no se ve por el sol.","accion":"Mira el valor antes de aproximar, insertar o escribir la clave. En Brasil la coma separa los centavos: R$20,00 son veinte reales.","ernestinho":"Si no puedes ver la pantalla, no pagues. Pide otra máquina o utiliza otro comercio."},{"icon":"📱","titulo":"Pix al destinatario equivocado","caso":"Un QR alterado o una clave escrita incorrectamente envía el dinero a otra persona.","accion":"Antes de confirmar, compara nombre del receptor, institución y monto. Nunca entregues el teléfono desbloqueado para que alguien haga el proceso.","ernestinho":"La prisa es amiga del error. Lee la pantalla final completa, incluso cuando haya gente esperando."},{"icon":"🏖️","titulo":"Precio sorpresa en la playa","caso":"Te sientas, consumes y después aparecen valores que nunca fueron informados para silla, sombrilla, pescado o bebidas.","accion":"Pregunta y repite el precio total antes de aceptar. Si es posible, fotografía el menú o cartel y conserva el comprobante.","ernestinho":"Pregunta “¿cuánto cuesta todo?” y no solamente el producto principal."},{"icon":"🚕","titulo":"Traslado sin precio claro","caso":"Una persona se presenta como transporte oficial y ofrece ayuda con las maletas sin explicar tarifa, peajes o equipaje.","accion":"Usa mostradores identificados, taxi autorizado, aplicación verificada o traslado reservado. Confirma destino y valor antes de salir.","ernestinho":"Nuestro equipo puede esperarte, llevarte al vehículo y cobrar solamente al llegar al destino."},{"icon":"🎟️","titulo":"Entrada o excursión inexistente","caso":"Perfiles recientes ofrecen un precio imposible, cobran por adelantado y desaparecen o entregan un voucher que no corresponde.","accion":"Comprueba nombre, reputación, condiciones, fecha, incluidos y canal oficial. Desconfía de presión para pagar “ahora”.","ernestinho":"Una oferta seria puede explicar por escrito qué incluye, quién opera y cómo funciona la cancelación."},{"icon":"🚗","titulo":"Vehículo diferente en la aplicación","caso":"Alguien dice ser tu conductor, pero la matrícula, modelo o fotografía no coinciden.","accion":"No subas. Verifica los tres datos dentro de la aplicación y confirma tu nombre sin decirlo primero.","ernestinho":"Pregunta “¿para quién vino?”; el conductor debe conocer el nombre mostrado en la reserva."},{"icon":"🏧","titulo":"Ayuda innecesaria en el cajero","caso":"Un desconocido se acerca demasiado, observa tu clave o afirma que la tarjeta quedó bloqueada.","accion":"Cancela, guarda la tarjeta y usa otro cajero dentro de banco o shopping. Nunca aceptes ayuda de extraños.","ernestinho":"Retira durante el día y lleva solamente el efectivo que realmente usarás."},{"icon":"🍽️","titulo":"Cuenta con extras","caso":"Aparecen couvert artístico, productos repetidos, otra cantidad de personas o bebidas no consumidas.","accion":"Revisa cada línea antes de pagar. Pregunta previamente si existe música con cobro y si el 10% ya está incluido.","ernestinho":"Pedir una cuenta corregida no es ser problemático: es verificar una compra como en cualquier país."},{"icon":"📶","titulo":"Wi‑Fi y enlaces falsos","caso":"Una red parecida a la del hotel o un mensaje de reserva intenta obtener contraseñas y datos bancarios.","accion":"Confirma el nombre exacto de la red, evita operaciones bancarias en Wi‑Fi abierto y no abras enlaces de remitentes desconocidos.","ernestinho":"Activa verificación en dos pasos en WhatsApp y conserva códigos de recuperación fuera del teléfono."},{"icon":"💱","titulo":"Cambio de dinero sin referencia clara","caso":"Te ofrecen una cotización muy atractiva en la calle o un lugar no identificado y no queda claro cuánto recibirás finalmente.","accion":"Usa casas de cambio identificadas, compara el valor final y cuenta el dinero antes de salir. Evita cambiar grandes cantidades de una vez.","ernestinho":"No compares solamente la tasa anunciada; pregunta cuánto recibes exactamente por el monto que vas a cambiar."},{"icon":"🍹","titulo":"Promoción que cambia en la cuenta","caso":"Un cartel muestra 2x1, happy hour o combo, pero la condición tenía horario, producto o forma de pago específica.","accion":"Antes de pedir, confirma verbalmente qué producto entra, hasta qué hora y cuál será el precio final.","ernestinho":"Una foto rápida del cartel puede evitar discusiones después."},{"icon":"🏨","titulo":"Mensaje falso sobre tu reserva","caso":"Recibes WhatsApp o correo pidiendo pagar nuevamente para no perder hotel, apartamento o entrada.","accion":"No uses el enlace recibido. Entra a la plataforma o contacto original por tu cuenta y verifica allí la reserva.","ernestinho":"Si cambia la cuenta bancaria, Pix o canal de pago a última hora, confirma por una segunda vía antes de transferir."},{"icon":"📸","titulo":"Servicio o foto sin precio acordado","caso":"Alguien te ofrece fotografiar, limpiar algo, colocar una pulsera o prestar un servicio y después exige un pago inesperado.","accion":"Si no lo quieres, di no antes de aceptar. Si sí lo quieres, acuerda el valor total antes de comenzar.","ernestinho":"En zonas turísticas, “es un regalo” y “después vemos” no son una cotización."},{"icon":"🆘","titulo":"Si algo ya ocurrió","caso":"Fuiste cobrado incorrectamente, perdiste documentos o sufriste un delito.","accion":"Guarda capturas, recibos, matrícula, hora y dirección; bloquea tarjetas y registra la denuncia. Emergencia: 190. DEAT y BPTur ofrecen apoyo turístico.","ernestinho":"No intentes perseguir ni enfrentar a nadie. Primero aléjate, protege tus cuentas y busca ayuda identificada."}],"PERFILES_RIO":[{"icon":"👶","titulo":"Con bebés","foto":"https://images.unsplash.com/photo-1544126592-807ade215a0b?auto=format&fit=crop&w=1000&q=80","plan":"Mañanas cortas en Copacabana o Urca, una atracción principal como AquaRio y regreso al alojamiento antes de que el calor/cansancio domine. Mantén un plan B cubierto para lluvia.","claves":"Cuna confirmada, ascensor desde la calle, cambiador, cochecito, sombra, agua, farmacia cercana y trayectos con pocas conexiones. Revisa también si Uber/taxi acepta el volumen del cochecito.","tip":"No programes tres barrios en un día: el descanso también es parte del itinerario."},{"icon":"👨‍👩‍👧","titulo":"Con niños","foto":"https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1000&q=80","plan":"Alterna actividad de movimiento y actividad cultural: AquaRio o BioParque, playa sólo con mar compatible, Planetário, Maracanã Tour, Jardim Botânico o una experiencia corta.","claves":"Identificación, protector, snack, baño cercano y actividad alternativa por lluvia.","tip":"Alterna una visita cultural con algo donde puedan moverse y jugar."},{"icon":"🎧","titulo":"Con adolescentes","foto":"https://images.unsplash.com/photo-1539635278303-d4002c07eae3?auto=format&fit=crop&w=1000&q=80","plan":"Deja que elijan al menos una actividad: Maracanã, parapente/aventura si corresponde, Arpoador, compras, fotografía, playa, kart o experiencia interactiva. Mezcla autonomía con horarios y puntos de encuentro claros.","claves":"Acuerdos claros, batería, internet y punto de encuentro.","tip":"Déjalos elegir una actividad completa; aumenta muchísimo el entusiasmo."},{"icon":"👵","titulo":"Adultos mayores","foto":"https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=1000&q=80","plan":"Construye el día alrededor de una o dos atracciones con ascensor/baños/asientos: AquaRio, Museu do Amanhã, CCBB, Pan de Azúcar según movilidad, orlas y Centro en tramos cortos con transporte entre puntos.","claves":"Sombra, baños, asientos, poca espera de pie, horarios frescos, medicamentos, hidratación, documento para beneficios y punto claro de descenso del vehículo.","tip":"Dos atracciones bien disfrutadas valen más que cinco recorridas con cansancio."},{"icon":"♿","titulo":"Movilidad reducida","foto":"https://images.unsplash.com/photo-1570793005299-c091be8a9a0f?auto=format&fit=crop&w=1000&q=80","plan":"Museu do Amanhã, AquaRio, Pan de Azúcar, orlas y espacios con acceso confirmado.","claves":"Entrada, baño, ascensor, transporte y acompañante deben confirmarse por separado.","tip":"“Accesible” no siempre significa accesibilidad completa; llama antes de reservar."},{"icon":"👩","titulo":"Mujeres que viajan solas","foto":"https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1000&q=80","plan":"Actividades grupales identificadas, barrios conectados y regreso nocturno organizado.","claves":"Compartir trayecto, verificar vehículo y evitar esperas aisladas.","tip":"Si algo no te transmite confianza, cambia el plan sin sentir que debes justificarte."},{"icon":"🎒","titulo":"Viajeros solos","foto":"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=80","plan":"Walking tours, samba, senderos con grupo y mesas o barras informales.","claves":"Hospedaje conectado, encuentros públicos y contacto de emergencia.","tip":"Las actividades compartidas ayudan a conocer gente sin depender de desconocidos."},{"icon":"🏳️‍🌈","titulo":"Viajeros LGBTQIA+","foto":"https://images.unsplash.com/photo-1562887284-8ba6b7c90fd8?auto=format&fit=crop&w=1000&q=80","plan":"Ipanema, Copacabana, Botafogo y eventos con público y organización identificables.","claves":"Revisar ambiente, transporte nocturno y precauciones urbanas habituales.","tip":"Busca programación actual: una fiesta conocida puede cambiar de dirección o fecha."},{"icon":"💸","titulo":"Mochileros","foto":"https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1000&q=80","plan":"Combina playa y espacios gratuitos con una atracción pagada cada cierto tiempo. Centro cultural, miradores gratuitos, walking por zonas, comida por quilo y transporte público permiten viajar barato sin convertir todos los días en sacrificio.","claves":"Metro, comida por kilo, botella de agua y presupuesto de emergencia.","tip":"Ahorrar cruzando la ciudad puede costarte horas; agrupa el día por barrios."},{"icon":"💛","titulo":"Parejas","foto":"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1000&q=80","plan":"Elige un gran momento diario en vez de diez paradas: amanecer o atardecer, Urca, Arpoador, cena especial, samba, paseo privado, lancha o helicóptero según presupuesto y estilo.","claves":"Una reserva especial y suficiente tiempo libre sin itinerario rígido.","tip":"Elige un momento inolvidable por día; no llenes cada minuto."}]};LAZY={"LLUVIA_RIO":[{"hora":"09:00","nombre":"AquaRio + Boulevard bajo lluvia moderada","foto":"https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80","tipo":"Familias · cubierto","descripcion":"AquaRio es una de las alternativas más fáciles cuando el tiempo está feo. Si la lluvia baja, el Boulevard Olímpico permite moverte entre atracciones cercanas sin cruzar la ciudad.","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro"},{"hora":"10:00","nombre":"Museu do Amanhã + MAR","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","tipo":"Ciencia + arte · misma zona","descripcion":"Dos grandes opciones en Praça Mauá. Son especialmente útiles porque puedes construir medio día cultural con traslados cortos. Comprueba qué museo cierra ese día antes de salir.","mapa":"https://www.google.com/maps/search/?api=1&query=Praca+Maua+Rio+de+Janeiro"},{"hora":"10:30","nombre":"CCBB + Paço Imperial + Casa FCasa França-Brasil","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","tipo":"Centro cultural · económico","descripcion":"El Centro concentra espacios culturales cubiertos muy cerca entre sí. CCBB suele ser uno de los mejores refugios culturales; combina según exposiciones, horarios y la intensidad real de la lluvia.","mapa":"https://www.google.com/maps/search/?api=1&query=CCBB+Rio+de+Janeiro"},{"hora":"12:30","nombre":"Almuerzo con historia","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389093/colombo_as.jpg","tipo":"Gastronomía · Centro","descripcion":"Usa la lluvia para sentarte sin culpa: Colombo, restaurantes tradicionales del Centro, buffet por kilo o un boteco clásico pueden formar parte del recorrido en vez de ser solamente una pausa.","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Centro+Rio"},{"hora":"14:00","nombre":"Real Gabinete + Biblioteca Nacional","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","tipo":"Literatura + arquitectura","descripcion":"El Real Gabinete es breve pero impresionante. Si las visitas y horarios coinciden, combínalo con Biblioteca Nacional, Cinelândia y otros interiores del Centro.","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura"},{"hora":"15:30","nombre":"Theatro Municipal o visita cultural en Cinelândia","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/teatro_municipal.jpg","tipo":"Arquitectura + espectáculo","descripcion":"Si existe visita guiada o función compatible, el Theatro Municipal transforma una tarde gris en uno de los planes más memorables del Centro. Consulta programación antes de desplazarte.","mapa":"https://www.google.com/maps/search/?api=1&query=Theatro+Municipal+Rio+de+Janeiro"},{"hora":"16:00","nombre":"Planetário da Gávea","foto":"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80","tipo":"Ciencia · familias y adultos","descripcion":"Una alternativa que muchos turistas olvidan: exposiciones de astronomía y sesiones de cúpula según programación. Funciona especialmente bien con niños, adolescentes o si ya hiciste los museos del Centro.","mapa":"https://www.google.com/maps/search/?api=1&query=Planetario+da+Gavea+Rio"},{"hora":"16:30","nombre":"Maracanã Tour","foto":"https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=1200&q=80","tipo":"Fútbol · mayormente cubierto","descripcion":"Para amantes del fútbol es una buena salida cuando no quieres pasar el día mirando cuadros. Confirma operación del tour y considera que los accesos exteriores siguen dependiendo de la lluvia.","mapa":"https://www.google.com/maps/search/?api=1&query=Maracana+Tour+Rio"},{"hora":"17:00","nombre":"Museu da República, MAM, Casa Museu Eva Klabin u otros museos","foto":"https://images.unsplash.com/photo-1564399579883-451a5d44ec08?auto=format&fit=crop&w=1200&q=80","tipo":"Plan alternativo por barrio","descripcion":"No existe una única ruta de lluvia. Elige un museo cercano a tu alojamiento o al siguiente plan para no gastar el día dentro de Uber. La guía reúne decenas de museos y centros culturales.","mapa":"https://www.google.com/maps/search/?api=1&query=museus+Rio+de+Janeiro"},{"hora":"18:00","nombre":"Feira de São Cristóvão, shopping, cine o boliche","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788393690/feira-de-sao-cristovao.jpg","tipo":"No todo tiene que ser museo","descripcion":"Si quieres algo más relajado, revisa Feira de São Cristóvão cuando esté operando, shoppings, cine, boliche, escape room, kart indoor o Hotzone. Son buenas salidas para familias y grupos.","mapa":"https://www.google.com/maps/search/?api=1&query=Feira+de+Sao+Cristovao+Rio"},{"hora":"20:00","nombre":"Samba, gastronomía o espectáculo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788393697/rio_scenarium.jpg","tipo":"Noche · confirmar agenda","descripcion":"Una noche de lluvia no tiene por qué terminar en el hotel. Revisa samba en espacios cubiertos, restaurantes con música, Rio Scenarium u otra programación identificada y organiza el regreso.","mapa":"https://www.google.com/maps/search/?api=1&query=Rio+Scenarium+Rio"}],"SEMANA_RIO":[{"dia":"Lunes","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788199943/IMG_3083.jpg","tema":"Clásicos que no dependen de los museos","manana":"08:00 · Cristo Redentor temprano para evitar calor y mayor concentración de visitantes.","tarde":"13:00 · Almuerzo en Copacabana, Forte de Copacabana y caminata hacia Arpoador.","noche":"19:00 · Cena en Ipanema o roda de samba en Pedra do Sal únicamente si existe programación confirmada.","alternativa":"Pan de Azúcar, AquaRio o playa si algún punto está cerrado.","mapa":"https://www.google.com/maps/dir/Cristo+Redentor/Forte+de+Copacabana/Pedra+do+Arpoador/"},{"dia":"Martes","foto":"https://cdn-imgix.headout.com/media/images/ba22a9ac753ea26a49588514785a6f1a-Santa%20Teresa%20Art%20Street%20of%20Rio%2C%20Brazil.jpg?auto=compress%2Cformat&fit=crop&q=85","tema":"Centro histórico, cultura y samba","manana":"09:00 · Real Gabinete, Confeitaria Colombo, CCBB y Praça XV, revisando los horarios de cada espacio.","tarde":"14:30 · Bonde y paseo por Santa Teresa, Parque das Ruínas y Escadaria Selarón.","noche":"19:30 · Lapa, samba o espectáculo cultural en un lugar identificado y con regreso organizado.","alternativa":"Museu do Amanhã y MAR si prefieres permanecer en la Zona Portuaria.","mapa":"https://www.google.com/maps/dir/Real+Gabinete+Português/Confeitaria+Colombo/CCBB+Rio/Parque+das+Ruínas/Escadaria+Selarón/"},{"dia":"Miércoles","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385260/arpoador_fotos.jpg","tema":"Jardines, playa y atardecer","manana":"08:30 · Jardim Botânico y Parque Lage antes del calor más fuerte.","tarde":"14:00 · Almuerzo y playa en Ipanema; camina por Posto 9 con tiempo.","noche":"17:00 · Atardecer en Arpoador y después cena o bar en Ipanema.","alternativa":"Museos o cafeterías de Botafogo si llueve.","mapa":"https://www.google.com/maps/dir/Jardim+Botânico+do+Rio+de+Janeiro/Parque+Lage/Posto+9+Ipanema/Pedra+do+Arpoador/"},{"dia":"Jueves","foto":"https://cariocando.com.br/assets/images/beaches/praia-vermelha.png","tema":"Urca desde la mañana hasta la hora dorada","manana":"09:00 · Praia Vermelha y Pista Cláudio Coutinho.","tarde":"13:00 · Almuerzo en Urca y subida al Pan de Azúcar con anticipación.","noche":"18:00 · Mureta da Urca para observar la bahía; cena en el barrio o regreso a Botafogo.","alternativa":"Casa da Ciência y espacios culturales cercanos si el clima cambia.","mapa":"https://www.google.com/maps/dir/Praia+Vermelha/Pista+Cláudio+Coutinho/Pão+de+Açúcar/Mureta+da+Urca/"},{"dia":"Viernes","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389094/botagofoxx.jpg","tema":"Excursión y comienzo del fin de semana","manana":"07:00 · Salida a Petrópolis, Niterói o una experiencia de naturaleza y aventura.","tarde":"Continúa la excursión sin llenar el regreso con otra atracción distante.","noche":"20:00 · Botafogo, Lapa o samba según la agenda del día.","alternativa":"Full Day Río para quien todavía no conoce los clásicos.","mapa":"https://www.google.com/maps/search/?api=1&query=Botafogo+Rio+de+Janeiro"},{"dia":"Sábado","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/etnias_1.jpg","tema":"Excursiones, ferias y una noche especial","manana":"06:30 · Búzios, Arraial, Angra o Ilha Grande; reserva con anticipación.","tarde":"Si permaneces en Río: Maracaná, Feira de São Cristóvão o Zona Portuaria.","noche":"Samba, pagode, espectáculo o fiesta con transporte de regreso organizado.","alternativa":"Ruta AquaRio–Museu do Amanhã para familias.","mapa":"https://www.google.com/maps/search/?api=1&query=Feira+de+São+Cristóvão+Rio"},{"dia":"Domingo","foto":"https://odia.ig.com.br/_midias/jpg/2023/07/23/whatsapp_image_2023_07_23_at_14_40_13__1_-29900693.jpeg","tema":"Orla, Feira da Glória y familia","manana":"09:00 · Feira da Glória para desayunar, descubrir productos y sentir un domingo carioca.","tarde":"12:30 · Almuerzo y paseo por Aterro do Flamengo; continúa hacia Copacabana o Ipanema.","noche":"17:00 · Atardecer en Arpoador, Urca o Parque da Cidade de Niterói.","alternativa":"AquaRio, parques y actividades familiares según clima.","mapa":"https://www.google.com/maps/dir/Feira+da+Glória/Aterro+do+Flamengo/Pedra+do+Arpoador/"}]};VIS=({"CONSEJOS_VISUALES":{"semana":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Río de Janeiro para organizar actividades durante la semana","links":[["Ver atracciones","que_hacer"],["Explorar gastronomía","gastronomia"],["Ver vida nocturna","vida_nocturna"]]},"lluvia":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Museu do Amanhã como alternativa para un día de lluvia","links":[["Ver museos","museos"],["Conocer AquaRio","familia"],["Explorar centros culturales","centros_culturales"]]},"presupuestos":{"hero":"https://files.sunoresearch.com.br/n/uploads/2024/02/dinheiro-real-brasil.jpg","alt":"Reales brasileños para organizar el presupuesto diario","links":[["Dónde comer","gastronomia"],["Actividades y experiencias","experiencias"],["Guía de transportes","transporte_publico"]]},"caminando":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","alt":"Praça Mauá y Museu do Amanhã en la ruta Zona Portuaria y Centro","links":[["Abrir ruta completa en Google Maps","https://www.google.com/maps/@-22.8991976,-43.1964099,15z/data=!4m2!11m1!2s3dsbSBRj80f-bKZnY6WLKQ?entry=ttu"],["Ver museos","museos"],["Ver gastronomía","gastronomia"]]},"sol":{"hero":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386498/hora_dorada_urca.jpg","alt":"Hora dorada y atardecer desde la Mureta da Urca","links":[["Ver guía para fotografiar Río","fotografia"],["Abrir mapas","fotografia"]]},"supermercado":{"hero":"https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1600&q=80","alt":"Pasillos de un supermercado para descubrir productos brasileños","links":[["Conocer Café Ernestinho","cafe"],["Ver gastronomía","gastronomia"]]},"rodizio":{"hero":"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80","alt":"Carnes servidas en una churrascaría brasileña","links":[["Ver rodizios recomendados","gastronomia"],["Explorar gastronomía","gastronomia"]]}}}).CONSEJOS_VISUALES||{};PORT={"RUTA_PORTUARIA":[{"n":0,"nombre":"Carnaval Experience — punto 0 opcional","foto":"https://res.cloudinary.com/qa301cbc/image/upload/f_auto,q_auto/IMG_3088","historia":"Antes de comenzar la caminata por la Zona Portuaria puedes entrar a la Cidade do Samba y entender cómo se crean fantasías, carros y la estructura del Carnaval. Ernestinho es socio oficial de Carnaval Experience y tenemos enlace con beneficio para nuestros visitantes.","tiempo":"1½–2 h · con entrada","mapa":"https://www.google.com/maps/search/?api=1&query=Cidade+do+Samba+Rio+de+Janeiro"},{"n":1,"nombre":"AquaRio","foto":"https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1200&q=80","historia":"El mayor acuario marino de Sudamérica abre la jornada entre especies brasileñas y un gran túnel oceánico.","tiempo":"2–3 h","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro"},{"n":2,"nombre":"Boulevard Olímpico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/etnias_1.jpg","historia":"La antigua zona portuaria renació como paseo de murales, plazas, almacenes recuperados y vistas de la bahía.","tiempo":"30–45 min","mapa":"https://www.google.com/maps/search/?api=1&query=Boulevard+Olimpico+Rio"},{"n":3,"nombre":"Museu do Amanhã","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389095/maua_y_amanha.jpg","historia":"La arquitectura de Santiago Calatrava parece flotar sobre la bahía y prepara al visitante para pensar futuros posibles.","tiempo":"1½–2 h","mapa":"https://www.google.com/maps/search/?api=1&query=Museu+do+Amanha+Rio"},{"n":4,"nombre":"Mosteiro de São Bento","foto":"https://images.unsplash.com/photo-1596395819057-e37f55a8516b?auto=format&fit=crop&w=1200&q=80","historia":"Tras una subida aparece uno de los interiores barrocos más impresionantes de Río, cubierto de talla dorada.","tiempo":"30–45 min","mapa":"https://www.google.com/maps/search/?api=1&query=Mosteiro+de+Sao+Bento+Rio"},{"n":5,"nombre":"Confeitaria Colombo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389093/colombo_as.jpg","historia":"Espejos belgas, vitrales y dulces convierten la pausa en un viaje al Río de comienzos del siglo XX.","tiempo":"45–60 min","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Centro+Rio"},{"n":6,"nombre":"Real Gabinete Português","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/real_gab.jpg","historia":"Una biblioteca monumental de 1887 cuya sala principal guarda miles de obras bajo una claraboya de colores.","tiempo":"20–30 min","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura"},{"n":7,"nombre":"Theatro Municipal","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389097/teatro_municipal.jpg","historia":"El gran teatro de Cinelândia cierra el recorrido con una fachada inspirada en la Ópera de París.","tiempo":"30 min o visita","mapa":"https://www.google.com/maps/search/?api=1&query=Theatro+Municipal+Rio"}],"SOUVENIRS_RIO":[{"icon":"☕","titulo":"Café brasileño","texto":"Un regalo aromático, fácil de transportar y profundamente brasileño. Revisa si viene molido o en grano y conserva el empaque cerrado.","donde":"Café Ernestinho, cafeterías y supermercados."},{"icon":"🩴","titulo":"Havaianas y moda de playa","texto":"Sandalias, pareos, bikinis y accesorios ocupan poco espacio. Compara talla brasileña y talla de tu país antes de comprar.","donde":"Tiendas oficiales, comercios de barrio y shoppings."},{"icon":"⚽","titulo":"Fútbol y samba","texto":"Camisetas, banderas, instrumentos pequeños y artículos de escuelas de samba llevan una parte de la cultura carioca.","donde":"Tiendas oficiales, Maracaná, Cidade do Samba y ferias."},{"icon":"🍬","titulo":"Dulces brasileños","texto":"Paçoca, goiabada, bananinha, brigadeiro y chocolates funcionan bien como regalos económicos para compartir.","donde":"Supermercados y tiendas de productos brasileños."},{"icon":"🥃","titulo":"Cachaça y bebidas","texto":"Busca procedencia, sello y botella cerrada. Verifica límites de alcohol y líquidos del equipaje antes de decidir.","donde":"Casas especializadas y supermercados reconocidos."},{"icon":"🎨","titulo":"Artesanía carioca","texto":"Ilustraciones, cerámica, joyería, bolsos y piezas hechas a mano son recuerdos más personales que un imán genérico.","donde":"Feirartes, Ipanema, Copacabana, Glória y centros culturales."},{"icon":"🌙","titulo":"Feria nocturna de Copacabana","texto":"Una caminata frente al mar entre puestos de artesanía, camisetas, decoración y pequeños recuerdos. Horarios y montaje pueden variar.","donde":"Avenida Atlântica, Copacabana. Confirma el tramo activo el mismo día."},{"icon":"🧳","titulo":"Antes de cerrar la maleta","texto":"Guarda comprobantes, protege piezas frágiles y comprueba restricciones de alimentos, semillas, madera, alcohol y líquidos de tu destino.","donde":"Consulta aduana y aerolínea antes del vuelo."}],"FAQ_DESTACADAS":[{"q":"¿Qué documento debo llevar?","a":"Depende de tu nacionalidad y del acuerdo vigente. Comprueba que el documento aceptado esté en buen estado y tenga vigencia suficiente; lleva copia digital separada y no dependas de una fotografía como documento de viaje."},{"q":"¿Qué pasa si un menor viaja con solo uno de sus padres?","a":"Puede necesitar autorización del responsable ausente, normalmente formalizada según las reglas del país de salida, además de documentos del menor y acompañante. Verifica aerolínea, migración y autoridad consular con anticipación."},{"q":"¿Cuánto tiempo puedo permanecer?","a":"La admisión habitual puede ser de hasta 90 días según la nacionalidad y decisión migratoria. Algunas personas pueden solicitar prórroga hasta el límite aplicable antes del vencimiento, acreditando requisitos ante la Policía Federal."},{"q":"¿Qué hago si necesito atención médica?","a":"Con seguro, contacta primero la central indicada en la póliza cuando sea posible. En una urgencia también puedes buscar la red pública SUS llevando tu documento; para emergencias médicas llama al 192."},{"q":"¿Cuánto dinero necesito?","a":"Separa alojamiento y entradas anticipadas. Para el gasto diario considera transporte, comidas, playa, bebidas y una reserva. La guía incluye ejemplos de R$100, R$200 y R$500 sin hospedaje."},{"q":"¿Puedo utilizar tarjetas extranjeras?","a":"Generalmente sí cuando están habilitadas para uso internacional. Avisa al banco, conserva una alternativa y mira el monto en la máquina antes de aproximar o ingresar la clave."},{"q":"¿Necesito efectivo si existe Pix?","a":"Conviene llevar una cantidad pequeña. Un turista no obtiene Pix automáticamente: depende de CPF, cuenta o aplicación habilitada. Nunca dependas de un solo medio de pago."},{"q":"¿Cuál aeropuerto debo seleccionar?","a":"Río tiene Galeão (GIG) y Santos Dumont (SDU). Comprueba el código en cada tramo, especialmente si haces conexión, porque están en zonas diferentes."},{"q":"¿Es seguro usar el teléfono en la calle?","a":"Úsalo con discreción, lejos del borde de la calle y de puertas de vehículos. Para estudiar una ruta larga, entra a un comercio o utiliza mapas descargados."},{"q":"¿Qué hago si pierdo el celular?","a":"Bloquea línea, bancos, correo y sesiones desde otro dispositivo; cambia contraseñas prioritarias, registra la denuncia y no intentes recuperarlo siguiendo una ubicación por tu cuenta."},{"q":"¿Qué conviene reservar antes?","a":"Cristo, Pan de Azúcar, Maracaná, grandes eventos, excursiones y restaurantes especiales pueden agotarse. Reserva solamente cuando fecha, incluidos y política estén claros."},{"q":"¿Cómo contacto a Ernestinho?","a":"Escribe al WhatsApp +55 21 96994‑6938 indicando fecha, cantidad de personas y qué necesitas: traslado, hospedaje, actividad u orientación."}],"RIO_HOJE_FALLBACK_RECURRING":[{"eventId":"feirarte-general-osorio","title":"Feirarte I — Praça General Osório","weekdays":[0],"startTime":"08:00","endTime":"20:00","venueName":"Praça General Osório","neighborhood":"Ipanema","zone":"Zona Sul","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTESANATO","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":false,"qualityScore":94},{"eventId":"feirarte-praca-xv","title":"Feirarte II — Praça XV","weekdays":[4,5],"startTime":"08:00","endTime":"20:00","venueName":"Praça XV de Novembro","neighborhood":"Centro","zone":"Centro","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTESANATO","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":90},{"eventId":"feirarte-saenz-pena","title":"Feirarte III — Praça Sáenz Peña","weekdays":[5,6],"startTime":"08:00","endTime":"20:00","venueName":"Praça Sáenz Peña","neighborhood":"Tijuca","zone":"Zona Norte","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTESANATO","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":89},{"eventId":"feirarte-lido","title":"Feirarte V — Praça do Lido","weekdays":[6,0],"startTime":"11:00","endTime":"23:00","venueName":"Praça do Lido","neighborhood":"Copacabana","zone":"Zona Sul","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTESANATO","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":90},{"eventId":"feirarte-atlantica","title":"Feirarte VI — Calçadão de Copacabana","weekdays":[6,0],"startTime":"16:00","endTime":"24:00","venueName":"Calçadão da Avenida Atlântica","neighborhood":"Copacabana","zone":"Zona Sul","eventType":"RECURRENT_FAIR","categories":["FERIAS","ARTE","GRATIS","CULTURA"],"priceMode":"FREE","sourceIds":["carioca-feirartes"],"sourceUrl":"https://carioca.rio/servicos/feiras-especiais-de-artes-feirarte/","verificationStatus":"RECURRENT_OFFICIAL","verifiedAt":"2026-09-13","hiddenGem":true,"qualityScore":88}]};SPECIAL={"SUPERMERCADO_BRASIL":[{"grupo":"Frutas que invitan a probar","icon":"🥭","foto":"/assets/embedded-images/embedded-01-64b430214df2.jpg","productos":"Goiaba, jabuticaba, maracujá, acerola, carambola, manga y diferentes tipos de banana.","historia":"No mires solamente: pregunta qué está maduro y compra una porción pequeña. Algunas frutas cambian muchísimo cuando se prueban frescas.","tip":"Las pulpas congeladas son una forma práctica de probar sabores como cupuaçu, graviola y cajá si tienes cocina."},{"grupo":"Bebidas muy brasileñas","icon":"🥤","foto":"/assets/embedded-images/embedded-02-edb8f9facd8b.jpg","productos":"Guaraná, Fanta Uva, mate, agua de coco, jugos de caja, cervezas y cachaças.","historia":"El pasillo de bebidas parece familiar hasta que aparecen sabores que casi no existen fuera de Brasil.","tip":"Prueba una unidad antes de comprar varias. Para bebidas alcohólicas y líquidos, revisa las reglas del equipaje."},{"grupo":"Dulces para regalar","icon":"🍬","foto":"/assets/embedded-images/embedded-03-1f3a05ee1dd5.jpg","productos":"Paçoca, pé de moleque, brigadeiro, goiabada, bananinha, Bis y bombones brasileños.","historia":"Son regalos económicos, livianos y fáciles de compartir. La paçoca es de maní y se desarma con facilidad: ábrela con cuidado.","tip":"Busca paquetes cerrados con fecha y etiqueta. El calor carioca puede derretir chocolates durante el paseo."},{"grupo":"La despensa carioca","icon":"🫘","foto":"https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80","productos":"Farofa, tapioca, feijão, arroz, polvilho, pão de queijo congelado y condimentos.","historia":"Aquí entiendes cómo se construye una mesa brasileña. La farofa acompaña carnes y feijoada; la goma de tapioca se prepara en sartén.","tip":"Si el alojamiento tiene cocina, arma un desayuno brasileño con tapioca, queso, fruta y café."},{"grupo":"Quesos y refrigerados","icon":"🧀","foto":"https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?auto=format&fit=crop&w=1200&q=80","productos":"Queijo minas, requeijão, catupiry, queijo coalho y gorgonzola brasileño.","historia":"El queijo minas puede ser fresco, estándar o curado. El requeijão cremoso aparece en desayunos, pizzas y recetas caseras.","tip":"No confundas gorgonzola con roquefort: tienen perfiles diferentes. Los refrigerados no son buena compra para viajes largos."},{"grupo":"Café y desayuno","icon":"☕","foto":"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80","productos":"Cafés de distintas regiones, filtros de tela o papel, pão de queijo, biscoito de polvilho y dulces.","historia":"Lee si el café es tradicional, superior, gourmet o especial y si viene en grano o molido. No todos buscan el mismo sabor.","tip":"Para un regalo con identidad de la guía, conoce también el Café Ernestinho y sus variedades."},{"grupo":"Sol, playa y emergencia","icon":"🏖️","foto":"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80","productos":"Protector solar, repelente, agua, snacks, hielo, curitas y artículos de higiene.","historia":"Comprar lejos de la primera línea de playa puede resultar más conveniente y permite revisar tamaños y marcas con calma.","tip":"Lleva una bolsa reutilizable: algunos comercios cobran o limitan las bolsas, y te servirá durante todo el viaje."}],"SUPERMERCADOS_COPACABANA":[["Mundial","Rua Siqueira Campos, 71","Buena referencia para compra grande y precios; suele tener mucho movimiento."],["Zona Sul — Bolívar","Av. Nossa Senhora de Copacabana, 936","Unidad grande en la región de Posto 5; útil para productos preparados y compra completa."],["Zona Sul — Siqueira Campos","Av. Nossa Senhora de Copacabana, 595","Bien ubicado para Postos 3–4 y parte central del barrio."],["Zona Sul — Joaquim Nabuco","Av. Nossa Senhora de Copacabana, 1369","Práctico para Posto 6 y límite con Ipanema."],["Zona Sul — Sá Ferreira","Av. Nossa Senhora de Copacabana, 1200","Otra alternativa útil en la zona de Posto 5/6."],["Zona Sul — Francisco Sá","Rua Francisco Sá, 35","Muy útil para quienes están cerca de Arpoador y Posto 6."],["Zona Sul — Dias da Rocha","Rua Dias da Rocha, 29","Supermercado de barrio bien conectado con la zona central de Copacabana."],["Pão de Açúcar","Av. Nossa Senhora de Copacabana, 493","Unidad central y de fácil acceso para compras rápidas o completas."],["Pão de Açúcar","Av. Nossa Senhora de Copacabana, 1162","Alternativa para Posto 5/6."],["Pão de Açúcar","Rua Siqueira Campos, 97","Muy cerca del eje Siqueira Campos."],["Pão de Açúcar","Rua Ministro Viveiros de Castro, 38","Opción para el lado de Leme/Posto 2."],["Extra Mercado","Rua Siqueira Campos, 143","Supermercado tradicional del eje Siqueira Campos."],["Hortifruti","Rua Siqueira Campos, 74 / otras unidades del barrio","Especialmente útil para frutas, verduras, productos frescos y compra ligera."]],"TIPOS_RODIZIO":[{"nombre":"Churrascaría","icon":"🥩","texto":"Cortes servidos en espadas, buffet y acompañamientos. Ideal para probar carnes brasileñas."},{"nombre":"Pizza","icon":"🍕","texto":"Porciones pequeñas saladas y dulces pasan por la mesa. Pregunta si puedes pedir un sabor."},{"nombre":"Sushi","icon":"🍣","texto":"Secuencia de piezas, temakis y platos calientes; revisa qué productos premium quedan fuera."},{"nombre":"Petiscos o fondue","icon":"🫕","texto":"Formatos variables para compartir. Confirma duración, reposiciones y bebidas incluidas."}],"RODIZIO_PASOS":[{"paso":"1","titulo":"Antes de sentarte","icon":"💳","texto":"Pregunta el precio por persona, si existe promoción por horario y qué está incluido. Bebidas, postres, café y el 10% de servicio normalmente van aparte."},{"paso":"2","titulo":"Conoce la señal","icon":"🟢","texto":"En muchas churrascarías una ficha verde indica “pueden seguir sirviendo” y la roja “quiero una pausa”. Puedes cambiarla cuantas veces necesites."},{"paso":"3","titulo":"No ataques el buffet","icon":"🥗","texto":"Prueba ensaladas y acompañamientos, pero deja espacio. Pan, papas, sushi y masas llenan rápido antes de que lleguen los cortes especiales."},{"paso":"4","titulo":"Elige y pregunta","icon":"🥩","texto":"No debes aceptar todo. Pregunta el nombre del corte, pide el punto de cocción que prefieres y solicita otra porción de lo que realmente te gustó."},{"paso":"5","titulo":"Prueba con estrategia","icon":"🍖","texto":"Comienza con porciones pequeñas. Picanha, fraldinha, maminha, costela y cupim tienen texturas distintas; guarda apetito para comparar."},{"paso":"6","titulo":"Haz una pausa","icon":"🔴","texto":"Gira la ficha a rojo, conversa y decide si quieres repetir. Rodizio no es una competencia y puedes terminar cuando estés satisfecho."},{"paso":"7","titulo":"Revisa la cuenta","icon":"🧾","texto":"Comprueba cantidad de personas, bebidas, postres, couvert y servicio antes de pagar. La propina sugerida debe aparecer claramente."}],"SOL_RIO":[{"nombre":"Pedra do Arpoador","momento":"Atardecer clásico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385260/arpoador_fotos.jpg","detalle":"El sol cae detrás de Dois Irmãos y enciende Ipanema. Llega 45 minutos antes.","mapa":"https://www.google.com/maps/search/?api=1&query=Pedra+do+Arpoador"},{"nombre":"Vista Chinesa","momento":"Final de la tarde","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389092/chinesa.jpg","detalle":"Lagoa, Cristo, playas y montañas desde la Floresta da Tijuca. Organiza el regreso.","mapa":"https://www.google.com/maps/search/?api=1&query=Vista+Chinesa+Rio"},{"nombre":"Parque da Cidade","momento":"Atardecer panorámico","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788349705/MAC1.jpg","detalle":"Desde Niterói se alinean la bahía, el Pan de Azúcar y el Cristo. Regresa antes de quedar aislado.","mapa":"https://www.google.com/maps/search/?api=1&query=Parque+da+Cidade+Niteroi"},{"nombre":"Mureta da Urca","momento":"Hora dorada","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386498/hora_dorada_urca.jpg","detalle":"Una puesta de sol relajada frente a la bahía, perfecta con bebida y petisco.","mapa":"https://www.google.com/maps/search/?api=1&query=Mureta+da+Urca"},{"nombre":"Mirante do Leblon","momento":"Atardecer sin sendero","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386722/mirante_leblon.jpg","detalle":"Una vista fácil de Leblon, Ipanema y Arpoador para combinar con una tarde de playa.","mapa":"https://www.google.com/maps/search/?api=1&query=Mirante+do+Leblon"},{"nombre":"Praia Vermelha","momento":"Amanecer","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788386638/praia_vermelha.jpg","detalle":"Mar, arena y Pan de Azúcar con luz suave. Continúa luego por la Pista Cláudio Coutinho.","mapa":"https://www.google.com/maps/search/?api=1&query=Praia+Vermelha+Rio"},{"nombre":"Enseada de Botafogo","momento":"Amanecer urbano","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389094/botagofoxx.jpg","detalle":"Barcos en primer plano y el Pan de Azúcar recibiendo las primeras luces.","mapa":"https://www.google.com/maps/search/?api=1&query=Enseada+de+Botafogo"},{"nombre":"Aterro do Flamengo","momento":"Amanecer activo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788389092/aterro_flamengo.jpg","detalle":"Palmeras, ciclovía y bahía forman una escena carioca mientras la ciudad despierta.","mapa":"https://www.google.com/maps/search/?api=1&query=Aterro+do+Flamengo"},{"nombre":"Mirante Dona Marta","momento":"Primeras luces","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385469/dona_martas.jpg","detalle":"Una vista elevada del Cristo, Pan de Azúcar y bahía. Ve con transporte y horario organizados.","mapa":"https://www.google.com/maps/search/?api=1&query=Mirante+Dona+Marta"},{"nombre":"Pan de Azúcar","momento":"Atardecer completo","foto":"https://res.cloudinary.com/qa301cbc/image/upload/v1788385605/pan.jpg","detalle":"Sube temprano para ver hora dorada, puesta de sol y las luces de la ciudad.","mapa":"https://www.google.com/maps/search/?api=1&query=Pao+de+Acucar+Rio"}],"ERRORES_MAPS":[{"icon":"🚶","error":"Aceptar el camino más corto","solucion":"Puede incluir escaleras, accesos cerrados, senderos o zonas que no conoces. Compara la ruta con calles principales y transporte."},{"icon":"📍","error":"Marcar el monumento y no la entrada","solucion":"Cristo, Pan de Azúcar, parques, estadios y playas extensas tienen accesos específicos. Busca “entrada”, “bilheteria” o estación correspondiente."},{"icon":"🏪","error":"Elegir la unidad equivocada","solucion":"Restaurantes, hospitales y tiendas pueden tener varias sucursales. Revisa barrio, calle y número antes de pedir el vehículo."},{"icon":"🕐","error":"Creer ciegamente en los horarios","solucion":"Feriados, eventos, mantenimiento y última admisión cambian la operación. Confirma siempre en el canal oficial."},{"icon":"🚌","error":"No mirar el sentido del transporte","solucion":"La estación correcta puede tener accesos en lados opuestos. Comprueba destino final, plataforma y sentido antes de embarcar."},{"icon":"🌧️","error":"Ignorar lluvia, calor y equipaje","solucion":"Una caminata corta puede ser mala decisión con tormenta, sol intenso, niños o maletas. Recalcula según las condiciones reales."},{"icon":"📶","error":"Depender totalmente de la señal","solucion":"Descarga el mapa, guarda la dirección escrita y toma captura del acceso. En senderos y miradores puede fallar internet."},{"icon":"🚘","error":"Pedir el vehículo en cualquier punto","solucion":"Aeropuertos, estadios y eventos usan zonas específicas de embarque. Caminar hasta otro punto puede cancelar o encarecer el viaje."}],"RUTA_PORTUARIA_COMPONENT":[{"n":1,"nombre":"AquaRio","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695730/ernestimho_aquario.png","texto":"Comienza junto al mar en uno de los grandes atractivos familiares de la Zona Portuaria. Sus enormes tanques, túneles y vida marina permiten empezar el día sin prisa antes de continuar caminando por el Boulevard Olímpico.","mapa":"https://www.google.com/maps/search/?api=1&query=AquaRio+Rio+de+Janeiro","sec":"familia","id":"aquario"},{"n":2,"nombre":"Yup Star Rio","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695734/ernestinho_roda_gigante.png","texto":"La rueda gigante se convirtió en una de las imágenes más reconocibles del Porto Maravilha. Si decides subir, tendrás una perspectiva diferente de la zona portuaria y de la Bahía de Guanabara; si no, vale igualmente la parada para verla y fotografiarla.","mapa":"https://www.google.com/maps/search/?api=1&query=Yup+Star+Rio","sec":"familia","id":"yup-star"},{"n":3,"nombre":"Mural Etnias","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695735/ernestinho_mural_etnias.png","texto":"Continúa por el Boulevard Olímpico hasta la monumental obra de Eduardo Kobra. Sus enormes retratos y colores cuentan una historia de diversidad cultural y transformaron este tramo del antiguo puerto en una galería a cielo abierto.","mapa":"https://www.google.com/maps/search/?api=1&query=Mural+Etnias+Eduardo+Kobra+Rio+de+Janeiro","sec":"que_hacer"},{"n":4,"nombre":"Museu do Amanhã","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695731/ernestinho_Museu_do_Amanh%C3%A3_%C3%A0_Beira-Mar.png","texto":"Llegar a Praça Mauá y encontrarse con el Museu do Amanhã es uno de los momentos más bonitos de la ruta. Puedes admirar su arquitectura desde fuera o reservar tiempo para entrar a sus exposiciones sobre ciencia, sociedad, sostenibilidad y futuros posibles.","mapa":"https://www.google.com/maps/search/?api=1&query=Museu+do+Amanha+Rio+de+Janeiro","sec":"museos","id":"amanha"},{"n":5,"nombre":"Mosteiro de São Bento","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695736/ernestinho_sao_bento.png","texto":"Desde la zona portuaria damos el salto hacia la historia colonial. Por fuera es sobrio; por dentro sorprende con uno de los conjuntos barrocos dorados más impresionantes de Río. Entra con calma y recuerda que sigue siendo un espacio religioso.","mapa":"https://www.google.com/maps/search/?api=1&query=Mosteiro+de+Sao+Bento+Rio+de+Janeiro","sec":"iglesias","id":"mosteiro-sao-bento"},{"n":6,"nombre":"Confeitaria Colombo","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695732/ernestinho_cafe_colombo.png","texto":"Ya en pleno Centro, haz una pausa en esta institución carioca fundada en 1894. Sus espejos, vitrales, madera y salón histórico son parte de la experiencia. Puedes entrar para conocerla, tomar un café o darte un gusto antes de la última parada.","mapa":"https://www.google.com/maps/search/?api=1&query=Confeitaria+Colombo+Rua+Goncalves+Dias+Rio+de+Janeiro","sec":"gastronomia","id":"colombo-centro"},{"n":7,"nombre":"Real Gabinete Português de Leitura","img":"https://res.cloudinary.com/qa301cbc/image/upload/v1788695737/ernestinho_real_gabinte.png","texto":"Termina en una de las joyas arquitectónicas del Centro. Sus estanterías ascienden varios pisos y envuelven la sala de lectura en un ambiente único. Cuando entres, no mires solamente los libros: levanta la vista y observa todos los detalles.","mapa":"https://www.google.com/maps/search/?api=1&query=Real+Gabinete+Portugues+de+Leitura+Rio+de+Janeiro","sec":"espacios_literarios","id":"real-gabinete"}]};const x=DATA.CONSEJOS_NUEVOS[0];const d=document.querySelector('#advice-detail');document.querySelector('.ec-consejos-head').hidden=true;document.querySelector('.ec-consejos-body').hidden=true;d.hidden=false;d.innerHTML=special(x)}
function generic(x){const hero=HERO[x.id]||VIS[x.id]?.hero||('https://res.cloudinary.com/tdez3h4t/image/upload/v1789964031/PORTADAS_CONSEJO_'+PORTADAS[x.id]+'.png');return '<section class="ec-detail"><article><button class="ec-back" onclick="location.hash=\'\'">'+esc(T('← Volver a Consejos'))+'</button><div class="ec-hero"><img src="'+hero+'" alt="'+esc(T(x.titulo))+'"></div><span class="ec-icon">'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1><p class="ec-intro">'+esc(T(x.intro))+'</p><div class="ec-tips">'+x.tips.map((z,i)=>'<div class="ec-tip"><span class="ec-num">'+(i+1)+'</span><span>'+esc(T(z))+'</span></div>').join('')+'</div></article></section>'}
function supermercado(x){return '<section class="ec-orange"><article><button class="ec-back" onclick="location.hash=\'\'">← Volver a Consejos</button><div class="ec-special-hero"><img src="'+(VIS.supermercado?.hero||HERO.supermercado)+'" style="width:100%;height:100%;object-fit:cover"><div class="ec-special-overlay"></div><div class="ec-special-title"><span>'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1></div></div><p class="ec-intro">'+esc(T(x.intro))+'</p><div class="ec-challenge"><h2>El desafío de Ernestinho 🛒</h2><p>Entra sin prisa y elige una fruta que nunca probaste, una bebida brasileña, un dulce para regalar y un producto para preparar en el alojamiento. El supermercado también cuenta la historia de un país.</p></div><div class="ec-special-grid">'+SPECIAL.SUPERMERCADO_BRASIL.map(z=>'<div class="ec-orange-card"><img src="'+z.foto+'"><div class="copy"><span style="font-size:36px">'+z.icon+'</span><h2>'+esc(T(z.grupo))+'</h2><p><b>Busca: '+esc(T(z.productos))+'</b></p><p>'+esc(T(z.historia))+'</p><div class="ec-special-tip"><b>⭐ Consejo de Ernestinho:</b> '+esc(T(z.tip))+'</div></div></div>').join('')+'</div><div class="ec-special-card" style="margin-top:32px"><h2>Lista divertida para tu primera visita</h2><div class="ec-special-grid four">'+['Una fruta desconocida','Guaraná o mate','Paçoca o goiabada','Farofa o tapioca','Queijo minas','Café brasileño','Un producto de playa','Un regalo comestible'].map(z=>'<div style="background:#f8fafc;border-radius:12px;padding:16px;font-size:14px;font-weight:700">☐ '+z+'</div>').join('')+'</div></div></article></section>'}
function rodizio(x){return '<section class="ec-orange"><article><button class="ec-back" onclick="location.hash=\'\'">← Volver a Consejos</button><div class="ec-special-hero"><img src="'+(VIS.rodizio?.hero||HERO.rodizio)+'" style="width:100%;height:100%;object-fit:cover"><div class="ec-special-overlay"></div><div class="ec-special-title"><span>'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1></div></div><p class="ec-intro">'+esc(T(x.intro))+'</p><div class="ec-special-grid four">'+SPECIAL.TIPOS_RODIZIO.map(z=>'<div class="ec-special-card"><span>'+z.icon+'</span><h2>'+esc(T(z.nombre))+'</h2><p>'+esc(T(z.texto))+'</p></div>').join('')+'</div><h2 style="font-size:30px;margin-top:48px">Tu primera experiencia, paso a paso</h2><div class="ec-special-grid">'+SPECIAL.RODIZIO_PASOS.map(z=>'<div class="ec-special-card" style="display:flex;gap:20px"><span class="ec-num" style="background:#f97316;color:white;width:48px;height:48px;flex-basis:48px">'+z.paso+'</span><div><span style="font-size:30px">'+z.icon+'</span><h2>'+esc(T(z.titulo))+'</h2><p>'+esc(T(z.texto))+'</p></div></div>').join('')+'</div><div class="ec-dark-tip"><h2>⭐ El consejo que yo daría a un amigo</h2><p>No llegues muerto de hambre ni intentes recuperar el precio comiendo hasta sentirte mal. Prueba porciones pequeñas, descubre cortes nuevos, pausa cuando quieras y guarda espacio para repetir solamente tus favoritos. La gracia está en la experiencia, no en contar cuántos platos comiste.</p></div></article></section>'}

function portuario(x){const p=SPECIAL.RUTA_PORTUARIA_COMPONENT;const ruta='https://www.google.com/maps/dir/?api=1&origin=AquaRio,+Rio+de+Janeiro&destination=Real+Gabinete+Portugues+de+Leitura,+Rio+de+Janeiro&waypoints=Yup+Star+Rio%7CMural+Etnias+Rio+de+Janeiro%7CMuseu+do+Amanha+Rio+de+Janeiro%7CMosteiro+de+Sao+Bento+Rio+de+Janeiro%7CConfeitaria+Colombo+Rio+de+Janeiro&travelmode=walking';return '<section class="ec-portuario"><div class="ec-port-hero"><img src="https://res.cloudinary.com/qa301cbc/image/upload/v1788695735/ernestinho_portada_para_rutas.png"><div class="shade"></div><div class="ec-port-title"><button onclick="location.hash=\'\'">← VOLVER A CONSEJOS</button><span>Recorridos para hacer por tu cuenta</span><h1>Del mar a la historia: Zona Portuaria + Centro</h1><p>Una ruta que preparé especialmente para ti para descubrir Río caminando, a tu ritmo.</p></div></div><div class="ec-port-wrap"><div class="ec-port-stats"><div class="ec-port-stat"><b>🚶</b>A pie</div><div class="ec-port-stat"><b>☀️</b>Mejor de mañana</div><div class="ec-port-stat"><b>📍</b>7 paradas</div></div><article class="ec-port-intro"><h2>Un Río que puedes descubrir por tu cuenta</h2><p>Preparé especialmente para ti uno de mis recorridos favoritos para descubrir una parte de Río que muchas veces el turista conoce demasiado rápido. Vamos desde la Zona Portuaria hasta el corazón del Centro combinando atracciones, historia, arquitectura, arte y una pausa bien carioca.</p><p>La Zona Portuaria cambió muchísimo y hoy invita a caminar por el Boulevard Olímpico y Praça Mauá. Mi recomendación es <b>comenzar por la mañana</b>: tendrás más tiempo para entrar a los lugares que te interesen y llegar con calma al Centro. Si entras a todas las atracciones, piensa en una jornada completa; si haces principalmente el paseo exterior, puedes adaptarlo a medio día.</p></article><article class="ec-carnaval-extra"><img src="https://res.cloudinary.com/qa301cbc/image/upload/v1788696194/carnaval_experiences_ernestinho.png"><div><b>🎭 Parada extra 0</b><h2>Empieza con Carnaval Experience</h2><p>¿Quieres turbinar el recorrido? Antes de AquaRio puedes comenzar en Carnaval Experience, dentro de Cidade do Samba y muy cerca del inicio de nuestra ruta. Conocerás los bastidores del Carnaval carioca y después continúas caminando hacia AquaRio.</p><div class="ec-special-tip"><b>Socio oficial · 5% de descuento</b><p>Reserva con Ernestinho. El descuento se aplica automáticamente, sin código.</p></div><a href="https://ingressos.carnavalexperience.com.br?ac=UUV6C5E3SX" target="_blank">Comprar con 5% de descuento ↗</a></div></article><div class="ec-port-stops">'+p.map(z=>'<article class="ec-port-stop"><img src="'+z.img+'" alt="'+esc(z.nombre)+'"><div class="copy"><span class="n">'+z.n+'</span><h2>'+esc(T(z.nombre))+'</h2><p>'+esc(T(z.texto))+'</p><a target="_blank" href="'+z.mapa+'">Cómo llegar ↗</a></div></article>').join('')+'</div><article class="ec-map-block"><h2>Sigue el recorrido en Google Maps</h2><p>Las siete paradas ya están ordenadas para caminar desde AquaRio hasta el Real Gabinete.</p><a href="'+ruta+'" target="_blank">Abrir ruta completa ↗</a><iframe title="Mapa del recorrido Zona Portuaria y Centro" src="https://www.google.com/maps?q=AquaRio,+Yup+Star,+Museu+do+Amanhã,+Mosteiro+de+São+Bento,+Confeitaria+Colombo,+Real+Gabinete+Português+de+Leitura,+Rio+de+Janeiro&output=embed" loading="lazy"></iframe></article><div class="ec-final-tip"><h3>💛 Consejo final de Ernestinho</h3><p>Haz este recorrido con calma. No necesitas entrar a todo el mismo día: elige lo que más te interese, saca fotos, haz una pausa y disfruta el camino. Río también se descubre caminando.</p></div></div></section>'}

function seguro(x){const steps=[['1. Ten tus datos a mano','Prepara el número de póliza o voucher, documento de identidad o pasaporte y los datos de tu viaje.'],['2. Solicita asistencia','Utiliza la App Assist Card o los canales oficiales. En Brasil, Assist Card publica el teléfono 0800 770 1664; si estás fuera del país, revisa en tu voucher el canal correspondiente a tu ubicación.'],['3. Sigue las indicaciones','La central puede orientarte y señalar la red disponible según el caso y el plan contratado. Ante una emergencia grave, busca atención inmediata y comunica el caso a la aseguradora tan pronto como sea posible.'],['4. Guarda documentos y comprobantes','Si recibes atención por tu cuenta o necesitas solicitar un reembolso, conserva informe médico, recetas, facturas, comprobantes y cualquier otra documentación solicitada.']];return '<section class="ec-detail"><article><button class="ec-back" onclick="location.hash=\'\'">← Volver a Consejos</button><div class="ec-hero"><img src="https://res.cloudinary.com/tdez3h4t/image/upload/v1789964031/PORTADAS_CONSEJO_8.png"></div><span class="ec-icon">'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1><p class="ec-intro">'+esc(T(x.intro))+'</p><div class="ec-tips">'+x.tips.map((z,i)=>'<div class="ec-tip"><span class="ec-num">'+(i+1)+'</span>'+esc(T(z))+'</div>').join('')+'</div><div style="margin-top:32px;background:linear-gradient(135deg,#450a0a,#991b1b,#b91c1c);color:#fff;border-radius:32px;overflow:hidden"><img src="https://res.cloudinary.com/qa301cbc/image/upload/v1789825116/assist_card.png" style="width:100%;display:block"><div style="padding:28px"><b>🛡️ Assist Card · Seguro de viaje</b><h2>Cómo activar tu seguro de viaje si necesitas ayuda</h2><p>En una emergencia, lo más importante es saber dónde pedir asistencia. Assist Card informa atención las 24 horas y permite solicitar ayuda mediante su aplicación y sus canales oficiales. Las coberturas, límites, exclusiones y reembolsos dependen del plan contratado.</p><h3>Paso a paso</h3><div class="ec-cards2">'+steps.map((z,i)=>'<div style="background:rgba(255,255,255,.09);padding:20px;border-radius:18px"><b>'+esc(T(z[0]))+'</b><p>'+esc(T(z[1]))+'</p></div>').join('')+'</div><div style="margin-top:20px"><h3>Qué revisar en tu cobertura</h3><p>Gastos médicos y hospitalarios, odontología de urgencia, medicamentos, traslado médico, equipaje, interrupción del viaje y asistencia jurídica pueden estar disponibles según el producto contratado. No des por hecho que todos los ítems están incluidos en tu plan.</p><p><b>⭐ Consejo de Ernestinho:</b> Antes de viajar, guarda la póliza en el celular y también sin conexión. Revisa límites, franquicias, exclusiones, enfermedades preexistentes y reglas para deportes o actividades de aventura.</p></div></div></div></article></section>'}
function cinco(x){const hero=HERO[x.id],cards=x.id==='trampas'?EXTRA.TRAMPAS_TURISTA:x.id==='souvenirs'?PORT.SOUVENIRS_RIO:x.id==='perfiles'?EXTRA.PERFILES_RIO:x.id==='maps'?SPECIAL.ERRORES_MAPS:null;let body='';if(x.id==='trampas')body='<div class="ec-special-tip"><b>Viajar atento no significa viajar con miedo.</b><p>La idea es reconocer una situación, detenerla antes de pagar y saber qué guardar si necesitas reclamar.</p></div><div class="ec-special-grid">'+cards.map(z=>'<article class="ec-special-card"><span>'+z.icon+'</span><h2>'+esc(T(z.titulo))+'</h2><p><b>Ejemplo:</b> '+esc(T(z.caso))+'</p><p><b>Qué hacer:</b> '+esc(T(z.accion))+'</p><div class="ec-special-tip"><b>⭐ Ernestinho:</b> '+esc(T(z.ernestinho))+'</div></article>').join('')+'</div><div style="background:#b91c1c;color:white;border-radius:24px;padding:28px;margin-top:32px"><h2>¿Necesitas ayuda?</h2><p>Emergencia policial: 190. Guarda capturas y comprobantes. La DEAT y el BPTur atienden situaciones relacionadas con turistas; confirma sus canales oficiales antes de desplazarte.</p></div>';if(x.id==='souvenirs')body='<div class="ec-special-grid four">'+cards.map(z=>'<article class="ec-special-card"><span>'+z.icon+'</span><h2>'+esc(T(z.titulo))+'</h2><p>'+esc(T(z.texto))+'</p><p><b>📍 '+esc(T(z.donde))+'</b></p></article>').join('')+'</div><div class="ec-special-grid"><div class="ec-special-card" style="background:#db2777;color:white"><h2>Feria nocturna de Copacabana</h2><p style="color:white">Recórrela como paseo, compara antes de comprar y lleva una referencia del tamaño disponible en tu maleta.</p></div><div class="ec-special-card" style="background:#fcd34d"><h2>⭐ Regalo de Ernestinho</h2><p>Elige algo que puedas contar cuando lo entregues. El Café Ernestinho conecta el sabor brasileño con la historia de tu viaje y no ocupa media maleta.</p></div></div>';if(x.id==='perguntas-50')body='<div class="ec-special-grid">'+PORT.FAQ_DESTACADAS.map((z,i)=>'<article class="ec-special-card"><b>Pregunta '+(i+1)+' destacada</b><h2>'+esc(T(z.q))+'</h2><p>'+esc(T(z.a))+'</p></article>').join('')+'</div><h2 style="font-size:30px;margin-top:48px">Las 50 respuestas rápidas</h2><div class="ec-special-grid">'+x.tips.map(z=>'<div class="ec-special-card"><p>'+esc(T(z))+'</p></div>').join('')+'</div>';if(x.id==='perfiles')body='<div class="ec-special-grid">'+cards.map(z=>'<article class="ec-special-card" style="padding:0;overflow:hidden"><img src="'+z.foto+'" style="width:100%;height:208px;object-fit:cover"><div style="padding:24px"><span>'+z.icon+'</span><h2>'+esc(T(z.titulo))+'</h2><p><b>Plan recomendado:</b> '+esc(T(z.plan))+'</p><p><b>Revisa:</b> '+esc(T(z.claves))+'</p><div class="ec-special-tip"><b>⭐ Ernestinho:</b> '+esc(T(z.tip))+'</div></div></article>').join('')+'</div>';if(x.id==='maps')body='<div class="ec-special-grid">'+cards.map(z=>'<article class="ec-special-card"><span>'+z.icon+'</span><h2>Error: '+esc(T(z.error||z.titulo))+'</h2><p><b>Haz esto:</b> '+esc(T(z.solucion||z.texto||''))+'</p></article>').join('')+'</div><div style="background:#1d4ed8;color:white;border-radius:24px;padding:28px;margin-top:32px"><h2>⭐ Regla de Ernestinho</h2><p>Google Maps propone una ruta; tú decides si es lógica. Antes de salir revisa acceso, horario, sentido, clima y regreso.</p></div>';return '<section class="ec-special"><article><button class="ec-back" onclick="location.hash=\'\'">← Volver a Consejos</button><div class="ec-special-hero"><img src="'+hero+'"><div class="ec-special-overlay"></div><div class="ec-special-title"><span>'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1></div></div><p class="ec-intro">'+esc(T(x.intro))+'</p>'+body+'</article></section>'}

 if(x.id==='semana'){return '<section class="ec-detail"><article><button class="ec-back" onclick="location.hash=\'\'">← Volver a Consejos</button><div class="ec-hero"><img src="'+HERO.semana+'"></div><span class="ec-icon">'+x.icon+'</span><h1>'+esc(T(x.titulo))+'</h1><p class="ec-intro">'+esc(T(x.intro))+'</p><div class="ec-cards2">'+LAZY.SEMANA_RIO.map(z=>'<div class="ec-route"><img src="'+z.foto+'"><div><b>'+esc(T(z.tema))+'</b><h2>'+esc(T(z.dia))+'</h2><p>☀️ <b>Mañana:</b> '+esc(T(z.manana))+'</p><p>🌤️ <b>Tarde:</b> '+esc(T(z.tarde))+'</p><p>🌙 <b>Noche:</b> '+esc(T(z.noche))+'</p><p><b>Plan alternativo:</b> '+esc(T(z.alternativa))+'</p><a target="_blank" href="'+z.mapa+'">Abrir ruta del día ↗</a></div></div>').join('')+'</div></article></section>'}
