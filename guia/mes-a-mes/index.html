urada que enero/febrero, aunque fines de semana siguen activos.", "eventos": "El Carnaval puede caer parcialmente en marzo algunos años; confirma siempre las fechas exactas.", "precios": "Fuera de Carnaval puede ser más fácil encontrar alojamiento que en pleno verano alto.", "maleta": "Ropa de verano, protección solar y algo impermeable liviano.", "ideal": "Una mezcla equilibrada de playa, Centro, museos, barrios y excursiones.", "ojo": "No des por terminado el período de tormentas de verano.", "ernestinho": "Me gusta porque todavía tienes Río de verano, pero puedes empezar a respirar un poco más."}, {"mes": "ABRIL", "icon": "🌤️", "titulo": "Transición · caminar vuelve a ser un placer", "clima": "Temperaturas normalmente más amables y menor sensación de verano extremo, aunque Río puede sorprender con días muy cálidos.", "mar": "Todavía puedes tener excelentes días de playa. Lleva una alternativa porque el otoño trae variación.", "movimiento": "En general menos presión turística que verano y Carnaval, salvo feriados prolongados.", "eventos": "Semana Santa y feriados móviles pueden alterar operación, tránsito y ocupación.", "precios": "Suele permitir más flexibilidad que enero/febrero, excepto puentes y feriados.", "maleta": "Verano ligero + una capa fina para noche, lluvia o aire acondicionado.", "ideal": "Barrios a pie, Centro, Urca, Jardim Botânico, miradores y playa sin construir todo alrededor del calor.", "ojo": "Revisa feriados: un Centro de Río en día hábil y en feriado son experiencias muy diferentes.", "ernestinho": "Es uno de esos meses en que puedes hacer un Río mucho más caminable sin renunciar necesariamente a la playa."}, {"mes": "MAYO", "icon": "🚶", "titulo": "Otoño carioca · excelente para explorar", "clima": "Días frecuentemente agradables y noches más frescas. Menos desgaste por calor para recorrer la ciudad.", "mar": "La playa sigue siendo posible en días soleados, pero ya no asumiría que todos los días serán de playa.", "movimiento": "Buena época  os feriados: o Centro do Rio em dia útil e em feriado são experiências muito diferentes.", "ernestinho": "É um daqueles meses em que dá para fazer um Rio muito mais caminhável sem necessariamente abrir mão da praia."}, {"mes": "MAIO", "icon": "🚶", "titulo": "Outono carioca · excelente para explorar", "clima": "Dias frequentemente agradáveis e noites mais frescas. Menos desgaste pelo calor para conhecer a cidade.", "mar": "A praia continua possível em dias de sol, mas eu já não presumiria que todos os dias serão de praia.", "movimiento": "Boa época para quem quer conhecer bairros, cultura e natureza com menos sensação de alta temporada.", "eventos": "A agenda cultural continua ativa; confira exposições, shows, futebol e eventos do mês.", "precios": "Normalmente mais amigável do que o verão e grandes datas, dependendo dos eventos.", "maleta": "Camisetas, roupas leves e uma jaqueta fina para a noite ou frente fria.", "ideal": "Trilhas, Centro Histórico, Santa Teresa, parques, gastronomia, museus e fotografia.", "ojo": "Uma frente fria pode mudar rapidamente a sensação térmica.", "ernestinho": "Para conhecer bastante o Rio caminhando, maio me parece especialmente confortável."}, {"mes": "JUNHO", "icon": "🎭", "titulo": "Inverno carioca · cultura, gastronomia e noites frescas", "clima": "Inverno suave para os padrões do sul do continente, mas noites e frentes frias podem surpreender quem traz apenas roupa de praia.", "mar": "Há dias lindos de praia, mas a água e o vento podem parecer mais frios.", "movimiento": "Menos turismo de verão; boa época para circuitos urbanos e culturais.", "eventos": "Festas Juninas, agenda cultural e futebol podem trazer planos diferentes do clássico sol e praia.", "precios": "Pode oferecer uma boa relação de demanda fora de datas/eventos específicos.", "maleta": "Jaqueta ou moletom leve, calça comprida opcional e roupas em camadas.", "ideal": "Museus, gastronomia, Centro, caminhadas, futebol, samba e dias panorâmicos de céu limpo.", "ojo": "Não confunda “inverno do Rio” com calor garantido 24 horas por dia.", "ernestinho": "Traga uma camada de roupa. Parece detalhe até chegar uma frente fria e todo mundo acabar comprando um casaco."}, {"mes": "JULHO", "icon": "👨‍👩‍👧‍👦", "titulo": "Inverno + férias escolares", "clima": "Temperaturas geralmente confortáveis para caminhar; podem ocorrer manhãs/noites frescas e períodos mais secos.", "mar": "Praia em dias de sol, especialmente perto do meio-dia, mas não é mês para prometer mar todos os dias.", "movimiento": "As férias escolares brasileiras aumentam a presença de famílias e o movimento em atrações infantis e destinos próximos.", "eventos": "Programação familiar, museus, férias e futebol ganham importância.", "precios": "Hospedagem e voos podem subir por causa das férias, mesmo sem ser verão.", "maleta": "Camadas leves, algum agasalho, tênis confortável e roupa de banho mesmo assim.", "ideal": "Famílias, museus, AquaRio, BioParque, cultura, parques e passeios.", "ojo": "Reserve atrações familiares populares quando coincidir com férias e fim de semana.", "ernestinho": "Com crianças, julho funciona muito bem se você não montar a viagem pensando que o Rio é só praia."}, {"mes": "AGOSTO", "icon": "🥾", "titulo": "Mais seco, bom para caminhar e com mudanças de temperatura", "clima": "Costuma favorecer atividades a pé, embora possa alternar calor, vento e entradas de ar fresco.", "mar": "O mar pode ficar mais agitado em alguns dias; observe bandeiras e condições reais.", "movimiento": "Geralmente tranquilo em comparação com o verão e as férias de julho.", "eventos": "Boa época para conferir agenda cultural, futebol e experiências ao ar livre.", "precios": "Frequentemente permite planejar com mais flexibilidade do que a alta temporada.", "maleta": "Roupas leves, uma camada de agasalho e bom calçado para caminhar ou fazer trilhas.", "ideal": "Trilhas, Floresta da Tijuca, mirantes, bairros e fotografia.", "ojo": "Para trilha, não basta “não está chovendo”: confira estado do caminho, vento e visibilidade.", "ernestinho": "Se você quer caminhar pelo Rio e fazer natureza, agosto pode entregar dias espetaculares."}, {"mes": "SETEMBRO", "icon": "🎤", "titulo": "Primavera · eventos e volta do calor", "clima": "A temperatura começa a subir e a cidade entra gradualmente em um clima mais primaveril, com variações.", "mar": "A praia volta a ganhar força nos dias quentes.", "movimiento": "Grandes eventos podem transformar Barra, transporte, hospedagem e preços mesmo quando o restante da cidade parece normal.", "eventos": "Rock in Rio quando ocorre naquele ano e outros grandes eventos exigem atenção às datas, local e logística.", "precios": "Perto de megaeventos podem ocorrer aumentos muito localizados, especialmente na Barra e arredores.", "maleta": "Roupas leves + uma camada para mudanças de tempo; protetor solar volta a ser indispensável.", "ideal": "Eventos, praia, parques, bairros e combinação de cultura com natureza.", "ojo": "Não reserve hospedagem apenas pela distância em quilômetros de um evento: estude transporte e saída noturna.", "ernestinho": "Em setembro, primeiro olho o calendário de eventos; ele pode mudar completamente onde vale a pena ficar e como se deslocar."}, {"mes": "OUTUBRO", "icon": "🌺", "titulo": "Primavera quente · o Rio volta para a rua", "clima": "Mais calor e dias que convidam a combinar natureza e praia; aumenta a possibilidade de mudanças rápidas no tempo.", "mar": "Bom momento para voltar a dar mais protagonismo à praia.", "movimiento": "Ainda longe do pico do Réveillon, embora fins de semana ensolarados encham a orla.", "eventos": "A agenda cultural, esportiva e musical pode ser intensa; confira o calendário da sua semana.", "precios": "Normalmente mais flexível do que dezembro/janeiro, salvo eventos específicos.", "maleta": "Roupas frescas, protetor, água e uma proteção leve contra chuva.", "ideal": "Jardim Botânico, Parque Lage, Lagoa, Urca, praia e pôr do sol.", "ojo": "O calor volta: não programe tudo a pé nas horas centrais do dia.", "ernestinho": "Outubro já começa a ter a cara do Rio que muita gente imagina, mas sem o caos do fim do ano."}, {"mes": "NOVEMBRO", "icon": "⛅", "titulo": "Pré-verão · calor e tempestades à tarde", "clima": "O calor e a umidade aumentam. Tempestades no fim da tarde podem aparecer rapidamente.", "mar": "Ir à praia cedo costuma ser melhor do que deixá-la para depois de uma tarde instável.", "movimiento": "A cidade começa a se preparar para o verão e o fim do ano.", "eventos": "Feriados de novembro podem gerar fins de semana prolongados, mudanças de operação e maior demanda.", "precios": "Em algumas datas, começam a se aproximar as condições de alta temporada.", "maleta": "Roupas muito leves, protetor, hidratação e capa impermeável compacta.", "ideal": "Atividades externas pela manhã, praia, passeios com clima confirmado e cultura como plano B.", "ojo": "Veja radar/alertas antes de trilhas e não ignore tempestades elétricas.", "ernestinho": "Em novembro, eu antecipo tudo o que depende do céu e deixo a tarde com margem para mudar."}, {"mes": "DEZEMBRO", "icon": "🎆", "titulo": "Verão + Natal + Réveillon", "clima": "Calor, umidade e chuvas de verão. Dias longos, orla cheia e uma cidade que muda de ritmo.", "mar": "A praia é protagonista, mas em dias muito movimentados cuide bem dos pertences e combine preços antes de consumir.", "movimiento": "A segunda metade do mês pode ter demanda extrema. Copacabana muda completamente ao redor do Réveillon.", "eventos": "Natal, shows, festas e especialmente o Réveillon de Copacabana. Operação, acessos e transporte exigem planejamento específico.", "precios": "Uma das épocas mais caras e disputadas para hospedagem, principalmente perto de Copacabana e do Ano-Novo.", "maleta": "Verão total, protetor, roupas frescas, calçado confortável e bagagem prática para multidões.", "ideal": "Viver o verão carioca e, se esse for seu objetivo, um dos Réveillons mais famosos do mundo.", "ojo": "Para o dia 31, não improvise hospedagem, retorno nem ponto de encontro. As regras de acesso podem mudar a cada edição.", "ernestinho": "Se você vem para o Réveillon, reserve antes. Nessa semana, Copacabana não funciona como em uma semana normal de dezembro."}], "en": [{"mes": "JANUARY", "icon": "☀️", "titulo": "Peak summer · holidays · high season", "clima": "High heat and humidity. Afternoon summer showers or thunderstorms are common; a clear morning does not guarantee a dry afternoon.", "mar": "The beach takes center stage, but check surf, flags and water quality. Arrive early for more space and less heat.", "movimiento": "Brazilian holidays + summer mean heavy demand at beaches, Christ the Redeemer, Sugarloaf, tours and accommodation.", "eventos": "The first days can still be busy after New Year's Eve. Rehearsals, samba circles and the pre-Carnival atmosphere begin according to the calendar.", "precios": "High season: flights and accommodation often require more advance booking, especially on weekends.", "maleta": "Very light clothing, swimwear, sunscreen, a cap, water bottle and a thin layer for rain/air conditioning.", "ideal": "Early beach time, panoramic outings with good visibility, water activities and outdoor evenings.", "ojo": "Avoid concentrating long walks between 11 a.m. and 3 p.m. Always keep an indoor Plan B.", "ernestinho": "I would head out early, rest during the hottest hours and return outside toward late afternoon."}, {"mes": "FEBRUARY", "icon": "🥁", "titulo": "Summer + Carnival atmosphere", "clima": "Strong heat and humidity continue, with the possibility of intense summer rain. Midday sun can feel very heavy.", "mar": "Excellent beach season when sea conditions cooperate. Check conditions before sports or boat trips.", "movimiento": "It can be one of the city's most intense months if Carnival falls in February: blocos, rehearsals, parties and traffic changes.", "eventos": "Carnival changes dates every year. The Sambadrome, blocos, technical rehearsals and pre-Carnival events require their own calendar.", "precios": "During Carnival, demand for accommodation, transportation and tickets can surge.", "maleta": "Fresh clothing, comfortable shoes that can get wet, sunscreen, water bottle, rain layer and few valuables for blocos.", "ideal": "Carnival, samba, beach, cultural experiences and seeing the city at its most festive.", "ojo": "Do not plan transportation as if it were a normal week during major blocos and parades.", "ernestinho": "If you are coming for Carnival, build the trip around Carnival instead of trying to place a normal sightseeing itinerary on top of it."}, {"mes": "MARCH", "icon": "🌴", "titulo": "End of summer · still unmistakably Rio", "clima": "It remains warm and humid with possible rain, but peak-summer pressure gradually starts to ease.", "mar": "The beach is still very appealing. Alternate beach and culture so you have flexibility if the weather changes.", "movimiento": "After Carnival, the city generally feels less saturated than in January/February, although weekends remain active.", "eventos": "Carnival can partly fall in March in some years; always confirm the exact dates.", "precios": "Outside Carnival, accommodation can be easier to find than at the height of summer.", "maleta": "Summer clothing, sun protection and something light and waterproof.", "ideal": "A balanced mix of beach, Downtown, museums, neighborhoods and excursions.", "ojo": "Do not assume the summer-storm period is already over.", "ernestinho": "I like March because you still get summer Rio, but the city can start to breathe a little more."}, {"mes": "APRIL", "icon": "🌤️", "titulo": "Transition season · walking becomes a pleasure again", "clima": "Temperatures are usually milder with less extreme-summer feeling, although Rio can still surprise you with very hot days.", "mar": "You can still get excellent beach days. Keep an alternative because autumn brings more variation.", "movimiento": "Generally less tourist pressure than summer and Carnival, except around long holiday weekends.", "eventos": "Easter and movable holidays can affect operations, traffic and occupancy.", "precios": "Usually more flexible than January/February, except around holidays.", "maleta": "Light summer clothing plus a thin layer for evenings, rain or air conditioning.", "ideal": "Walking neighborhoods, Downtown, Urca, Jardim Botânico, viewpoints and beach without planning everything around the heat.", "ojo": "Check holidays: Downtown Rio on a weekday and on a public holiday can feel completely different.", "ernestinho": "This is one of those months when Rio becomes much more walkable without necessarily giving up the beach."}, {"mes": "MAY", "icon": "🚶", "titulo": "Rio autumn · excellent for exploring", "clima": "Days are often pleasant and evenings cooler, making it less tiring to explore the city.", "mar": "Beach days are still possible when sunny, but I would no longer assume every day will be a beach day.", "movimiento": "A good period for exploring neighborhoods, culture and nature without the same high-season feeling.", "eventos": "The cultural calendar remains active; check exhibitions, concerts, football and events for the month.", "precios": "Usually friendlier than summer and major dates, depending on events.", "maleta": "T-shirts, light clothing and a thin jacket for evenings or a cold front.", "ideal": "Hiking, Historic Downtown, Santa Teresa, parks, food, museums and photography.", "ojo": "A cold front can change the perceived temperature quickly.", "ernestinho": "For seeing a lot of Rio on foot, I find May especially comfortable."}, {"mes": "JUNE", "icon": "🎭", "titulo": "Rio winter · culture, food and cooler evenings", "clima": "A mild winter by southern South American standards, but evenings and cold fronts can surprise travelers who packed only beachwear.", "mar": "There can be beautiful beach days, although the water and wind may feel cooler.", "movimiento": "Less summer tourism; a good time for urban and cultural circuits.", "eventos": "Festas Juninas, the cultural calendar and football can add plans beyond the classic sun-and-beach trip.", "precios": "It can offer a good demand balance outside specific dates and events.", "maleta": "A light jacket or sweatshirt, optional long trousers and layered clothing.", "ideal": "Museums, food, Downtown, walks, football, samba and clear panoramic days.", "ojo": "Do not confuse “Rio winter” with guaranteed warmth 24 hours a day.", "ernestinho": "Bring a layer. It sounds trivial until a cold front arrives and everyone ends up buying a jacket."}, {"mes": "JULY", "icon": "👨‍👩‍👧‍👦", "titulo": "Winter + school holidays", "clima": "Temperatures are generally comfortable for walking, with cooler mornings/evenings and potentially drier stretches.", "mar": "Beach on sunny days, especially around midday, but this is not a month to promise beach weather every day.", "movimiento": "Brazilian school holidays bring more families and greater activity at children's attractions and nearby destinations.", "eventos": "Family programming, museums, holidays and football become more important.", "precios": "Accommodation and flights can rise during school holidays even though it is not summer.", "maleta": "Light layers, something warm, comfortable sneakers and swimwear anyway.", "ideal": "Families, museums, AquaRio, BioParque, culture, parks and excursions.", "ojo": "Book popular family attractions when school holidays coincide with a weekend.", "ernestinho": "July works very well with children if you do not build the trip around the idea that Rio is only about beaches."}, {"mes": "AUGUST", "icon": "🥾", "titulo": "Drier, walkable and changeable temperatures", "clima": "Often favorable for activities on foot, although warm days, wind and cooler air can alternate.", "mar": "The sea can be rougher on some days; check flags and actual conditions.", "movimiento": "Generally quiet compared with summer and the July holidays.", "eventos": "A good time to check the cultural calendar, football and outdoor experiences.", "precios": "Often offers more planning flexibility than high season.", "maleta": "Light clothing, a warm layer and good footwear for walking or hiking.", "ideal": "Trails, Tijuca Forest, viewpoints, neighborhoods and photography.", "ojo": "For hiking, “it isn't raining” is not enough: check trail condition, wind and visibility.", "ernestinho": "If you want to walk around Rio and spend time in nature, August can deliver spectacular days."}, {"mes": "SEPTEMBER", "icon": "🎤", "titulo": "Spring · events and warmer weather return", "clima": "Temperatures begin to rise and the city gradually shifts toward a spring feel, with variation.", "mar": "The beach becomes more attractive again on warmer days.", "movimiento": "Major events can transform Barra, transportation, accommodation and prices even if the rest of the city seems normal.", "eventos": "Rock in Rio when it is held that year, plus other major events, requires checking dates, venue and logistics.", "precios": "Megaevents can cause very localized price increases, especially in Barra and nearby areas.", "maleta": "Light clothing plus a layer for weather changes; sunscreen becomes essential again.", "ideal": "Events, beach, parks, neighborhoods and a mix of culture and nature.", "ojo": "Do not choose accommodation only by its distance in kilometers from an event: study transportation and the late-night journey home.", "ernestinho": "In September I check the event calendar first; it can completely change where it makes sense to stay and how to get around."}, {"mes": "OCTOBER", "icon": "🌺", "titulo": "Warm spring · Rio heads outdoors again", "clima": "Warmer weather and days that invite a mix of nature and beach; quick weather changes become more possible.", "mar": "A good time to make the beach a bigger part of the itinerary again.", "movimiento": "Still well before the New Year's Eve peak, although sunny weekends fill the beachfront.", "eventos": "The cultural, sports and music calendar can be busy; check what is happening during your week.", "precios": "Usually more flexible than December/January except around specific events.", "maleta": "Fresh clothing, sunscreen, water and light rain protection.", "ideal": "Jardim Botânico, Parque Lage, Lagoa, Urca, beach and sunsets.", "ojo": "The heat is returning: do not schedule everything on foot during the middle of the day.", "ernestinho": "October begins to feel like the Rio many people picture, but without the end-of-year chaos."}, {"mes": "NOVEMBER", "icon": "⛅", "titulo": "Pre-summer · heat and afternoon storms", "clima": "Heat and humidity increase. Late-afternoon thunderstorms can develop quickly.", "mar": "Going to the beach early is often a better strategy than leaving it until after an unstable afternoon.", "movimiento": "The city begins preparing for summer and the end of the year.", "eventos": "November public holidays can create long weekends, operational changes and increased demand.", "precios": "High-season conditions begin approaching on some dates.", "maleta": "Very light clothing, sunscreen, hydration and a compact waterproof layer.", "ideal": "Outdoor activities in the morning, beach, weather-confirmed excursions and culture as Plan B.", "ojo": "Check radar/alerts before hiking and do not ignore electrical storms.", "ernestinho": "In November I move everything that depends on the sky earlier and keep the afternoon flexible."}, {"mes": "DECEMBER", "icon": "🎆", "titulo": "Summer + Christmas + New Year's Eve", "clima": "Heat, humidity and summer rain. Long days, a busy beachfront and a city that changes rhythm.", "mar": "The beach is central, but on very busy days protect your belongings and agree on prices before ordering.", "movimiento": "The second half of the month can be extremely busy. Copacabana changes completely around New Year's Eve.", "eventos": "Christmas, concerts, parties and especially Copacabana New Year's Eve. Operations, access and transportation require specific planning.", "precios": "One of the most expensive and competitive periods for accommodation, especially around Copacabana and New Year.", "maleta": "Full summer gear: sunscreen, fresh clothing, comfortable shoes and practical luggage for crowds.", "ideal": "Experiencing Rio's summer and, if that is your goal, one of the world's most famous New Year's Eve celebrations.", "ojo": "For December 31, do not improvise accommodation, your return journey or meeting point. Access rules can change each year.", "ernestinho": "If you are coming for New Year's Eve, book ahead. That week Copacabana does not operate like a normal December week."}]}, "ui": {"es": {"kicker": "📅 CUÁNDO VIENES CAMBIA TODO", "title": "Mes, lluvia y calor también diseñan el viaje.", "tabs": ["📆 Mes a mes", "🌧️ Lluvia", "🥵 Calor"], "labels": ["🌡️ Clima", "🌊 Playa y mar", "👥 Movimiento", "🎉 Eventos", "💰 Precios y reservas", "🧳 Qué llevar", "❤️ Ideal para", "⚠️ Ojo con"], "tip": "⭐ MI CONSEJO ERNESTINHO"}, "pt": {"kicker": "📅 QUANDO VOCÊ VEM MUDA TUDO", "title": "Mês, chuva e calor também desenham a viagem.", "tabs": ["📆 Mês a mês", "🌧️ Chuva", "🥵 Calor"], "labels": ["🌡️ Clima", "🌊 Praia e mar", "👥 Movimento", "🎉 Eventos", "💰 Preços e reservas", "🧳 O que levar", "❤️ Ideal para", "⚠️ Atenção"], "tip": "⭐ MINHA DICA ERNESTINHO"}, "en": {"kicker": "📅 WHEN YOU COME CHANGES EVERYTHING", "title": "Month, rain and heat also shape your trip.", "tabs": ["📆 Month by month", "🌧️ Rain", "🥵 Heat"], "labels": ["🌡️ Weather", "🌊 Beach and sea", "👥 Crowds", "🎉 Events", "💰 Prices and bookings", "🧳 What to pack", "❤️ Ideal for", "⚠️ Watch out for"], "tip": "⭐ MY ERNESTINHO TIP"}}, "rain": {"es": [["Estoy en Copacabana", "Café/padaria → opción cultural cercana → comida → revaluar lluvia."], ["Estoy en Ipanema/Leblon", "Café/comida → shopping/cultura cercana → volver a exterior si abre."], ["Estoy en Botafogo", "Cultura/café → gastronomía → shopping como refugio práctico."], ["Estoy en Centro", "CCBB / mus
